<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Endpoint Diff</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 0 0 18px;
    }

    .metric {
      min-width: 0;
      padding: 16px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(16px, 2vw, 26px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .filter-button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    .filter-button:hover,
    .filter-button:focus-visible,
    .filter-button.active {
      border-color: #2468f2;
      background: #eef4ff;
      outline: none;
    }

    .info-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 0;
    }

    .info-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1020px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr.diff-newer td {
      background: #eaf7ed;
    }

    tr.diff-newer td:first-child {
      box-shadow: inset 4px 0 0 #22c55e;
    }

    tr.diff-disappeared td {
      background: #fff0d6;
    }

    tr.diff-disappeared td:first-child {
      box-shadow: inset 4px 0 0 #f59e0b;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .filters {
        justify-content: flex-start;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Endpoint Database</p>
      <h1 id="page-title">Endpoint Diff</h1>
    </section>

    <p class="status" id="diff-message">Loading endpoint diff from enterprise_endpoints.db...</p>
    <section class="summary-grid" id="diff-summary"></section>
    <section class="controls" aria-label="Endpoint diff controls">
      <input class="search-input" type="search" id="diff-search" placeholder="Search site, network device, endpoint IP, MAC, VLAN, hostname, or state" autocomplete="off">
      <div class="filters" id="diff-filters">
        <button class="filter-button active" type="button" data-filter="all">all</button>
        <button class="filter-button" type="button" data-filter="newer">newer</button>
        <button class="filter-button" type="button" data-filter="disappeared">disappeared</button>
      </div>
    </section>
    <section id="diff-results"></section>
    <section class="info-actions" id="diff-snapshot-info" aria-label="Snapshot information"></section>
  </main>

  <script>
    const pageTitleEl = document.getElementById("page-title");
    const diffMessageEl = document.getElementById("diff-message");
    const diffSummaryEl = document.getElementById("diff-summary");
    const diffSearchEl = document.getElementById("diff-search");
    const diffFiltersEl = document.getElementById("diff-filters");
    const diffResultsEl = document.getElementById("diff-results");
    const diffSnapshotInfoEl = document.getElementById("diff-snapshot-info");
    const siteId = new URLSearchParams(window.location.search).get("site") || "";
    const diffFile = `/api/enterprise_endpoint_diff${siteId ? `?site=${encodeURIComponent(siteId)}` : ""}`;
    let diffData = null;
    let diffRows = [];
    let diffFilter = "all";

    function escapeHtml(value) {
      return String(value ?? "-").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function normalizeRows(rows) {
      return rows.map((row) => ({
        state: row.diff_state || "-",
        label: row.diff_label || "-",
        site: row.site || "-",
        device: row.device_fqdn || "-",
        hostname: row.hostname || "-",
        entryIp: row.entry_ip || "-",
        entryMac: row.entry_mac || "-",
        vlan: row.entry_vlan || "-",
        devicePort: row.device_port || row.entry_port || "-",
        firstSeen: row.first_seen || "-",
        lastSeen: row.last_seen || "-",
        status: row.active || row.status || "-"
      }));
    }

    function rowMatchesQuery(row, query) {
      if (!query) {
        return true;
      }

      return Object.values(row).some((value) => String(value).toLowerCase().includes(query));
    }

    function filteredRows() {
      const query = diffSearchEl.value.trim().toLowerCase();
      return diffRows
        .filter((row) => diffFilter === "all" || row.state === diffFilter)
        .filter((row) => rowMatchesQuery(row, query));
    }

    function renderSummary() {
      const summary = diffData?.summary || {};
      diffSummaryEl.innerHTML = `
        <article class="metric">
          <span>Total Endpoints</span>
          <strong>${escapeHtml(summary.total ?? 0)}</strong>
        </article>
        <article class="metric">
          <span>Newer</span>
          <strong>${escapeHtml(summary.newer ?? 0)}</strong>
        </article>
        <article class="metric">
          <span>Disappeared</span>
          <strong>${escapeHtml(summary.disappeared ?? 0)}</strong>
        </article>
      `;
    }

    function renderSnapshotInfo() {
      diffSnapshotInfoEl.innerHTML = `
        <span class="info-button">current snapshot: ${escapeHtml(diffData?.current_snapshot || "-")}</span>
        <span class="info-button">previous snapshot: ${escapeHtml(diffData?.previous_snapshot || "-")}</span>
        <span class="info-button">source: enterprise_endpoints.db</span>
      `;
    }

    function renderResults() {
      const rows = filteredRows();
      const siteLabel = siteId ? ` for site ${siteId}` : "";

      if (rows.length === 0) {
        diffMessageEl.textContent = `Showing 0 of ${diffRows.length} changed endpoints${siteLabel}`;
        diffResultsEl.innerHTML = '<div class="empty">No changed endpoints match the current filter.</div>';
        return;
      }

      const body = rows.map((row) => `
        <tr class="${row.state === "newer" ? "diff-newer" : "diff-disappeared"}">
          <td>${escapeHtml(row.label)}</td>
          <td>${escapeHtml(row.site)}</td>
          <td>${escapeHtml(row.device)}</td>
          <td>${escapeHtml(row.hostname)}</td>
          <td>${escapeHtml(row.entryIp)}</td>
          <td>${escapeHtml(row.entryMac)}</td>
          <td>${escapeHtml(row.vlan)}</td>
          <td>${escapeHtml(row.devicePort)}</td>
          <td>${escapeHtml(row.status)}</td>
          <td>${escapeHtml(row.firstSeen)}</td>
          <td>${escapeHtml(row.lastSeen)}</td>
        </tr>
      `).join("");

      diffMessageEl.textContent = `Showing ${rows.length} of ${diffRows.length} changed endpoints${siteLabel}`;
      diffResultsEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Diff</th>
                <th>Site</th>
                <th>Network Device</th>
                <th>Hostname</th>
                <th>Endpoint IP</th>
                <th>Endpoint MAC</th>
                <th>VLAN</th>
                <th>device_port</th>
                <th>STATUS</th>
                <th>first_seen</th>
                <th>last_seen</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    async function loadDiff() {
      if (siteId) {
        pageTitleEl.textContent = `Endpoint Diff ${siteId}`;
      }

      try {
        const response = await fetch(diffFile, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${diffFile} (${response.status})`);
        }

        diffData = await response.json();
        diffRows = [
          ...normalizeRows(diffData.newer || []),
          ...normalizeRows(diffData.disappeared || [])
        ];
        renderSummary();
        renderResults();
        renderSnapshotInfo();
      } catch (error) {
        diffMessageEl.textContent = "Unable to load endpoint diff.";
        diffSummaryEl.innerHTML = "";
        diffSnapshotInfoEl.innerHTML = "";
        diffResultsEl.innerHTML = '<div class="error">Start the Polaris Flask server with python3 serve_polaris.py so the page can read enterprise_endpoints.db.</div>';
        console.error(error);
      }
    }

    diffFiltersEl.addEventListener("click", (event) => {
      const button = event.target.closest(".filter-button");
      if (!button) {
        return;
      }

      diffFilter = button.dataset.filter;
      diffFiltersEl.querySelectorAll(".filter-button").forEach((filterButton) => {
        filterButton.classList.toggle("active", filterButton === button);
      });
      renderResults();
    });
    diffSearchEl.addEventListener("input", renderResults);
    loadDiff();
  </script>
</body>
</html>
