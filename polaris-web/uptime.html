<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Device Status</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .page-heading {
      min-width: 0;
      flex: 1 1 auto;
      text-align: center;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .back-button {
      border-color: #8a94a6;
      background: #ffffff;
      color: #344054;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .back-button:hover,
    .back-button:focus-visible {
      border-color: #2468f2;
      background: #ffffff;
      color: #2468f2;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .search-bar {
      margin: 28px 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    main.table-full-width:has(#table-size) {
      width: calc(100% - 24px);
      max-width: none;
    }

    .table-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 14px;
    }

    .table-controls label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .table-controls output {
      min-width: 4ch;
    }

    #uptime-results > .table-wrap > table {
      width: 100%;
    }

    #uptime-results > .table-wrap {
      width: calc(100% * var(--table-frame-scale, 1));
      max-width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    .sort-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: inherit;
      text-align: left;
      text-transform: inherit;
    }

    .sort-button:focus-visible {
      outline: 3px solid rgba(36, 104, 242, 0.22);
      outline-offset: 2px;
    }

    .sort-indicator {
      color: #667080;
      font-size: 11px;
    }

    .details-button {
      min-width: 36px;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid #8a94a6;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      line-height: 1;
    }

    .details-button:hover,
    .details-button:focus-visible {
      border-color: #2468f2;
      color: #2468f2;
      outline: none;
    }

    .details-row td {
      background: #f8fafc;
    }

    .details-table {
      min-width: 0;
      box-shadow: none;
    }

    .details-table table {
      min-width: 520px;
    }

    .uptime-chart-section {
      margin: 18px 0;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    .uptime-chart-section summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      list-style: none;
      background: #eef3f8;
      color: #172033;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .uptime-chart-section summary::-webkit-details-marker {
      display: none;
    }

    .uptime-chart-section summary::after {
      width: 9px;
      height: 9px;
      content: "";
      flex: 0 0 auto;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.16s ease;
    }

    .uptime-chart-section[open] summary::after {
      transform: rotate(225deg);
    }

    .uptime-chart-count {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #ffffff;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      text-transform: none;
      white-space: nowrap;
    }

    .uptime-chart-body {
      max-height: 620px;
      padding: 16px;
      overflow: auto;
    }

    .uptime-chart-note {
      margin: 0 0 14px;
      color: #667080;
      font-size: 13px;
      font-weight: 700;
    }

    .uptime-chart {
      display: grid;
      gap: 8px;
    }

    .uptime-chart-row {
      display: grid;
      grid-template-columns: minmax(210px, 280px) minmax(180px, 1fr) minmax(78px, auto);
      align-items: center;
      gap: 10px;
    }

    .uptime-chart-label {
      min-width: 0;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .uptime-chart-label span {
      display: block;
      color: #667080;
      font-size: 11px;
      font-weight: 700;
    }

    .uptime-chart-track {
      height: 14px;
      border-radius: 999px;
      background: #e4e9f1;
      overflow: hidden;
    }

    .uptime-chart-bar {
      min-width: 2px;
      height: 100%;
      border-radius: 999px;
      background: #2468f2;
    }

    .uptime-chart-value {
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .page-heading {
        text-align: left;
      }

      .nav-actions {
        margin-left: -12px;
      }

      .uptime-chart-row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .uptime-chart-value {
        text-align: left;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <div class="page-heading" aria-labelledby="page-title">
        <h1 id="page-title">Device Status</h1>
      </div>
      <nav class="nav-actions" aria-label="Page actions">
        <a class="home-button back-button" href="/polaris-web/index.html" id="back-link" hidden>back</a>
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <div class="search-bar">
      <input class="search-input" type="search" id="uptime-search" placeholder="Search all columns or use filters like site:422 device:core serial:ABC type:access_point uptime:day" autocomplete="off">
    </div>
    <div class="table-controls" aria-label="Table actions">
      <button class="details-button" type="button" id="refresh-inventory">refresh</button>
      <button class="details-button" type="button" id="export-device-status" hidden disabled>export to csv</button>
    </div>
    <section id="uptime-results"></section>
    <details class="uptime-chart-section" id="vlan-mac-section">
      <summary>MAC addresses by device and VLAN</summary>
      <div class="uptime-chart-body">
        <input class="search-input" type="search" id="vlan-mac-search" aria-label="Search VLAN MAC counts" placeholder="Search device, site, VLAN ID or VLAN name" autocomplete="off">
        <div id="vlan-mac-results" aria-live="polite">Loading VLAN MAC counts...</div>
        <p class="status" style="margin-top: 14px;">Per-device MAC counts from IFSTATE_status.db / vlan_mac_counts; counts are not unique across devices.</p>
      </div>
    </details>
    <div class="table-controls" aria-label="Table size controls">
      <label for="table-size">table width
        <input type="range" id="table-size" min="50" max="100" step="5" value="100">
        <output id="table-size-value" for="table-size">100%</output>
      </label>
      <label><input type="checkbox" id="table-full-width">full width</label>
    </div>
    <p class="status" id="uptime-count" style="margin: 18px 0 0;">Loading Device Status data...</p>
  </main>

  <script>
    const uptimeSearchEl = document.getElementById("uptime-search");
    const uptimeCountEl = document.getElementById("uptime-count");
    const uptimeResultsEl = document.getElementById("uptime-results");
    const pageTitleEl = document.getElementById("page-title");
    const backLinkEl = document.getElementById("back-link");
    const selectedSite = new URLSearchParams(window.location.search).get("site");
    const exportDeviceStatusEl = document.getElementById("export-device-status");
    exportDeviceStatusEl.hidden = !selectedSite;
    let visibleDeviceRows = [];
    let inventoryReady = false;
    const inventoryFile = "/api/inventory";
    const inventoryDataName = "inventory.db";
    const siteSorter = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
    const columns = [
      { key: "site", label: "Site" },
      { key: "device", label: "Device" },
      { key: "ipAddress", label: "IP Address" },
      { key: "deviceUptime", label: "device_uptime" },
      { key: "serialNumber", label: "serial_number" },
      { key: "deviceModel", label: "device_model" },
      { key: "osVersion", label: "os_version" },
      { key: "haStatus", label: "HA" },
      { key: "portAvailable", label: "port_available" },
      { key: "portInUse", label: "port_in_use" },
      { key: "detailsAction", label: "Details", action: true }
    ];
    const aliases = {
      site: "site",
      device: "device",
      fqdn: "device",
      tech: "techRoom",
      techroom: "techRoom",
      tech_room: "techRoom",
      room: "techRoom",
      ip: "ipAddress",
      ipaddress: "ipAddress",
      ip_address: "ipAddress",
      member: "member",
      serial: "serialNumber",
      serialnumber: "serialNumber",
      serial_number: "serialNumber",
      type: "deviceType",
      devicetype: "deviceType",
      device_type: "deviceType",
      role: "deviceRole",
      devicerole: "deviceRole",
      device_role: "deviceRole",
      model: "deviceModel",
      devicemodel: "deviceModel",
      device_model: "deviceModel",
      os: "osVersion",
      version: "osVersion",
      osversion: "osVersion",
      os_version: "osVersion",
      uptime: "deviceUptime",
      deviceuptime: "deviceUptime",
      device_uptime: "deviceUptime",
      ha: "haStatus",
      hastatus: "haStatus",
      ha_status: "haStatus",
      address: "physicalAddress",
      physicaladdress: "physicalAddress",
      physical_address: "physicalAddress"
    };
    let uptimeRows = [];
    let uptimeUpdated = "";
    let uptimeSort = { key: "device", direction: "desc" };
    let uptimeChartOpen = false;
    const expandedDetailKeys = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (character === '"' && inQuotes && nextCharacter === '"') {
          field += '"';
          index += 1;
        } else if (character === '"') {
          inQuotes = !inQuotes;
        } else if (character === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((character === "\n" || character === "\r") && !inQuotes) {
          if (character === "\r" && nextCharacter === "\n") {
            index += 1;
          }
          row.push(field);
          if (row.some((value) => value.trim() !== "")) {
            rows.push(row);
          }
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field);
      if (row.some((value) => value.trim() !== "")) {
        rows.push(row);
      }

      const headers = rows.shift() || [];
      return rows.map((columns) => Object.fromEntries(headers.map((header, index) => [
        header,
        columns[index]?.trim() || ""
      ])));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function normalizeRows(rows) {
      return rows.map((row) => {
        const normalized = {
          site: getFirstValue(row, ["Site", "site"]),
          device: getFirstValue(row, ["FQDN", "fqdn", "Device", "device"]),
          ipAddress: getFirstValue(row, ["IP_Address", "ip_address", "ipAddress"]),
          techRoom: getFirstValue(row, ["Tech_Room", "tech_room", "Tech Room", "techRoom"]),
          serialNumber: row.serial_number ?? "",
          deviceType: getFirstValue(row, ["device_type", "Device_Type", "deviceType"]),
          deviceRole: getFirstValue(row, ["device_role", "Device_Role", "deviceRole"]),
          deviceModel: row.device_model ?? "",
          osVersion: row.os_version ?? "",
          deviceUptime: row.device_uptime ?? "",
          haStatus: row.ha_status ?? "",
          portAvailable: row.port_available ?? "",
          portInUse: row.port_in_use ?? "",
          physicalAddress: getFirstValue(row, ["physical_address", "Physical_Address", "physicalAddress"]),
          details: row
        };
        normalized.detailKey = `${normalized.site}|${normalized.device}|${normalized.ipAddress}|${normalized.serialNumber}`;
        return normalized;
      });
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function rowMatchesToken(row, token) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key);

        if (columnKey && value) {
          return valueMatches(row[columnKey], value);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesSearch(row, query) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token));
    }

    function compareValues(left, right, key) {
      return siteSorter.compare(String(left[key] ?? ""), String(right[key] ?? ""));
    }

    function isAccessPointRow(row) {
      return String(row.deviceType || "").trim().toLowerCase() === "access_point";
    }

    function sortedRows(rows) {
      const direction = uptimeSort.direction === "desc" ? -1 : 1;
      return [...rows].sort((left, right) => {
        const accessPointPriority = Number(isAccessPointRow(left)) - Number(isAccessPointRow(right));
        const primary = compareValues(left, right, uptimeSort.key);
        const secondary = siteSorter.compare(left.site, right.site) || siteSorter.compare(left.device, right.device);
        return accessPointPriority || ((primary || secondary) * direction);
      });
    }

    function sortIndicator(column) {
      return "";
    }

    function parseDeviceUptimeHours(value) {
      const text = String(value || "").trim().toLowerCase();
      if (!text || text === "-") {
        return null;
      }

      let totalHours = 0;
      let matched = false;
      const unitPattern = /(\d+(?:\.\d+)?)\s*(years?|yrs?|weeks?|days?|hours?|hrs?|minutes?|mins?|seconds?|secs?|[ywdhms])(?=\d|\b)/g;
      for (const match of text.matchAll(unitPattern)) {
        matched = true;
        const amount = Number(match[1]);
        const unit = match[2];
        if (unit.startsWith("y")) {
          totalHours += amount * 365 * 24;
        } else if (unit.startsWith("w")) {
          totalHours += amount * 7 * 24;
        } else if (unit.startsWith("d")) {
          totalHours += amount * 24;
        } else if (unit.startsWith("h")) {
          totalHours += amount;
        } else if (unit.startsWith("m")) {
          totalHours += amount / 60;
        } else if (unit.startsWith("s")) {
          totalHours += amount / 3600;
        }
      }

      const clockMatch = text.match(/(?:^|[,\s])(\d+):(\d{2})(?::(\d{2}))?(?:$|[,\s])/);
      if (clockMatch) {
        matched = true;
        totalHours += Number(clockMatch[1]);
        totalHours += Number(clockMatch[2]) / 60;
        totalHours += Number(clockMatch[3] || 0) / 3600;
      }

      return matched ? totalHours : null;
    }

    function formatUptimeDuration(hours) {
      if (!Number.isFinite(hours)) {
        return "-";
      }

      const days = Math.floor(hours / 24);
      const remainingHours = Math.floor(hours % 24);
      if (days >= 1) {
        return `${days}d ${remainingHours}h`;
      }

      const minutes = Math.round((hours % 1) * 60);
      if (remainingHours >= 1) {
        return `${remainingHours}h ${minutes}m`;
      }

      return `${minutes}m`;
    }

    function uptimeChartRows(rows) {
      return rows
        .map((row) => ({
          ...row,
          uptimeHours: parseDeviceUptimeHours(row.deviceUptime)
        }))
        .filter((row) => row.uptimeHours !== null)
        .sort((left, right) => (
          right.uptimeHours - left.uptimeHours ||
          siteSorter.compare(left.site, right.site) ||
          siteSorter.compare(left.device, right.device)
        ));
    }

    function renderUptimeChart(rows) {
      const chartRows = uptimeChartRows(rows);
      const maxHours = Math.max(...chartRows.map((row) => row.uptimeHours), 0);
      const scopeLabel = selectedSite ? `site ${selectedSite}` : "all sites";
      const body = chartRows.map((row) => {
        const width = maxHours > 0 ? Math.max((row.uptimeHours / maxHours) * 100, 1) : 1;
        return `
          <div class="uptime-chart-row">
            <div class="uptime-chart-label" title="${escapeHtml(row.device)}">
              ${escapeHtml(row.device)}
              <span>${escapeHtml(row.site)} | ${escapeHtml(row.deviceType || "-")}</span>
            </div>
            <div class="uptime-chart-track" aria-hidden="true">
              <div class="uptime-chart-bar" style="width: ${width.toFixed(2)}%"></div>
            </div>
            <div class="uptime-chart-value" title="${escapeHtml(row.deviceUptime)}">${escapeHtml(formatUptimeDuration(row.uptimeHours))}</div>
          </div>
        `;
      }).join("");

      return `
        <details class="uptime-chart-section" id="uptime-chart-section" ${uptimeChartOpen ? "open" : ""}>
          <summary>
            <span>device uptime graph</span>
            <span class="uptime-chart-count">${chartRows.length} device${chartRows.length === 1 ? "" : "s"}</span>
          </summary>
          <div class="uptime-chart-body">
            <p class="uptime-chart-note">Uptime values from inventory.db for ${escapeHtml(scopeLabel)}. Search filters also apply to this graph.</p>
            ${chartRows.length ? `<div class="uptime-chart">${body}</div>` : '<div class="empty">No device uptime values found for the current filter.</div>'}
          </div>
        </details>
      `;
    }

    function renderDetailValue(value) {
      if (value === null || value === undefined) {
        return "";
      }

      if (typeof value === "object") {
        return JSON.stringify(value);
      }

      return value;
    }

    function renderDeviceDetails(row) {
      const generatedKeys = new Set([
        "backup_config",
        "backup_config_exists",
        "backup_config_date",
        "backup_config_file"
      ]);
      const detailRows = Object.entries(row.details || {})
        .filter(([key]) => !generatedKeys.has(key))
        .map(([key, value]) => `
          <tr>
            <td>${escapeHtml(key)}</td>
            <td>${escapeHtml(renderDetailValue(value))}</td>
          </tr>
        `).join("");

      return `
        <div class="table-wrap details-table">
          <table>
            <thead>
              <tr>
                <th>Field</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody>${detailRows || '<tr><td colspan="2">No details found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        return '<div class="empty">No records match the current search.</div>';
      }

      const headers = columns.map((column) => `
        <th>
          ${column.action ? escapeHtml(column.label) : `
          <button class="sort-button" type="button" data-uptime-sort="${escapeHtml(column.key)}">
            <span>${escapeHtml(column.label)}</span>
            <span class="sort-indicator">${escapeHtml(sortIndicator(column))}</span>
          </button>`}
        </th>
      `).join("");
      const body = rows.map((row) => {
        const expanded = expandedDetailKeys.has(row.detailKey);
        return `
          <tr>
            ${columns.map((column) => {
              if (column.action) {
                return `
                  <td>
                    <button class="details-button" type="button" data-detail-key="${escapeHtml(row.detailKey)}" aria-expanded="${expanded}">
                      ${expanded ? "hide" : "..."}
                    </button>
                  </td>
                `;
              }
              return `<td>${escapeHtml(row[column.key] ?? "-")}</td>`;
            }).join("")}
          </tr>
          ${expanded ? `<tr class="details-row"><td colspan="${columns.length}">${renderDeviceDetails(row)}</td></tr>` : ""}
        `;
      }).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderResults() {
      const query = uptimeSearchEl.value.trim();
      const visibleRows = sortedRows(uptimeRows.filter((row) => rowMatchesSearch(row, query)));
      visibleDeviceRows = visibleRows;
      exportDeviceStatusEl.disabled = !inventoryReady || visibleRows.length === 0;
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${uptimeRows.length} network devices`
        : `Showing ${uptimeRows.length} network devices`;

      uptimeCountEl.textContent = `${countLabel} from ${inventoryDataName}${uptimeUpdated}`;
      uptimeResultsEl.innerHTML = `
        ${renderUptimeChart(visibleRows)}
        ${renderTable(visibleRows)}
      `;
    }

    let vlanMacRows = [];
    const vlanMacOpen = new Set();
    const vlanMacSort = new Map();
    const vlanMacResults = document.getElementById("vlan-mac-results");

    function compareVlanMacRows(a, b, direction) {
      const countOrder = (Number(a.entries) || 0) - (Number(b.entries) || 0);
      return (direction ? countOrder * (direction === "descending" ? -1 : 1) : 0)
        || siteSorter.compare(String(a.vlan_id), String(b.vlan_id));
    }

    function renderVlanMacCounts() {
      const query = document.getElementById("vlan-mac-search").value.trim().toLowerCase();
      const groups = new Map();
      for (const row of vlanMacRows) {
        if (query && ![row.site, row.device, row.vlan_id, row.vlan_name].some(value => String(value ?? "").toLowerCase().includes(query))) continue;
        const key = JSON.stringify([row.site, row.device]);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(row);
      }
      vlanMacResults.innerHTML = [...groups.entries()].map(([key, rows]) => {
        const direction = vlanMacSort.get(key);
        rows.sort((a, b) => compareVlanMacRows(a, b, direction));
        const total = rows.reduce((sum, row) => sum + (Number(row.entries) || 0), 0);
        return `<details class="uptime-chart-section" data-vlan-device="${escapeHtml(key)}" ${vlanMacOpen.has(key) ? "open" : ""}>
          <summary>${escapeHtml(rows[0].device)} | site ${escapeHtml(rows[0].site)} | ${rows.length} VLANs | ${total} MAC entries</summary>
          <div class="table-wrap"><table>
            <thead><tr><th>VLAN ID</th><th>VLAN name</th><th aria-sort="${direction || "none"}"><button type="button" class="sort-button" data-vlan-mac-sort title="Sort by MAC entries">MAC entries <span aria-hidden="true">${direction === "descending" ? "&#9660;" : direction === "ascending" ? "&#9650;" : "&#8597;"}</span></button></th><th>Queried at</th></tr></thead>
            <tbody>${rows.map(row => `<tr><td>${escapeHtml(row.vlan_id ?? "")}</td><td>${escapeHtml(row.vlan_name ?? "")}</td><td>${escapeHtml(row.entries ?? 0)}</td><td>${escapeHtml(row.queried_at ?? "")}</td></tr>`).join("")}</tbody>
          </table></div>
        </details>`;
      }).join("") || '<div class="empty">No VLAN MAC counts found for this site or search.</div>';
    }

    async function loadVlanMacCounts() {
      try {
        const url = selectedSite ? `/api/vlan_mac_counts?site=${encodeURIComponent(selectedSite)}` : "/api/vlan_mac_counts";
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load VLAN MAC counts (${response.status})`);
        const data = await response.json();
        vlanMacRows = data.counts || [];
        renderVlanMacCounts();
      } catch (error) {
        vlanMacRows = [];
        vlanMacResults.innerHTML = '<div class="error">Unable to load VLAN MAC counts from IFSTATE_status.db. Check that vlan_mac_counts exists and restart the server after updating.</div>';
      }
    }

    document.getElementById("vlan-mac-search").addEventListener("input", renderVlanMacCounts);
    vlanMacResults.addEventListener("click", event => {
      const button = event.target.closest("[data-vlan-mac-sort]");
      if (!button) return;
      const group = button.closest("[data-vlan-device]");
      const key = group.dataset.vlanDevice;
      const direction = vlanMacSort.get(key) === "descending" ? "ascending" : "descending";
      vlanMacSort.set(key, direction);
      const tbody = group.querySelector("tbody");
      const rows = [...tbody.rows];
      rows.sort((a, b) => compareVlanMacRows(
        { entries: a.cells[2].textContent, vlan_id: a.cells[0].textContent },
        { entries: b.cells[2].textContent, vlan_id: b.cells[0].textContent }, direction));
      // Reorder only this device's rows so focus and expanded sections stay intact.
      tbody.append(...rows);
      button.closest("th").setAttribute("aria-sort", direction);
      button.querySelector("span").innerHTML = direction === "descending" ? "&#9660;" : "&#9650;";
    });
    vlanMacResults.addEventListener("toggle", event => {
      const key = event.target.dataset.vlanDevice;
      if (key) {
        if (event.target.open) vlanMacOpen.add(key);
        else vlanMacOpen.delete(key);
      }
    }, true);

    async function loadUptime() {
      inventoryReady = false;
      visibleDeviceRows = [];
      exportDeviceStatusEl.disabled = true;
      try {
        const inventoryUrl = selectedSite ? `${inventoryFile}?site=${encodeURIComponent(selectedSite)}` : inventoryFile;
        const response = await fetch(inventoryUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${inventoryUrl} (${response.status})`);
        }

        const data = await response.json();
        uptimeUpdated = data.imported_at ? `, imported ${data.imported_at}` : "";
        uptimeRows = normalizeRows(data.devices || []);
        inventoryReady = true;
        renderResults();
      } catch (error) {
        uptimeRows = [];
        uptimeCountEl.textContent = "Unable to load Device Status data.";
        uptimeResultsEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read inventory.db.</div>';
        console.error(error);
      }
    }

    function deviceStatusCsv(rows) {
      const csvColumns = columns.filter(column => !column.action);
      const escapeCsv = value => {
        let text = String(value ?? "");
        // Prevent inventory text from being interpreted as spreadsheet formulas.
        if (/^[\s]*[=+@-]/.test(text)) text = "'" + text;
        return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
      };
      return [csvColumns.map(column => escapeCsv(column.label)).join(","),
        ...rows.map(row => csvColumns.map(column => escapeCsv(row[column.key])).join(","))
      ].join("\r\n") + "\r\n";
    }

    exportDeviceStatusEl.addEventListener("click", () => {
      if (!selectedSite || !inventoryReady || !visibleDeviceRows.length) return;
      const blob = new Blob(["\uFEFF", deviceStatusCsv(visibleDeviceRows)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `site_${selectedSite.replace(/[^a-zA-Z0-9_-]/g, "_")}_device_status.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    uptimeSearchEl.addEventListener("input", renderResults);
    document.getElementById("table-size").addEventListener("input", (event) => {
      const size = Number(event.target.value);
      const main = document.querySelector("main");
      main.style.setProperty("--table-frame-scale", size / 100);
      document.getElementById("table-size-value").value = `${size}%`;
    });
    document.getElementById("table-full-width").addEventListener("change", (event) => {
      document.querySelector("main").classList.toggle("table-full-width", event.target.checked);
    });
    document.getElementById("refresh-inventory").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        await loadUptime();
        await loadVlanMacCounts();
      } finally {
        button.disabled = false;
      }
    });
    uptimeResultsEl.addEventListener("click", (event) => {
      const detailButton = event.target.closest("[data-detail-key]");
      if (detailButton) {
        const key = detailButton.dataset.detailKey;
        if (expandedDetailKeys.has(key)) {
          expandedDetailKeys.delete(key);
        } else {
          expandedDetailKeys.add(key);
        }
        renderResults();
        return;
      }

      const sortButton = event.target.closest("[data-uptime-sort]");
      if (!sortButton) {
        return;
      }

      const key = sortButton.dataset.uptimeSort;
      uptimeSort = {
        key,
        direction: uptimeSort.key === key && uptimeSort.direction === "asc" ? "desc" : "asc"
      };
      renderResults();
    });
    uptimeResultsEl.addEventListener("toggle", (event) => {
      if (event.target.id === "uptime-chart-section") {
        uptimeChartOpen = event.target.open;
      }
    }, true);
    if (selectedSite) {
      pageTitleEl.textContent = `Device Status site ${selectedSite}`;
      backLinkEl.hidden = false;
      backLinkEl.href = `/polaris-web/site.html?site=${encodeURIComponent(selectedSite)}`;
      uptimeSearchEl.placeholder = `Search device status for site ${selectedSite} or use filters like device:core serial:ABC type:access_point uptime:day`;
    }

    loadUptime();
    loadVlanMacCounts();
  </script>
</body>
</html>
