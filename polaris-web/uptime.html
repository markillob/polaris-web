<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Device Status</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .page-heading {
      min-width: 0;
      flex: 1 1 auto;
      text-align: center;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .back-button {
      border-color: #8a94a6;
      background: #ffffff;
      color: #344054;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .back-button:hover,
    .back-button:focus-visible {
      border-color: #2468f2;
      background: #ffffff;
      color: #2468f2;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .search-bar {
      margin: 28px 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    .sort-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: inherit;
      text-align: left;
      text-transform: inherit;
    }

    .sort-button:focus-visible {
      outline: 3px solid rgba(36, 104, 242, 0.22);
      outline-offset: 2px;
    }

    .sort-indicator {
      color: #667080;
      font-size: 11px;
    }

    .details-button {
      min-width: 36px;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid #8a94a6;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      line-height: 1;
    }

    .details-button:hover,
    .details-button:focus-visible {
      border-color: #2468f2;
      color: #2468f2;
      outline: none;
    }

    .details-row td {
      background: #f8fafc;
    }

    .details-table {
      min-width: 0;
      box-shadow: none;
    }

    .details-table table {
      min-width: 520px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .page-heading {
        text-align: left;
      }

      .nav-actions {
        margin-left: -12px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <div class="page-heading" aria-labelledby="page-title">
        <h1 id="page-title">Device Status</h1>
      </div>
      <nav class="nav-actions" aria-label="Page actions">
        <a class="home-button back-button" href="/polaris-web/index.html" id="back-link" hidden>back</a>
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <div class="search-bar">
      <input class="search-input" type="search" id="uptime-search" placeholder="Search all columns or use filters like site:422 device:core serial:ABC type:access_point uptime:day" autocomplete="off">
    </div>
    <p class="status" id="uptime-count">Loading Device Status data...</p>
    <section id="uptime-results"></section>
  </main>

  <script>
    const uptimeSearchEl = document.getElementById("uptime-search");
    const uptimeCountEl = document.getElementById("uptime-count");
    const uptimeResultsEl = document.getElementById("uptime-results");
    const pageTitleEl = document.getElementById("page-title");
    const backLinkEl = document.getElementById("back-link");
    const selectedSite = new URLSearchParams(window.location.search).get("site");
    const inventoryFile = "/api/inventory";
    const inventoryDataName = "inventory.db";
    const siteSorter = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
    const columns = [
      { key: "site", label: "Site" },
      { key: "device", label: "Device" },
      { key: "ipAddress", label: "IP Address" },
      { key: "deviceUptime", label: "device_uptime" },
      { key: "serialNumber", label: "serial_number" },
      { key: "deviceModel", label: "device_model" },
      { key: "osVersion", label: "os_version" },
      { key: "haStatus", label: "HA" },
      { key: "detailsAction", label: "Details", action: true }
    ];
    const aliases = {
      site: "site",
      device: "device",
      fqdn: "device",
      tech: "techRoom",
      techroom: "techRoom",
      tech_room: "techRoom",
      room: "techRoom",
      ip: "ipAddress",
      ipaddress: "ipAddress",
      ip_address: "ipAddress",
      member: "member",
      serial: "serialNumber",
      serialnumber: "serialNumber",
      serial_number: "serialNumber",
      type: "deviceType",
      devicetype: "deviceType",
      device_type: "deviceType",
      role: "deviceRole",
      devicerole: "deviceRole",
      device_role: "deviceRole",
      model: "deviceModel",
      devicemodel: "deviceModel",
      device_model: "deviceModel",
      os: "osVersion",
      version: "osVersion",
      osversion: "osVersion",
      os_version: "osVersion",
      uptime: "deviceUptime",
      deviceuptime: "deviceUptime",
      device_uptime: "deviceUptime",
      ha: "haStatus",
      hastatus: "haStatus",
      ha_status: "haStatus",
      address: "physicalAddress",
      physicaladdress: "physicalAddress",
      physical_address: "physicalAddress"
    };
    let uptimeRows = [];
    let uptimeUpdated = "";
    let uptimeSort = { key: "device", direction: "desc" };
    const expandedDetailKeys = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (character === '"' && inQuotes && nextCharacter === '"') {
          field += '"';
          index += 1;
        } else if (character === '"') {
          inQuotes = !inQuotes;
        } else if (character === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((character === "\n" || character === "\r") && !inQuotes) {
          if (character === "\r" && nextCharacter === "\n") {
            index += 1;
          }
          row.push(field);
          if (row.some((value) => value.trim() !== "")) {
            rows.push(row);
          }
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field);
      if (row.some((value) => value.trim() !== "")) {
        rows.push(row);
      }

      const headers = rows.shift() || [];
      return rows.map((columns) => Object.fromEntries(headers.map((header, index) => [
        header,
        columns[index]?.trim() || ""
      ])));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function normalizeRows(rows) {
      return rows.map((row) => {
        const normalized = {
          site: getFirstValue(row, ["Site", "site"]),
          device: getFirstValue(row, ["FQDN", "fqdn", "Device", "device"]),
          ipAddress: getFirstValue(row, ["IP_Address", "ip_address", "ipAddress"]),
          techRoom: getFirstValue(row, ["Tech_Room", "tech_room", "Tech Room", "techRoom"]),
          serialNumber: getFirstValue(row, ["Serial_Number", "Member_Serial", "serial_number"]),
          deviceType: getFirstValue(row, ["device_type", "Device_Type", "deviceType"]),
          deviceRole: getFirstValue(row, ["device_role", "Device_Role", "deviceRole"]),
          deviceModel: getFirstValue(row, ["device_model", "Device_Model", "deviceModel"]),
          osVersion: getFirstValue(row, ["os_version", "OS_Version", "osVersion"]),
          deviceUptime: row.device_uptime || row.Device_Uptime || row.deviceUptime || row.uptime || "",
          haStatus: row.ha_status || row.HA_Status || row.haStatus || row.ha || "",
          physicalAddress: getFirstValue(row, ["physical_address", "Physical_Address", "physicalAddress"]),
          details: row
        };
        normalized.detailKey = `${normalized.site}|${normalized.device}|${normalized.ipAddress}|${normalized.serialNumber}`;
        return normalized;
      });
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function rowMatchesToken(row, token) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key);

        if (columnKey && value) {
          return valueMatches(row[columnKey], value);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesSearch(row, query) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token));
    }

    function compareValues(left, right, key) {
      return siteSorter.compare(String(left[key] ?? ""), String(right[key] ?? ""));
    }

    function isAccessPointRow(row) {
      return String(row.deviceType || "").trim().toLowerCase() === "access_point";
    }

    function sortedRows(rows) {
      const direction = uptimeSort.direction === "desc" ? -1 : 1;
      return [...rows].sort((left, right) => {
        const accessPointPriority = Number(isAccessPointRow(left)) - Number(isAccessPointRow(right));
        const primary = compareValues(left, right, uptimeSort.key);
        const secondary = siteSorter.compare(left.site, right.site) || siteSorter.compare(left.device, right.device);
        return accessPointPriority || ((primary || secondary) * direction);
      });
    }

    function sortIndicator(column) {
      return "";
    }

    function renderDetailValue(value) {
      if (value === null || value === undefined) {
        return "";
      }

      if (typeof value === "object") {
        return JSON.stringify(value);
      }

      return value;
    }

    function renderDeviceDetails(row) {
      const generatedKeys = new Set([
        "backup_config",
        "backup_config_exists",
        "backup_config_date",
        "backup_config_file"
      ]);
      const detailRows = Object.entries(row.details || {})
        .filter(([key]) => !generatedKeys.has(key))
        .map(([key, value]) => `
          <tr>
            <td>${escapeHtml(key)}</td>
            <td>${escapeHtml(renderDetailValue(value))}</td>
          </tr>
        `).join("");

      return `
        <div class="table-wrap details-table">
          <table>
            <thead>
              <tr>
                <th>Field</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody>${detailRows || '<tr><td colspan="2">No details found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        return '<div class="empty">No records match the current search.</div>';
      }

      const headers = columns.map((column) => `
        <th>
          ${column.action ? escapeHtml(column.label) : `
          <button class="sort-button" type="button" data-uptime-sort="${escapeHtml(column.key)}">
            <span>${escapeHtml(column.label)}</span>
            <span class="sort-indicator">${escapeHtml(sortIndicator(column))}</span>
          </button>`}
        </th>
      `).join("");
      const body = rows.map((row) => {
        const expanded = expandedDetailKeys.has(row.detailKey);
        return `
          <tr>
            ${columns.map((column) => {
              if (column.action) {
                return `
                  <td>
                    <button class="details-button" type="button" data-detail-key="${escapeHtml(row.detailKey)}" aria-expanded="${expanded}">
                      ${expanded ? "hide" : "..."}
                    </button>
                  </td>
                `;
              }
              return `<td>${escapeHtml(row[column.key] ?? "-")}</td>`;
            }).join("")}
          </tr>
          ${expanded ? `<tr class="details-row"><td colspan="${columns.length}">${renderDeviceDetails(row)}</td></tr>` : ""}
        `;
      }).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderResults() {
      const query = uptimeSearchEl.value.trim();
      const visibleRows = sortedRows(uptimeRows.filter((row) => rowMatchesSearch(row, query)));
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${uptimeRows.length} network devices`
        : `Showing ${uptimeRows.length} network devices`;

      uptimeCountEl.textContent = `${countLabel} from ${inventoryDataName}${uptimeUpdated}`;
      uptimeResultsEl.innerHTML = renderTable(visibleRows);
    }

    async function loadUptime() {
      try {
        const inventoryUrl = selectedSite ? `${inventoryFile}?site=${encodeURIComponent(selectedSite)}` : inventoryFile;
        const response = await fetch(inventoryUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${inventoryUrl} (${response.status})`);
        }

        const data = await response.json();
        uptimeUpdated = data.imported_at ? `, imported ${data.imported_at}` : "";
        uptimeRows = normalizeRows(data.devices || []);
        renderResults();
      } catch (error) {
        uptimeCountEl.textContent = "Unable to load Device Status data.";
        uptimeResultsEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read inventory.db.</div>';
        console.error(error);
      }
    }

    uptimeSearchEl.addEventListener("input", renderResults);
    uptimeResultsEl.addEventListener("click", (event) => {
      const detailButton = event.target.closest("[data-detail-key]");
      if (detailButton) {
        const key = detailButton.dataset.detailKey;
        if (expandedDetailKeys.has(key)) {
          expandedDetailKeys.delete(key);
        } else {
          expandedDetailKeys.add(key);
        }
        renderResults();
        return;
      }

      const sortButton = event.target.closest("[data-uptime-sort]");
      if (!sortButton) {
        return;
      }

      const key = sortButton.dataset.uptimeSort;
      uptimeSort = {
        key,
        direction: uptimeSort.key === key && uptimeSort.direction === "asc" ? "desc" : "asc"
      };
      renderResults();
    });
    if (selectedSite) {
      pageTitleEl.textContent = `Device Status site ${selectedSite}`;
      backLinkEl.hidden = false;
      backLinkEl.href = `/polaris-web/site.html?site=${encodeURIComponent(selectedSite)}`;
      uptimeSearchEl.placeholder = `Search device status for site ${selectedSite} or use filters like device:core serial:ABC type:access_point uptime:day`;
    }

    loadUptime();
  </script>
</body>
</html>
