<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Device Status</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .search-bar {
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .hero {
        margin: 36px auto 24px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Operations</p>
      <h1 id="page-title">Device Status</h1>
    </section>

    <div class="search-bar">
      <input class="search-input" type="search" id="uptime-search" placeholder="Search all columns or use filters like site:422 device:core serial:VN56 uptime:weeks code:17" autocomplete="off">
    </div>
    <p class="status" id="uptime-count">Loading Device Status data...</p>
    <section id="uptime-results"></section>
  </main>

  <script>
    const uptimeSearchEl = document.getElementById("uptime-search");
    const uptimeCountEl = document.getElementById("uptime-count");
    const uptimeResultsEl = document.getElementById("uptime-results");
    const operationsDataFile = "/polaris/data/site_operations.json";
    const operationsDataName = operationsDataFile.split("/").pop();
    const siteSorter = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
    const columns = [
      { key: "site", label: "Site" },
      { key: "device", label: "Device" },
      { key: "techRoom", label: "Tech Room" },
      { key: "serialNumber", label: "Serial Number" },
      { key: "uptime", label: "uptime" },
      { key: "codeVersion", label: "code_version" }
    ];
    const aliases = {
      site: "site",
      device: "device",
      fqdn: "device",
      tech: "techRoom",
      techroom: "techRoom",
      tech_room: "techRoom",
      room: "techRoom",
      ip: "ipAddress",
      ipaddress: "ipAddress",
      ip_address: "ipAddress",
      member: "member",
      serial: "serialNumber",
      serialnumber: "serialNumber",
      serial_number: "serialNumber",
      uptime: "uptime",
      code: "codeVersion",
      codeversion: "codeVersion",
      code_version: "codeVersion",
      version: "codeVersion"
    };
    let uptimeRows = [];
    let uptimeUpdated = "";

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (character === '"' && inQuotes && nextCharacter === '"') {
          field += '"';
          index += 1;
        } else if (character === '"') {
          inQuotes = !inQuotes;
        } else if (character === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((character === "\n" || character === "\r") && !inQuotes) {
          if (character === "\r" && nextCharacter === "\n") {
            index += 1;
          }
          row.push(field);
          if (row.some((value) => value.trim() !== "")) {
            rows.push(row);
          }
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field);
      if (row.some((value) => value.trim() !== "")) {
        rows.push(row);
      }

      const headers = rows.shift() || [];
      return rows.map((columns) => Object.fromEntries(headers.map((header, index) => [
        header,
        columns[index]?.trim() || ""
      ])));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function normalizeRows(rows) {
      return rows.map((row) => ({
        site: getFirstValue(row, ["Site", "site"]),
        device: getFirstValue(row, ["FQDN", "fqdn", "Device", "device"]),
        techRoom: getFirstValue(row, ["Tech_Room", "tech_room", "Tech Room", "techRoom"]),
        ipAddress: getFirstValue(row, ["IP_Address", "ip_address"]),
        member: getFirstValue(row, ["Member", "member"]),
        serialNumber: getFirstValue(row, ["Serial_Number", "Member_Serial", "serial_number"]),
        uptime: getFirstValue(row, ["Uptime", "Member_Uptime", "uptime"]),
        codeVersion: getFirstValue(row, ["Code_Version", "code_version", "Code Version", "codeVersion"])
      }));
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function rowMatchesToken(row, token) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key);

        if (columnKey && value) {
          return valueMatches(row[columnKey], value);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesSearch(row, query) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token));
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        return '<div class="empty">No records match the current search.</div>';
      }

      const headers = columns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join("");
      const body = rows.map((row) => `
        <tr>
          ${columns.map((column) => `<td>${escapeHtml(row[column.key] ?? "-")}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderResults() {
      const query = uptimeSearchEl.value.trim();
      const visibleRows = uptimeRows.filter((row) => rowMatchesSearch(row, query));
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${uptimeRows.length} Device Status records`
        : `Showing ${uptimeRows.length} Device Status records`;

      uptimeCountEl.textContent = `${countLabel} from ${operationsDataName}${uptimeUpdated}`;
      uptimeResultsEl.innerHTML = renderTable(visibleRows);
    }

    async function loadUptime() {
      try {
        const response = await fetch(operationsDataFile, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${operationsDataFile} (${response.status})`);
        }

        const data = await response.json();
        uptimeUpdated = data.last_updated ? `, updated ${data.last_updated}` : "";
        uptimeRows = normalizeRows(data.records || [])
          .sort((a, b) => siteSorter.compare(a.site, b.site) || a.device.localeCompare(b.device));
        renderResults();
      } catch (error) {
        uptimeCountEl.textContent = "Unable to load Device Status data.";
        uptimeResultsEl.innerHTML = '<div class="error">Unable to load Device Status data from /polaris/data.</div>';
        console.error(error);
      }
    }

    uptimeSearchEl.addEventListener("input", renderResults);
    loadUptime();
  </script>
</body>
</html>
