<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Site</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .site-heading {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 18px;
      text-align: center;
    }

    .site-heading h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .nav-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px 24px;
      margin: 48px auto 30px;
      text-align: left;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .hero-copy,
    .status {
      color: #485568;
      font-size: 18px;
      line-height: 1.55;
    }

    .hero-copy {
      max-width: 620px;
      margin: 0 auto;
    }

    .site-address {
      max-width: 720px;
      margin: 0;
      color: #485568;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .site-address a {
      color: #2468f2;
      font-weight: 800;
      text-decoration: none;
    }

    .site-address a:hover,
    .site-address a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .status {
      margin: 0 0 18px;
      font-size: 14px;
      text-align: center;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .section-title {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .site-summary {
      padding: 0;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      overflow: hidden;
    }

    .site-summary-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 12px 14px;
      cursor: pointer;
      list-style: none;
    }

    .site-summary-toggle::-webkit-details-marker {
      display: none;
    }

    .site-summary-title {
      flex: 0 0 auto;
      margin: 0;
      color: #39445a;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .site-summary-toggle-text {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .site-summary-hint {
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      text-transform: none;
    }

    .site-summary-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d8dee8;
      border-radius: 999px;
      background: #ffffff;
      color: #344054;
    }

    .site-summary-icon::before {
      width: 7px;
      height: 7px;
      content: "";
      display: block;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .site-summary[open] .site-summary-icon {
      transform: rotate(180deg);
    }

    .site-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 8px;
      padding: 0 14px 14px;
    }

    .summary-pill {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
    }

    .summary-pill-accent {
      border-color: #d8dee8;
      background: #ffffff;
      color: #344054;
    }

    .summary-pill-label {
      color: #667080;
      font-weight: 700;
    }

    .summary-pill-value {
      color: #172033;
      font-weight: 800;
    }

    .operation-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 0 0 28px;
    }

    .operation-button {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      appearance: none;
      background: #ffffff;
      color: #2468f2;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
    }

    .operation-button:hover,
    .operation-button:focus-visible,
    .operation-button.active {
      background: #2468f2;
      color: #ffffff;
      outline: none;
    }

    .photos-button {
      border-color: #7c3aed;
      color: #7c3aed;
    }

    .photos-button:hover,
    .photos-button:focus-visible,
    .photos-button.active {
      background: #7c3aed;
      color: #ffffff;
      outline: none;
    }

    .wireless-floorplan {
      margin-bottom: 16px;
    }

    .wireless-floorplan img {
      width: 100%;
      max-height: 720px;
      display: block;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      object-fit: contain;
    }

    .wireless-sub-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }

    .operation-panel {
      margin-bottom: 28px;
    }

    .panel-actions,
    .devices-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .secondary-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #8a94a6;
      border-radius: 8px;
      appearance: none;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
    }

    .secondary-button:hover,
    .secondary-button:focus-visible {
      border-color: #2468f2;
      color: #2468f2;
      outline: none;
    }

    .search-bar {
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .vlan-filter-panel {
      margin: 0 0 18px;
      padding: 14px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
    }

    .vlan-filter-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .vlan-filter-title {
      margin: 0;
      color: #39445a;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .vlan-filter-actions,
    .vlan-filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vlan-filter-options {
      max-height: 150px;
      overflow: auto;
    }

    .vlan-option {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #8a94a6;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .vlan-option:hover,
    .vlan-option:focus-within {
      border-color: #2468f2;
      color: #2468f2;
    }

    .vlan-option input {
      margin: 0 6px 0 0;
    }

    .vlan-option:has(input:checked) {
      border-color: #2468f2;
      background: #2468f2;
      color: #ffffff;
    }

    .upload-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }

    .upload-form[hidden],
    [hidden] {
      display: none !important;
    }

    .file-input {
      min-height: 40px;
      flex: 1 1 260px;
      padding: 8px 10px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .photo-card {
      overflow: hidden;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .photo-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .photo-button:focus-visible {
      outline: 3px solid rgba(36, 104, 242, 0.28);
      outline-offset: -3px;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      object-fit: cover;
      background: #eef3f8;
    }

    .photo-caption {
      padding: 9px 10px 11px;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .photo-caption span {
      display: block;
      margin-bottom: 4px;
      color: #667080;
      font-size: 11px;
      text-transform: uppercase;
    }

    .metric-link {
      color: #2468f2;
      font-weight: 800;
      text-decoration: none;
    }

    .metric-link:hover,
    .metric-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .backup-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .backup-dot {
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
      border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
    }

    .backup-dot.available {
      background: #16a34a;
    }

    .backup-dot.missing {
      background: #dc2626;
    }

    .photo-viewer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 18px;
      background: rgba(15, 23, 42, 0.88);
    }

    .photo-viewer[hidden] {
      display: none;
    }

    .photo-viewer-header,
    .photo-viewer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #ffffff;
    }

    .photo-viewer-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .photo-viewer-stage {
      min-height: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .photo-viewer-image {
      max-width: 100%;
      max-height: 100%;
      justify-self: center;
      border-radius: 8px;
      background: #0f172a;
      object-fit: contain;
    }

    .viewer-button {
      min-height: 40px;
      min-width: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    .viewer-button:hover,
    .viewer-button:focus-visible {
      background: rgba(255, 255, 255, 0.22);
      outline: none;
    }

    .viewer-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .metric {
      padding: 16px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
      line-height: 1;
    }

    .metric-compact {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 10px 12px;
      border-color: #f59e0b;
      background: #fff7ed;
      color: #9a3412;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    .sort-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: inherit;
      text-align: left;
      text-transform: inherit;
    }

    .sort-button:focus-visible {
      outline: 3px solid rgba(36, 104, 242, 0.22);
      outline-offset: 2px;
    }

    .inline-action {
      padding: 0;
      border: 0;
      background: transparent;
      color: #2468f2;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      text-align: left;
    }

    .inline-action:hover,
    .inline-action:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .backup-detail td {
      padding: 0;
      background: #f8fafc;
    }

    .backup-content {
      max-height: 560px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      background: #ffffff;
      color: #111827;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .counters-section {
      margin-top: 22px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
    }

    .counters-section summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 14px 16px;
      cursor: pointer;
      list-style: none;
      color: #39445a;
      font-size: 13px;
      font-weight: 800;
      background: #eef3f8;
    }

    .counters-section summary::-webkit-details-marker {
      display: none;
    }

    .counters-section summary::after {
      width: 9px;
      height: 9px;
      content: "";
      flex: 0 0 auto;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.16s ease;
    }

    .counters-section[open] summary::after {
      transform: rotate(225deg);
    }

    .counters-section-heading {
      display: flex;
      min-width: 240px;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 3px;
    }

    .counters-section-label {
      color: #172033;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .counters-section-hint {
      color: #667080;
      font-size: 12px;
      font-weight: 700;
    }

    .counters-section-count {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #ffffff;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .counters-section-body {
      padding: 16px;
    }

    .counters-section-description {
      margin: 0 0 14px;
      color: #667080;
      font-size: 13px;
      font-weight: 700;
    }

    .interface-device {
      margin-bottom: 14px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      overflow: hidden;
    }

    .interface-device summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 800;
    }

    .interface-device-meta {
      color: #667080;
      font-size: 12px;
      font-weight: 700;
    }

    .interface-device-body {
      padding: 0 14px 14px;
    }

    .interface-row-warning td {
      background: #fff7ed;
    }

    .interface-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin-top: 14px;
      color: #667080;
      font-size: 13px;
      font-weight: 700;
    }

    .interface-footer span + span::before {
      margin-right: 14px;
      content: "|";
      color: #a8b1c0;
    }

    .sort-indicator {
      color: #667080;
      font-size: 11px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
        margin: 36px auto 24px;
      }

      .site-heading {
        align-items: flex-start;
        flex-direction: column;
        justify-content: flex-start;
        text-align: left;
      }

      .nav-actions {
        margin-left: -12px;
      }

      .hero-copy {
        font-size: 16px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <div class="site-heading" aria-labelledby="page-title">
        <h1 id="page-title">Loading site...</h1>
        <p class="site-address" id="site-address" hidden></p>
      </div>
      <nav class="nav-actions" aria-label="Page actions">
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <p class="status" id="status">Loading device inventory...</p>

    const uptimeColumnAliases = {

    };
    const endpointColumnAliases = {
      device: "device",

      host: "hostname",
      hostname: "hostname",

      mac: "entryMac",

      endpoint_mac: "entryMac",
      vlan: "vlan",
      port: "devicePort",
      interface: "devicePort",
      deviceport: "devicePort",
      device_port: "devicePort",
      status: "status",
      active: "status",
      state: "status",
      lastseen: "lastSeen",
      last_seen: "lastSeen"
    };
    const interfaceCounterPairs = [
      { key: "jumbos_rx_tx", label: "jumbos rx/tx", rx: "jumbos_rx", tx: "jumbos_tx", aliases: ["jumbos"] },
      { key: "dropped_rx_tx", label: "dropped rx/tx", rx: "dropped_rx", tx: "dropped_tx", aliases: ["dropped"] },
      { key: "pause_frames_rx_tx", label: "pause frames rx/tx", rx: "pause_frames_rx", tx: "pause_frames_tx", aliases: ["pause", "pause_frames"] },
      { key: "errors_rx_tx", label: "errors rx/tx", rx: "errors_rx", tx: "errors_tx", aliases: ["errors"] },
      { key: "crc_fcs_rx_tx", label: "crc fcs rx/tx", rx: "crc_fcs_rx", tx: "crc_fcs_tx", aliases: ["crc", "crc_fcs"] },
      { key: "collision_rx_tx", label: "collision rx/tx", rx: "collision_rx", tx: "collision_tx", aliases: ["collision"] },
      { key: "runts_rx_tx", label: "runts rx/tx", rx: "runts_rx", tx: "runts_tx", aliases: ["runts"] },
      { key: "giants_rx_tx", label: "giants rx/tx", rx: "giants_rx", tx: "giants_tx", aliases: ["giants"] }
    ];

    function normalizeDevices(rows) {
      return (rows || []).map((row) => ({
        fqdn: row.fqdn || "-",
        ipAddress: row.ip_address || "-",
        serialNumber: row.serial_number || "-",
        deviceType: row.device_type || "-",
        deviceRole: row.device_role || "-",
        deviceModel: row.device_model || "-",
        osVersion: row.os_version || "-",
        deviceUptime: row.device_uptime || "",
        techRoom: row.tech_room || "-",
        haStatus: row.ha_status || row.ha || "",
        location: row.location || "-",
        access: row.access || "-",
        tag: row.tag || "-",
        tags: row.tags || "-",
        backupConfigExists: Boolean(row.backup_config_exists),
        backupConfigDate: row.backup_config_date || "",
        backupConfigFile: row.backup_config_file || "",
        physicalAddress: normalizePhysicalAddress(row)
      }));
    }

    function normalizePhysicalAddress(row) {
      let address = String(row.physical_address || "").trim();
      const continuation = String(row.comment_01 || "").trim();

      if (address.startsWith('"') && continuation && !address.endsWith('"')) {
        address = `${address} ${continuation}`;
      }

      return address.replace(/^"+|"+$/g, "").trim();
    }

    function isUsablePhysicalAddress(value) {
      const normalized = String(value || "").trim().toLowerCase();
      return normalized && !["-", "na", "n/a", "none", "null", "tbd"].includes(normalized);
    }

    function firstPhysicalAddress(devices) {
      for (const device of devices || []) {
        const address = String(device.physicalAddress || "").trim();
        if (isUsablePhysicalAddress(address)) {
          return address;
        }
      }

      return "";
    }

    function googleMapsUrl(address) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }

    function googleMapsEmbedUrl(address) {
      return `https://maps.google.com/maps?q=${encodeURIComponent(address)}&output=embed`;
    }

    function renderSiteAddress(devices) {
      const address = firstPhysicalAddress(devices);
      siteAddressEl.hidden = !address;
      siteAddressEl.innerHTML = address
        ? `<a href="${googleMapsUrl(address)}" target="_blank" rel="noopener noreferrer">${escapeHtml(address)}</a>`
        : "";
    }

    function endpointSummaryMetrics(rows) {
      const vlans = new Set();
      const macs = new Set();

      for (const row of rows) {
        const vlan = String(row.vlan || "").trim();
        const mac = String(row.entryMac || "").trim().toLowerCase();

        if (vlan && vlan !== "-") {
          vlans.add(vlan);
        }

        if (mac && mac !== "-") {
          macs.add(mac);
        }
      }

      return {
        endpointCount: rows.length,
        vlanCount: vlans.size,
        macCount: macs.size
      };
    }

    function updateEndpointsButton(metrics = null) {
      endpointsButtonEl.textContent = metrics ? `endpoints(${metrics.endpointCount})` : "endpoints";
    }

    function updateDeviceStatusButton(devices = null) {
      if (!Array.isArray(devices)) {
        uptimeButtonEl.textContent = "device status";
        return;
      }

      uptimeButtonEl.textContent = `device status(${devices.length})`;
    }

    function isAccessPointDevice(device) {
      return String(device.deviceType || "").trim().toLowerCase() === "access_point";
    }

    function updateWirelessButton(devices = null) {
      if (!Array.isArray(devices)) {
        wirelessButtonEl.textContent = "wireless";
        return;
      }

      wirelessButtonEl.textContent = `wireless(${devices.filter(isAccessPointDevice).length})`;
    }

    function compareDevicesForDisplay(left, right) {
      return (
        Number(isAccessPointDevice(left)) - Number(isAccessPointDevice(right)) ||
        siteSorter.compare(String(right.fqdn || ""), String(left.fqdn || ""))
      );
    }

    function updateRoutesButton(uniqueSubnetCount = null) {
      routesLinkEl.textContent = Number.isInteger(uniqueSubnetCount) ? `routes(${uniqueSubnetCount})` : "routes";
    }

    function updateInterfacesButton(totalInterfaces = null) {
      interfacesButtonEl.textContent = Number.isInteger(totalInterfaces) ? `interfaces(${totalInterfaces})` : "interfaces";
    }

    function renderSummary(devices, endpoints = null) {
      const deviceTypes = new Set(devices.map((device) => device.deviceType).filter((type) => type !== "-"));
      const gatewayCount = devices.filter((device) => device.deviceRole.toLowerCase().includes("gateway")).length;
      const endpointMetrics = Array.isArray(endpoints) ? endpointSummaryMetrics(endpoints) : null;
      const endpointSummary = endpointMetrics ? `
        <span class="summary-pill">
          <span class="summary-pill-label">endpoint vlans</span>
          <a class="metric-link summary-pill-value" href="/vlans?site=${encodeURIComponent(siteId)}">${endpointMetrics.vlanCount}</a>
        </span>
        <span class="summary-pill summary-pill-accent">
          <span class="summary-pill-label">endpoint mac addresses</span>
          <span class="summary-pill-value">${endpointMetrics.macCount}</span>
        </span>
      ` : "";

      summaryEl.innerHTML = `
        <summary class="site-summary-toggle">
          <span class="site-summary-toggle-text">
            <span class="site-summary-title">Overview</span>
            <span class="site-summary-hint">click to show site metrics</span>
          </span>
          <span class="site-summary-icon" aria-hidden="true"></span>
        </summary>
        <div class="site-summary-grid">
          <span class="summary-pill">
            <span class="summary-pill-label">network devices</span>
            <span class="summary-pill-value">${devices.length}</span>
          </span>
          <span class="summary-pill">
            <span class="summary-pill-label">device types</span>
            <span class="summary-pill-value">${deviceTypes.size}</span>
          </span>
          <span class="summary-pill">
            <span class="summary-pill-label">l3 gateways</span>
            <span class="summary-pill-value">${gatewayCount}</span>
          </span>
          ${endpointSummary}
        </div>
      `;
    }

    async function loadSiteEndpointSummary() {
      const response = await fetch(`${endpointsFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${endpointsFile} (${response.status})`);
      }

      const data = await response.json();
      return normalizeEndpointRows(data.endpoints || []);
    }

    function getRoutesRecords(data) {
      if (Array.isArray(data)) {
        return data;
      }

      return data?.records || data?.routes || data?.routing || [];
    }

    function routeField(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return String(value).trim();
        }
      }

      return "";
    }

    async function loadSiteRouteSummary() {
      const response = await fetch(`${routesFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${routesFile} (${response.status})`);
      }

      const data = await response.json();
      const uniqueSubnets = new Set();
      getRoutesRecords(data).forEach((row) => {
        const routeSite = routeField(row, ["site", "Site"]);
        const subnet = routeField(row, ["subnet", "Subnet", "network", "Network"]);
        const routable = routeField(row, ["routable", "Routable"]).toLowerCase();
        if (routeSite === siteId && routable === "yes" && subnet && subnet !== "-") {
          uniqueSubnets.add(subnet);
        }
      });

      return uniqueSubnets.size;
    }

    function deviceMatchesQuery(device, query) {
      if (!query) {
        return true;
      }

      return [
        device.fqdn,
        device.ipAddress,
        device.deviceType,
        device.deviceRole,
        device.haStatus
      ].some((value) => String(value).toLowerCase().includes(query));
    }

    function renderDevices() {
      const query = deviceSearchEl.value.trim().toLowerCase();
      const devices = siteDevices
        .filter((device) => deviceMatchesQuery(device, query))
        .sort(compareDevicesForDisplay);

      if (devices.length === 0) {
        devicesEl.innerHTML = query
          ? '<div class="empty">No devices match the current filter.</div>'
          : '<div class="empty">No devices found for this site.</div>';
        statusEl.textContent = query ? `0 of ${siteDevices.length} devices at site ${siteId}` : "";
        statusEl.hidden = !query;
        return;
      }

      const rows = devices.map((device, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(device.fqdn)}</td>
          <td>${escapeHtml(device.ipAddress)}</td>
          <td>${escapeHtml(device.deviceType)}</td>
          <td>${escapeHtml(device.deviceRole)}</td>
          <td>${escapeHtml(device.haStatus)}</td>
          <td>
            <span class="backup-status" title="${escapeHtml(device.backupConfigFile || (device.backupConfigExists ? "backup config found" : "backup config missing"))}">
              <span class="backup-dot ${device.backupConfigExists ? "available" : "missing"}" aria-hidden="true"></span>
              ${device.backupConfigExists ? `yes${device.backupConfigDate ? ` ${escapeHtml(device.backupConfigDate)}` : ""}` : "no"}
            </span>
          </td>
        </tr>
      `).join("");

      devicesEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>FQDN</th>
                <th>IP Address</th>
                <th>device_type</th>
                <th>Device Role</th>
                <th>HA</th>
                <th>Backup</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      statusEl.textContent = query ? `${devices.length} of ${siteDevices.length} devices at site ${siteId}` : "";
      statusEl.hidden = !query;
    }

    function setDevicesExpanded(expanded) {
      devicesExpanded = expanded;
      devicesEl.hidden = !expanded;
      devicesToggleEl.textContent = expanded ? "collapse devices" : "expand devices";
      devicesToggleEl.setAttribute("aria-expanded", String(expanded));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function normalizeEndpointRows(rows) {
      return rows
        .filter((row) => getFirstValue(row, ["site", "Site"]) === siteId)
        .map((row) => ({
          device: getFirstValue(row, ["device_fqdn", "Device_FQDN"]),
          hostname: getFirstValue(row, ["Hostname", "hostname"]),
          entryIp: getFirstValue(row, ["entry_ip", "Entry_IP"]),
          entryMac: getFirstValue(row, ["entry_mac", "Entry_MAC"]),
          vlan: getFirstValue(row, ["entry_vlan", "Entry_VLAN"]),
          devicePort: getFirstValue(row, ["device_port", "Device_Port", "Entry_Port"]),
          status: getFirstValue(row, ["active", "Active", "status", "Status"]),
          lastSeen: getFirstValue(row, ["last_seen", "Last_Seen", "lastSeen"])
        }));
    }

    function vlanSortValue(value) {
      const match = String(value).match(/\d+/);
      return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
    }

    function statusSortValue(value) {
      const normalized = String(value).toLowerCase();
      if (["yes", "true", "active", "reachable"].includes(normalized)) {
        return 0;
      }
      if (["no", "false", "inactive", "unreachable"].includes(normalized)) {
        return 1;
      }
      if (normalized.includes("reachable")) {
        return normalized.includes("unreachable") ? 1 : 0;
      }
      return 2;
    }

    function sortEndpointRows(rows) {
      return [...rows].sort((a, b) => (
        vlanSortValue(a.vlan) - vlanSortValue(b.vlan) ||
        statusSortValue(a.status) - statusSortValue(b.status) ||
        a.device.localeCompare(b.device) ||
        a.hostname.localeCompare(b.hostname)
      ));
    }

    function endpointVlanKey(value) {
      const normalized = String(value || "").trim();
      return normalized && normalized !== "-" ? normalized : "-";
    }

    function buildEndpointVlans(rows) {
      return [...new Set(rows.map((row) => endpointVlanKey(row.vlan)))]
        .sort((a, b) => vlanSortValue(a) - vlanSortValue(b) || siteSorter.compare(a, b));
    }

    function endpointRowMatchesVlanSelection(row) {
      if (currentEndpointSelectedVlans.size === 0) {
        return false;
      }

      return currentEndpointSelectedVlans.has(endpointVlanKey(row.vlan));
    }

    function renderEndpointVlanFilters() {
      const panel = document.getElementById("endpoint-vlan-filter-panel");
      const options = document.getElementById("endpoint-vlan-filter-options");
      if (!panel || !options) {
        return;
      }

      currentEndpointAvailableVlans = buildEndpointVlans(currentEndpointRows);
      currentEndpointSelectedVlans = new Set(currentEndpointAvailableVlans);
      panel.hidden = currentEndpointAvailableVlans.length === 0;
      options.innerHTML = currentEndpointAvailableVlans.map((vlan) => `
        <label class="vlan-option">
          <input type="checkbox" value="${escapeHtml(vlan)}" checked>
          vlan ${escapeHtml(vlan)}
        </label>
      `).join("");
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key, columns, aliases) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function rowMatchesToken(row, token, columns, aliases) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key, columns, aliases);

        if (columnKey && value) {
          return valueMatches(row[columnKey], value);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesQuery(row, query, columns, aliases) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token, columns, aliases));
    }

    function uptimeSortValue(row, key) {
      const value = row[key] ?? "";
      if (key !== "uptime" && key !== "deviceUptime") {
        return String(value);
      }

      const text = String(value).toLowerCase();
      let seconds = 0;
      const units = {
        week: 604800,
        weeks: 604800,
        day: 86400,
        days: 86400,
        hour: 3600,
        hours: 3600,
        hr: 3600,
        hrs: 3600,
        minute: 60,
        minutes: 60,
        min: 60,
        mins: 60
      };
      for (const match of text.matchAll(/(\d+(?:\.\d+)?)\s*([a-z]+)/g)) {
        seconds += Number(match[1]) * (units[match[2]] || 0);
      }

      return seconds || text;
    }

    function compareUptimeValues(left, right, key) {
      const leftValue = uptimeSortValue(left, key);
      const rightValue = uptimeSortValue(right, key);

      if (typeof leftValue === "number" && typeof rightValue === "number") {
        return leftValue - rightValue;
      }

      return siteSorter.compare(String(leftValue), String(rightValue));
    }

    function sortedUptimeRows(rows) {
      const direction = currentUptimeSort.direction === "desc" ? -1 : 1;
      return [...rows].sort((left, right) => {
        const primary = compareUptimeValues(left, right, currentUptimeSort.key);
        const secondary = siteSorter.compare(left.device, right.device);
        return (primary || secondary) * direction;
      });
    }

    function uptimeSortIndicator(column) {
      return "";
    }

    function renderUptimeResults() {
      const searchEl = document.getElementById("uptime-search");
      const query = searchEl ? searchEl.value.trim() : "";
      const visibleRows = sortedUptimeRows(currentUptimeRows.filter((row) => rowMatchesQuery(row, query, currentUptimeColumns, uptimeColumnAliases)));
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${currentUptimeRows.length} network devices`
        : `Showing ${currentUptimeRows.length} network devices`;
      const resultEl = document.getElementById("uptime-results");
      const countEl = document.getElementById("uptime-count");

      if (countEl) {
        countEl.textContent = `${countLabel} for site ${siteId} from ${currentUptimeFile}${currentUptimeUpdated}`;
      }

      if (resultEl) {
        resultEl.innerHTML = renderTable(visibleRows, currentUptimeColumns, {
          sortable: true,
          sortPrefix: "uptime",
          sortIndicator: uptimeSortIndicator
        });
      }
    }

    function renderEndpointResults() {
      const searchEl = document.getElementById("endpoint-search");
      const query = searchEl ? searchEl.value.trim() : "";
      const searchRows = currentEndpointRows.filter((row) => rowMatchesQuery(row, query, currentEndpointColumns, endpointColumnAliases));
      const visibleRows = searchRows.filter(endpointRowMatchesVlanSelection);
      currentEndpointVisibleRows = visibleRows;
      const filterActive = endpointFiltersActive();
      const countLabel = query || filterActive
        ? `Showing ${visibleRows.length} of ${currentEndpointRows.length} endpoints`
        : `Showing ${currentEndpointRows.length} endpoints`;
      const resultEl = document.getElementById("endpoint-results");
      const countEl = document.getElementById("endpoint-count");
      const summaryEl = document.getElementById("endpoint-summary");

      if (countEl) {
        countEl.textContent = `${countLabel} for site ${siteId} from ${endpointsSourceName}${currentEndpointUpdated}`;
      }

      if (summaryEl) {
        summaryEl.innerHTML = renderEndpointSummary(visibleRows);
      }

      if (resultEl) {
        resultEl.innerHTML = renderTable(visibleRows, currentEndpointColumns);
      }
    }

    function endpointFiltersActive() {
      const searchEl = document.getElementById("endpoint-search");
      return Boolean(searchEl?.value.trim()) || currentEndpointSelectedVlans.size !== currentEndpointAvailableVlans.length;
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportEndpointCsv(rows, scope) {
      if (rows.length === 0) {
        return;
      }

      const header = currentEndpointColumns.map((column) => csvEscape(column.label)).join(",");
      const body = rows.map((row) => (
        currentEndpointColumns.map((column) => csvEscape(row[column.key])).join(",")
      )).join("\n");
      const csv = `${header}\n${body}\n`;
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `site_${siteId}_endpoints_${scope}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function exportCurrentEndpointCsv() {
      const filtered = endpointFiltersActive();
      exportEndpointCsv(filtered ? currentEndpointVisibleRows : currentEndpointRows, filtered ? "filtered" : "all");
    }

    function renderEndpointSummary(rows) {
      const vlans = new Set();
      const macs = new Set();

      for (const row of rows) {
        const vlan = String(row.vlan || "").trim();
        const mac = String(row.entryMac || "").trim().toLowerCase();

        if (vlan && vlan !== "-") {
          vlans.add(vlan);
        }

        if (mac && mac !== "-") {
          macs.add(mac);
        }
      }

      return `
        <div class="summary" aria-label="Endpoint summary for site ${escapeHtml(siteId)}">
          <article class="metric">
            <span>Site</span>
            <strong>${escapeHtml(siteId)}</strong>
          </article>
          <article class="metric">
            <span>VLANs</span>
            <strong><a class="metric-link" href="/vlans?site=${encodeURIComponent(siteId)}">${vlans.size}</a></strong>
          </article>
          <article class="metric">
            <span>Total Endpoints</span>
            <strong>${rows.length}</strong>
          </article>
          <article class="metric">
            <span>Total MAC Addresses</span>
            <strong>${macs.size}</strong>
          </article>
        </div>
      `;
    }

    function formatFileSize(value) {
      if (value === "" || value === null || value === undefined) {
        return "";
      }

      const size = Number(value);
      if (!Number.isFinite(size)) {
        return "";
      }
      if (size < 1024) {
        return `${size} B`;
      }
      if (size < 1024 * 1024) {
        return `${(size / 1024).toFixed(1)} KB`;
      }
      return `${(size / (1024 * 1024)).toFixed(1)} MB`;
    }

    function renderBackupContents(data) {
      if (!data.exists) {
        return `<div class="empty">No backup folder found at ${escapeHtml(data.path || `/polaris/data/${siteId}`)}.</div>`;
      }

      const items = data.items || [];
      if (items.length === 0) {
        return `<div class="empty">No backup files matching ${escapeHtml(data.name_filter || `${siteId}*`)} found in ${escapeHtml(data.path)}.</div>`;
      }

      const rows = items.map((item, index) => {
        const canExpand = item.type === "file" && item.url;
        const name = item.url
          ? `<a class="metric-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.name)}</a>`
          : escapeHtml(item.name);
        const action = canExpand
          ? `<button class="inline-action" type="button" data-backup-toggle data-backup-index="${index}" data-backup-url="${escapeHtml(item.url)}" aria-expanded="false">expand</button>`
          : "";

        return `
          <tr>
            <td>${index + 1}</td>
            <td>${name}</td>
            <td>${escapeHtml(item.type)}</td>
            <td>${escapeHtml(formatFileSize(item.size))}</td>
            <td>${escapeHtml(item.modified || "")}</td>
            <td>${action}</td>
          </tr>
          <tr class="backup-detail" data-backup-detail="${index}" hidden>
            <td colspan="6">
              <pre class="backup-content" data-backup-content>Not loaded.</pre>
            </td>
          </tr>
        `;
      }).join("");

      return `
        <p class="status">Showing ${items.length} backup file${items.length === 1 ? "" : "s"} matching ${escapeHtml(data.name_filter || `${siteId}*`)} from ${escapeHtml(data.path)}</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Modified</th>
                <th>Contents</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    async function loadBackups() {
      setActiveOperation("backup");
      operationPanelEl.innerHTML = '<div class="empty">Loading backup contents...</div>';

      try {
        const response = await fetch(`${backupsFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${backupsFile} (${response.status})`);
        }

        const data = await response.json();
        operationPanelEl.innerHTML = `
          ${submenuHeader("backup")}
          ${renderBackupContents(data)}
        `;
      } catch (error) {
        operationPanelEl.innerHTML = '<div class="error">Unable to load backup contents for this site.</div>';
        console.error(error);
      }
    }

    async function toggleBackupFile(button) {
      const index = button.dataset.backupIndex;
      const detailRow = operationPanelEl.querySelector(`[data-backup-detail="${CSS.escape(index)}"]`);
      const contentEl = detailRow?.querySelector("[data-backup-content]");
      if (!detailRow || !contentEl) {
        return;
      }

      const shouldExpand = detailRow.hidden;
      detailRow.hidden = !shouldExpand;
      button.setAttribute("aria-expanded", String(shouldExpand));
      button.textContent = shouldExpand ? "collapse" : "expand";

      if (!shouldExpand || button.dataset.loaded === "true") {
        return;
      }

      contentEl.textContent = "Loading file contents...";
      try {
        const response = await fetch(button.dataset.backupUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load backup file (${response.status})`);
        }

        contentEl.textContent = await response.text();
        button.dataset.loaded = "true";
      } catch (error) {
        contentEl.textContent = "Unable to load this backup file.";
        console.error(error);
      }
    }

    function interfaceMatchesQuery(device, row, query, columns = currentInterfaceColumns) {
      const tokens = tokenizeSearchQuery(query);
      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => {
        const separatorIndex = token.indexOf(":");

        if (separatorIndex > 0) {
          const key = token.slice(0, separatorIndex);
          const value = token.slice(separatorIndex + 1);
          const columnKey = getColumnKey(key, currentInterfaceFilterColumns, currentInterfaceColumnAliases);

          if (columnKey && value) {
            const compareValue = columnKey === "delta_description"
              ? interfaceDeltaDescription(row)
              : interfaceCellValue(row, columnKey);
            return interfaceColumnValueMatches(compareValue, value);
          }
        }

        return [
          device.device,
          device.device_id,
          device.file,
          interfaceDeltaDescription(row),
          ...columns.map((column) => interfaceCellValue(row, column.key)),
          ...Object.values(row)
        ].some((value) => valueMatches(value, token));
      });
    }

    function interfaceColumnValueMatches(actual, expected) {
      const actualText = String(actual ?? "").trim();
      const expectedText = String(expected ?? "").trim();
      if (/^-?\d+(?:\.\d+)?$/.test(actualText) && /^-?\d+(?:\.\d+)?$/.test(expectedText)) {
        return Number(actualText) === Number(expectedText);
      }

      return actualText.toLowerCase().includes(expectedText.toLowerCase());
    }

    function interfaceCellValue(row, key) {
      const pair = interfaceCounterPairs.find((entry) => entry.key === key);
      if (!pair) {
        return row[key] ?? "";
      }

      const rx = row[pair.rx] ?? "";
      const tx = row[pair.tx] ?? "";
      if (rx === "" && tx === "") {
        return "";
      }

      return `${rx} / ${tx}`;
    }

    function parseInterfaceTimestamp(value) {
      const text = String(value || "").trim();
      if (!text) {
        return null;
      }

      const parsed = new Date(text.replace(" ", "T"));
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatInterfaceDuration(milliseconds) {
      const totalMinutes = Math.max(0, Math.round(milliseconds / 60000));
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;
      const parts = [];

      if (days) {
        parts.push(`${days} day${days === 1 ? "" : "s"}`);
      }
      if (hours) {
        parts.push(`${hours} hour${hours === 1 ? "" : "s"}`);
      }
      if (minutes || parts.length === 0) {
        parts.push(`${minutes} minute${minutes === 1 ? "" : "s"}`);
      }

      return parts.slice(0, 2).join(" ");
    }

    function interfaceDeltaWindow(row) {
      const latest = parseInterfaceTimestamp(row.timestamp);
      const previous = parseInterfaceTimestamp(row.previous_timestamp);
      if (!latest || !previous) {
        return "";
      }

      return formatInterfaceDuration(latest.getTime() - previous.getTime());
    }

    function interfaceDeltaDescription(row) {
      const windowLabel = interfaceDeltaWindow(row);
      if (!windowLabel) {
        return "no previous timestamp available for delta comparison";
      }

      const increasedCounters = interfaceCounterPairs
        .filter((pair) => numericCounterValue(row[pair.rx]) !== 0 || numericCounterValue(row[pair.tx]) !== 0)
        .map((pair) => pair.aliases[0] || pair.label.replace(" rx/tx", ""));

      if (increasedCounters.length === 0) {
        return `no counter increase in the last ${windowLabel} based on the last 2 timestamps`;
      }

      return `increase on counters in the last ${windowLabel} based on the last 2 timestamps`;
    }

    function firstInterfaceRow(devices) {
      for (const device of devices || []) {
        const row = device.interfaces?.[0];
        if (row) {
          return row;
        }
      }

      return null;
    }

    function interfaceDeltaSummary(devices) {
      const row = firstInterfaceRow(devices);
      return row ? interfaceDeltaDescription(row) : "no interface rows available for delta comparison";
    }

    function interfaceFooter() {
      return `
        <div class="interface-footer">
          <span>${escapeHtml(interfaceDeltaSummary(currentCounterDevices))}</span>
          <span>${escapeHtml(currentInterfaceSourceLine)}</span>
          <span>${escapeHtml(currentCounterSourceLine)}</span>
        </div>
      `;
    }

    function statusSummaryForDevice(device) {
      const summary = device.status_summary || {};
      if (summary.up !== undefined || summary.down !== undefined) {
        const other = Number(summary.other || 0);
        return `up ${Number(summary.up || 0)} | down ${Number(summary.down || 0)}${other ? ` | other ${other}` : ""}`;
      }

      const counts = { up: 0, down: 0, other: 0 };
      for (const row of device.interfaces || []) {
        const status = String(row.status || "").trim().toLowerCase();
        if (status === "up") {
          counts.up += 1;
        } else if (status === "down") {
          counts.down += 1;
        } else {
          counts.other += 1;
        }
      }

      return `up ${counts.up} | down ${counts.down}${counts.other ? ` | other ${counts.other}` : ""}`;
    }

    function interfaceStatusIsNotDown(row) {
      return String(row.status || "").trim().toLowerCase() !== "down";
    }

    function numericCounterValue(value) {
      const parsed = Number(String(value ?? "").trim());
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function interfaceHasCounterWarning(row) {
      return interfaceCounterPairs.some((pair) => (
        numericCounterValue(row[pair.rx]) !== 0 ||
        numericCounterValue(row[pair.tx]) !== 0
      ));
    }

    function compareInterfaceValues(left, right, key) {
      const pair = interfaceCounterPairs.find((entry) => entry.key === key);
      if (pair) {
        const leftRx = numericCounterValue(left[pair.rx]);
        const leftTx = numericCounterValue(left[pair.tx]);
        const rightRx = numericCounterValue(right[pair.rx]);
        const rightTx = numericCounterValue(right[pair.tx]);
        return (
          (leftRx + leftTx) - (rightRx + rightTx) ||
          leftRx - rightRx ||
          leftTx - rightTx
        );
      }

      const leftText = String(interfaceCellValue(left, key) ?? "").trim();
      const rightText = String(interfaceCellValue(right, key) ?? "").trim();
      if (/^-?\d+(?:\.\d+)?$/.test(leftText) && /^-?\d+(?:\.\d+)?$/.test(rightText)) {
        return Number(leftText) - Number(rightText);
      }

      return siteSorter.compare(leftText, rightText);
    }

    function sortedInterfaceRows(rows, options = {}) {
      const sortState = options.sortState || currentInterfaceSort;
      const direction = sortState.direction === "desc" ? -1 : 1;
      return [...rows].sort((left, right) => (
        (options.prioritizeWarnings ? Number(interfaceHasCounterWarning(right)) - Number(interfaceHasCounterWarning(left)) : 0) ||
        (compareInterfaceValues(left, right, sortState.key) * direction) ||
        siteSorter.compare(String(left.interface || ""), String(right.interface || ""))
      ));
    }

    function buildInterfaceColumns(sourceColumns) {
      const sourceSet = new Set(sourceColumns || []);
      const used = new Set(["id", "site", "device"]);
      const columns = [];

      for (const column of ["timestamp", "previous_timestamp", "interface", "status", "admin_status", "mode", "vlan", "vlans", "description"]) {
        if (sourceSet.has(column)) {
          columns.push({ key: column, label: interfaceColumnLabel(column) });
          used.add(column);
        }
      }

      for (const pair of interfaceCounterPairs) {
        if (sourceSet.has(pair.rx) || sourceSet.has(pair.tx)) {
          columns.push({ key: pair.key, label: pair.label });
          used.add(pair.rx);
          used.add(pair.tx);
        }
      }

      if (sourceSet.has("speed")) {
        columns.push({ key: "speed", label: "speed" });
        used.add("speed");
      }

      for (const column of sourceColumns || []) {
        if (!used.has(column)) {
          columns.push({ key: column, label: interfaceColumnLabel(column) });
        }
      }

      return columns.length ? columns : [
        { key: "interface", label: "interface" },
        { key: "timestamp", label: "timestamp" }
      ];
    }

    function renderInterfaceTable(rows, columns = currentInterfaceColumns, options = {}) {
      if (rows.length === 0) {
        return '<div class="empty">No interfaces match the current filter for this device.</div>';
      }

      const body = sortedInterfaceRows(rows, options).map((row) => `
        <tr class="${options.warnCounters && interfaceHasCounterWarning(row) ? "interface-row-warning" : ""}">
          ${columns.map((column) => `<td>${escapeHtml(interfaceCellValue(row, column.key))}</td>`).join("")}
        </tr>
      `).join("");
      const headers = columns.map((column) => `
        <th>
          <button class="sort-button" type="button" data-interface-sort="${escapeHtml(column.key)}">
            <span>${escapeHtml(column.label)}</span>
          </button>
        </th>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function interfaceColumnLabel(column) {
      return String(column || "").replace(/_/g, " ");
    }

    function buildInterfaceColumnAliases(columns) {
      const aliases = {};
      for (const column of columns) {
        aliases[normalizeSearchKey(column.key)] = column.key;
        aliases[normalizeSearchKey(column.label)] = column.key;
        const pairBase = String(column.key).replace(/_?rx\/tx$/i, "").replace(/_?rx_tx$/i, "");
        if (pairBase && pairBase !== column.key) {
          aliases[normalizeSearchKey(pairBase)] = column.key;
        }
      }

      for (const pair of interfaceCounterPairs) {
        aliases[normalizeSearchKey(pair.key)] = pair.key;
        aliases[normalizeSearchKey(pair.label)] = pair.key;
        for (const alias of pair.aliases) {
          aliases[normalizeSearchKey(alias)] = pair.key;
        }
      }

      aliases.port = "interface";
      aliases.int = "interface";
      aliases.iface = "interface";
      aliases.name = "interface";
      aliases.desc = "description";
      aliases.delta = "delta_description";
      aliases.window = "delta_description";
      aliases.period = "delta_description";
      aliases.dev = "device";
      aliases.deviceid = "device_id";
      aliases.device_id = "device_id";
      aliases.host = "device";
      aliases.hostname = "device";
      return aliases;
    }

    function renderInterfaceResults() {
      const searchEl = document.getElementById("interface-search");
      const countEl = document.getElementById("interface-count");
      const resultEl = document.getElementById("interface-results");
      const query = searchEl?.value.trim().toLowerCase() || "";

      if (!resultEl || !countEl) {
        return;
      }

      let visibleInterfaceCount = 0;
      const visibleDevices = currentInterfaceDevices.map((device) => {
        const rows = (device.interfaces || []).filter((row) => interfaceMatchesQuery(device, row, query, currentInterfaceColumns));
        visibleInterfaceCount += rows.length;
        return { ...device, visibleInterfaces: rows };
      }).filter((device) => device.visibleInterfaces.length > 0 || !query);
      let visibleCounterCount = 0;
      const visibleCounterDevices = currentCounterDevices.map((device) => {
        const rows = (device.interfaces || []).filter((row) => (
          interfaceStatusIsNotDown(row) &&
          interfaceMatchesQuery(device, row, query, currentCounterColumns)
        ));
        visibleCounterCount += rows.length;
        return { ...device, visibleInterfaces: rows };
      }).filter((device) => device.visibleInterfaces.length > 0);

      const totalInterfaces = currentInterfaceDevices.reduce((total, device) => total + (device.interfaces || []).length, 0);
      countEl.textContent = query
        ? `Showing ${visibleInterfaceCount} of ${totalInterfaces} interface status rows from ${currentInterfaceDevices.length} device${currentInterfaceDevices.length === 1 ? "" : "s"}`
        : `Showing ${totalInterfaces} interface status rows from ${currentInterfaceDevices.length} device${currentInterfaceDevices.length === 1 ? "" : "s"}`;

      if (currentInterfaceDevices.length === 0) {
        resultEl.innerHTML = `
          <div class="empty">No interface status rows found for site ${escapeHtml(siteId)} in IFSTATE_status.db.</div>
          ${interfaceFooter()}
        `;
        return;
      }

      if (visibleDevices.length === 0) {
        resultEl.innerHTML = `
          <div class="empty">No interface records match the current filter.</div>
          ${interfaceFooter()}
        `;
        return;
      }

      const statusTables = visibleDevices.map((device, index) => `
        <details class="interface-device" ${index === 0 ? "open" : ""}>
          <summary>
            <span>${escapeHtml(device.device_id || device.device || "unknown device")}</span>
            <span class="interface-device-meta">${statusSummaryForDevice(device)} | ${device.visibleInterfaces.length} interface${device.visibleInterfaces.length === 1 ? "" : "s"} | ${escapeHtml(device.file || "")}${device.generated_at ? ` | latest ${escapeHtml(device.generated_at)}` : ""}</span>
          </summary>
          <div class="interface-device-body">
            ${renderInterfaceTable(device.visibleInterfaces, currentInterfaceColumns)}
          </div>
        </details>
      `).join("");
      const counterTables = visibleCounterDevices.map((device, index) => `
        <details class="interface-device" ${index === 0 ? "open" : ""}>
          <summary>
            <span>${escapeHtml(device.device || "unknown device")}</span>
            <span class="interface-device-meta">${device.visibleInterfaces.length} interface${device.visibleInterfaces.length === 1 ? "" : "s"} | ${escapeHtml(device.file || "")}${device.generated_at ? ` | latest ${escapeHtml(device.generated_at)}` : ""}</span>
          </summary>
          <div class="interface-device-body">
            ${renderInterfaceTable(device.visibleInterfaces, currentCounterColumns, {
              warnCounters: true,
              sortState: currentCounterSort,
              prioritizeWarnings: currentCounterSort.key === "interface"
            })}
          </div>
        </details>
      `).join("");

      resultEl.innerHTML = `
        ${statusTables}
        <details class="counters-section" id="interface-counters-section" ${interfaceCountersExpanded ? "open" : ""}>
          <summary>
            <span class="counters-section-heading">
              <span class="counters-section-label">interface counters</span>
              <span class="counters-section-hint">Counter deltas from IFSTATE_counters.db, excluding interfaces with status down.</span>
            </span>
            <span class="counters-section-count">${visibleCounterCount} interface${visibleCounterCount === 1 ? "" : "s"}</span>
          </summary>
          <div class="counters-section-body">
            <p class="counters-section-description">${escapeHtml(interfaceDeltaSummary(currentCounterDevices))}</p>
            ${counterTables || '<div class="empty">No interface counter rows found after excluding status down for this site.</div>'}
          </div>
        </details>
        ${interfaceFooter()}
      `;
    }

    async function loadInterfaces() {
      setActiveOperation("interfaces");
      operationPanelEl.innerHTML = '<div class="empty">Loading interface data...</div>';

      try {
        const response = await fetch(`${interfacesFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${interfacesFile} (${response.status})`);
        }

        const data = await response.json();
        currentInterfaceDevices = data.status_devices || [];
        currentCounterDevices = data.devices || [];
        const interfaceColumns = data.status_columns?.length ? data.status_columns : ["timestamp", "interface", "status", "admin_status", "mode", "vlan", "vlans", "speed", "description"];
        const counterColumns = data.columns?.length ? data.columns : ["timestamp", "interface", "status", "speed", "description"];
        currentInterfaceColumns = buildInterfaceColumns(interfaceColumns);
        currentCounterColumns = buildInterfaceColumns(counterColumns);
        currentInterfaceSort = { key: "interface", direction: "asc" };
        currentCounterSort = { key: "interface", direction: "asc" };
        interfaceCountersExpanded = false;
        currentInterfaceFilterColumns = [
          ...currentInterfaceColumns,
          ...currentCounterColumns,
          ...interfaceColumns.map((column) => ({ key: column, label: interfaceColumnLabel(column) })),
          ...counterColumns.map((column) => ({ key: column, label: interfaceColumnLabel(column) })),
          { key: "device", label: "device" },
          { key: "device_id", label: "device_id" },
          { key: "site", label: "site" }
        ];

    function renderTable(rows, columns, options = {}) {
      if (rows.length === 0) {
        return '<div class="empty">No records found in this file for the selected site.</div>';
      }

      const headers = columns.map((column) => {
        if (!options.sortable) {
          return `<th>${escapeHtml(column.label)}</th>`;
        }

        return `
          <th>
            <button class="sort-button" type="button" data-${options.sortPrefix}-sort="${escapeHtml(column.key)}">
              <span>${escapeHtml(column.label)}</span>
              <span class="sort-indicator">${escapeHtml(options.sortIndicator(column))}</span>
            </button>
          </th>
        `;
      }).join("");
      const body = rows.map((row) => `
        <tr>
          ${columns.map((column) => `<td>${escapeHtml(row[column.key])}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>

    async function uploadWirelessFloorplan(event) {
      event.preventDefault();
      const input = document.getElementById("wireless-floorplan-input");
      const uploadButton = document.getElementById("wireless-floorplan-upload");
      const statusEl = document.getElementById("wireless-floorplan-status");

      if (!input.files.length) {
        if (statusEl) {
          statusEl.textContent = "select a floorplan image first";
          statusEl.hidden = false;
        }
        return;
      }

      const formData = new FormData();
      formData.append("site", siteId);
      formData.append("floorplan", input.files[0]);

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 120000);

      try {
        if (uploadButton) {
          uploadButton.disabled = true;
          uploadButton.textContent = "uploading...";
        }
        if (statusEl) {
          statusEl.textContent = `uploading floorplan as ${siteId}-floorplan01...`;
          statusEl.hidden = false;
        }

        const response = await fetch(wirelessFloorplanFile, {
          method: "POST",
          body: formData,
          signal: controller.signal
        });
        if (!response.ok) {
          throw new Error(await responseErrorMessage(response));
        }

        const data = await response.json();
        input.value = "";
        if (statusEl) {
          statusEl.textContent = `uploaded ${data.floorplan?.filename || `${siteId}-floorplan01`}`;
          statusEl.hidden = false;
        }
        renderWirelessFloorplan(data.floorplan || null);
      } catch (error) {
        const message = error.name === "AbortError"
          ? "upload timed out after 120 seconds"
          : error.message;
        if (statusEl) {
          statusEl.textContent = message;
          statusEl.hidden = false;
        }
        console.error(error);
      } finally {
        window.clearTimeout(timeoutId);
        if (uploadButton) {
          uploadButton.disabled = false;
          uploadButton.textContent = "upload floorplan";
        }
      }
    }

    async function responseErrorMessage(response) {
      try {
        const data = await response.json();
        return data.message || data.error || `upload failed (${response.status})`;
      } catch (_error) {
        return `upload failed (${response.status})`;
      }

    async function uploadPhotos(event) {
      event.preventDefault();
      const input = document.getElementById("photo-input");
      const uploadButton = document.getElementById("photo-upload-button");
      const uploadStatusEl = document.getElementById("photo-upload-status");
      if (!input.files.length) {
        if (uploadStatusEl) {
          uploadStatusEl.textContent = "select one or more photos first";
        }
        return;
      }

      const formData = new FormData();
      formData.append("site", siteId);
      for (const file of input.files) {
        formData.append("photos", file);
      }

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 120000);

      try {
        if (uploadButton) {
          uploadButton.disabled = true;
          uploadButton.textContent = "uploading...";
        }
        if (uploadStatusEl) {
          uploadStatusEl.textContent = `uploading ${input.files.length} photo${input.files.length === 1 ? "" : "s"}...`;
        }

        const response = await fetch(photosFile, {
          method: "POST",
          body: formData,
          signal: controller.signal
        });
        if (!response.ok) {
          throw new Error(await responseErrorMessage(response));
        }

        const data = await response.json();
        input.value = "";
        if (uploadStatusEl) {
          const skipped = data.skipped?.length ? `, skipped ${data.skipped.length} unsupported file${data.skipped.length === 1 ? "" : "s"}` : "";
          uploadStatusEl.textContent = `uploaded ${data.uploaded?.length || 0} photo${(data.uploaded?.length || 0) === 1 ? "" : "s"}${skipped}`;
        }
        renderPhotos(data.photos || []);
      } catch (error) {
        const resultEl = document.getElementById("photo-results");
        const message = error.name === "AbortError"
          ? "upload timed out after 120 seconds"
          : error.message;
        if (uploadStatusEl) {
          uploadStatusEl.textContent = message;
        }
        if (resultEl) {
          resultEl.innerHTML = `<div class="error">${escapeHtml(message)}. Use jpg, png, gif, or webp files.</div>`;
        }
        console.error(error);
      } finally {
        window.clearTimeout(timeoutId);
        if (uploadButton) {
          uploadButton.disabled = false;
          uploadButton.textContent = "upload photos";
        }
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

      pageTitleEl.textContent = `SITE ${siteId}`;
      updateDeviceStatusButton();
      updateEndpointsButton();
      updateWirelessButton();
      updateRoutesButton();
      updateInterfacesButton();
      routesLinkEl.href = `/polaris-web/routes.html?site=${encodeURIComponent(siteId)}`;
      uptimeButtonEl.href = `/polaris-web/uptime.html?site=${encodeURIComponent(siteId)}`;
      endpointFeedLinkEl.href = `/feed?site=${encodeURIComponent(siteId)}`;
      telcoRoomsLinkEl.href = `/polaris-web/telco_rooms.html?site=${encodeURIComponent(siteId)}`;

      try {
        const response = await fetch(`${inventoryFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${inventoryFile} (${response.status})`);
        }

        const inventoryData = await response.json();
        inventoryImportedAt = inventoryData.imported_at || "";
        siteDevices = normalizeDevices(inventoryData.devices || []);
        updateDeviceStatusButton(siteDevices);
        updateWirelessButton(siteDevices);
        renderSiteAddress(siteDevices);
        renderSummary(siteDevices);
        renderDevices();
        try {
          const siteEndpoints = await loadSiteEndpointSummary();
          updateEndpointsButton(endpointSummaryMetrics(siteEndpoints));
          renderSummary(siteDevices, siteEndpoints);
        } catch (summaryError) {
          updateEndpointsButton();
          console.error(summaryError);
        }
        try {
          updateRoutesButton(await loadSiteRouteSummary());
        } catch (routeSummaryError) {
          updateRoutesButton();
          console.error(routeSummaryError);
        }
        try {
          const interfaceResponse = await fetch(`${interfacesFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
          if (!interfaceResponse.ok) {
            throw new Error(`Could not load ${interfacesFile} (${interfaceResponse.status})`);
          }
          const interfaceData = await interfaceResponse.json();
          updateInterfacesButton(interfaceData.total_interfaces || 0);
        } catch (interfaceSummaryError) {
          updateInterfacesButton();
          console.error(interfaceSummaryError);
        }
      } catch (error) {
        updateDeviceStatusButton();
        updateWirelessButton();
        updateRoutesButton();
        updateInterfacesButton();
        statusEl.textContent = "Unable to load this site.";
        statusEl.hidden = false;
        devicesEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read inventory.db.</div>';
        console.error(error);
      }
    }

    endpointsButtonEl.addEventListener("click", loadEndpoints);
    backupButtonEl.addEventListener("click", loadBackups);
    interfacesButtonEl.addEventListener("click", loadInterfaces);
    wirelessButtonEl.addEventListener("click", loadWireless);
    photosButtonEl.addEventListener("click", loadPhotos);
    deviceSearchEl.addEventListener("input", renderDevices);
    devicesToggleEl.addEventListener("click", () => setDevicesExpanded(!devicesExpanded));
    operationPanelEl.addEventListener("click", (event) => {
      if (event.target.closest("[data-back-site]")) {
        backToSite();
        return;
      }

      const backupToggle = event.target.closest("[data-backup-toggle]");
      if (backupToggle) {
        toggleBackupFile(backupToggle);
        return;
      }

      const interfaceSortButton = event.target.closest("[data-interface-sort]");
      if (interfaceSortButton) {
        event.preventDefault();
        event.stopPropagation();
        const key = interfaceSortButton.dataset.interfaceSort;
        const scrollY = window.scrollY;
        const isCounterSort = Boolean(interfaceSortButton.closest(".counters-section"));
        if (isCounterSort) {
          interfaceCountersExpanded = true;
          currentCounterSort = {
            key,
            direction: currentCounterSort.key === key && currentCounterSort.direction === "asc" ? "desc" : "asc"
          };
        } else {
          currentInterfaceSort = {
            key,
            direction: currentInterfaceSort.key === key && currentInterfaceSort.direction === "asc" ? "desc" : "asc"
          };
        }
        renderInterfaceResults();
        requestAnimationFrame(() => window.scrollTo({ top: scrollY }));
        return;
      }

      const countersSummary = event.target.closest("#interface-counters-section summary");
      if (countersSummary && countersSummary.parentElement?.id === "interface-counters-section") {
        const scrollY = window.scrollY;
        requestAnimationFrame(() => window.scrollTo({ top: scrollY }));
      }

      const photoButton = event.target.closest("[data-photo-index]");
      if (photoButton) {
        openPhotoViewer(Number(photoButton.dataset.photoIndex));
      }
    });
    operationPanelEl.addEventListener("toggle", (event) => {
      if (event.target.id === "interface-counters-section") {
        interfaceCountersExpanded = event.target.open;
      }
    }, true);
    photoViewerCloseEl.addEventListener("click", closePhotoViewer);
    photoViewerPrevEl.addEventListener("click", () => movePhotoViewer(-1));
    photoViewerNextEl.addEventListener("click", () => movePhotoViewer(1));
    photoViewerEl.addEventListener("click", (event) => {
      if (event.target === photoViewerEl) {
        closePhotoViewer();
      }
    });
    photoViewerStageEl.addEventListener("touchstart", (event) => {
      photoTouchStartX = event.changedTouches[0]?.clientX || 0;
    }, { passive: true });
    photoViewerStageEl.addEventListener("touchend", (event) => {
      const endX = event.changedTouches[0]?.clientX || 0;
      const distance = endX - photoTouchStartX;

      if (Math.abs(distance) > 48) {
        movePhotoViewer(distance > 0 ? -1 : 1);
      }
    }, { passive: true });
    document.addEventListener("keydown", (event) => {
      if (photoViewerEl.hidden) {
        return;
      }

      if (event.key === "Escape") {
        closePhotoViewer();
      } else if (event.key === "ArrowLeft") {
        movePhotoViewer(-1);
      } else if (event.key === "ArrowRight") {
        movePhotoViewer(1);
      }
    });
    loadSite();
  </script>
</body>
</html>
