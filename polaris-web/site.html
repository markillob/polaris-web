<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Site</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .page-actions {
      display: flex;
      justify-content: center;
      margin: -12px 0 24px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .hero-copy,
    .status {
      color: #485568;
      font-size: 18px;
      line-height: 1.55;
    }

    .hero-copy {
      max-width: 620px;
      margin: 0 auto;
    }

    .site-address {
      max-width: 720px;
      margin: 10px auto 0;
      color: #485568;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .site-address a {
      color: #2468f2;
      font-weight: 800;
      text-decoration: none;
    }

    .site-address a:hover,
    .site-address a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .status {
      margin: 0 0 18px;
      font-size: 14px;
      text-align: center;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .section-title {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .operation-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 0 0 28px;
    }

    .operation-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      appearance: none;
      background: #ffffff;
      color: #2468f2;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
    }

    .operation-button:hover,
    .operation-button:focus-visible,
    .operation-button.active {
      background: #2468f2;
      color: #ffffff;
      outline: none;
    }

    .photos-button {
      border-color: #7c3aed;
      color: #7c3aed;
    }

    .photos-button:hover,
    .photos-button:focus-visible,
    .photos-button.active {
      background: #7c3aed;
      color: #ffffff;
      outline: none;
    }

    .operation-panel {
      margin-bottom: 28px;
    }

    .panel-actions,
    .devices-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .secondary-button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #8a94a6;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    .secondary-button:hover,
    .secondary-button:focus-visible {
      border-color: #2468f2;
      color: #2468f2;
      outline: none;
    }

    .search-bar {
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .upload-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }

    .file-input {
      min-height: 40px;
      flex: 1 1 260px;
      padding: 8px 10px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .photo-card {
      overflow: hidden;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .photo-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .photo-button:focus-visible {
      outline: 3px solid rgba(36, 104, 242, 0.28);
      outline-offset: -3px;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      object-fit: cover;
      background: #eef3f8;
    }

    .metric-link {
      color: #2468f2;
      font-weight: 800;
      text-decoration: none;
    }

    .metric-link:hover,
    .metric-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .photo-viewer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 18px;
      background: rgba(15, 23, 42, 0.88);
    }

    .photo-viewer[hidden] {
      display: none;
    }

    .photo-viewer-header,
    .photo-viewer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #ffffff;
    }

    .photo-viewer-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .photo-viewer-stage {
      min-height: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .photo-viewer-image {
      max-width: 100%;
      max-height: 100%;
      justify-self: center;
      border-radius: 8px;
      background: #0f172a;
      object-fit: contain;
    }

    .viewer-button {
      min-height: 40px;
      min-width: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    .viewer-button:hover,
    .viewer-button:focus-visible {
      background: rgba(255, 255, 255, 0.22);
      outline: none;
    }

    .viewer-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .metric {
      padding: 16px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
      line-height: 1;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .hero {
        margin: 36px auto 24px;
      }

      .hero-copy {
        font-size: 16px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Polaris Site Detail</p>
      <h1 id="page-title">Loading site...</h1>
      <p class="site-address" id="site-address" hidden></p>
    </section>

    <section class="page-actions" aria-label="Page actions">
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </section>

    <p class="status" id="status">Loading device inventory...</p>
    <section class="summary" id="summary" aria-label="Site summary"></section>

    <section class="operation-actions" aria-label="Site operations">
      <button class="operation-button" type="button" id="uptime-button" aria-pressed="false">device status</button>
      <button class="operation-button" type="button" id="endpoints-button" aria-pressed="false">endpoints</button>
      <a class="operation-button" href="#" id="endpoint-feed-link">endpoint feed</a>
      <a class="operation-button" href="#" id="routes-link">routes</a>
      <button class="operation-button photos-button" type="button" id="photos-button" aria-pressed="false">photos</button>
    </section>
    <section class="operation-panel" id="operation-panel" aria-live="polite"></section>

    <div class="devices-header">
      <h2 class="section-title">Devices</h2>
      <button class="secondary-button" type="button" id="devices-toggle" aria-expanded="true" aria-controls="devices">collapse devices</button>
    </div>
    <div class="search-bar">
      <input class="search-input" type="search" id="device-search" placeholder="Filter devices by name, IP, serial, type, or role" autocomplete="off">
    </div>
    <section id="devices"></section>
  </main>

  <section class="photo-viewer" id="photo-viewer" aria-modal="true" role="dialog" aria-labelledby="photo-viewer-title" hidden>
    <div class="photo-viewer-header">
      <p class="photo-viewer-title" id="photo-viewer-title"></p>
      <button class="viewer-button" type="button" id="photo-viewer-close">close</button>
    </div>
    <div class="photo-viewer-stage" id="photo-viewer-stage">
      <button class="viewer-button" type="button" id="photo-viewer-prev" aria-label="previous photo">prev</button>
      <img class="photo-viewer-image" id="photo-viewer-image" alt="">
      <button class="viewer-button" type="button" id="photo-viewer-next" aria-label="next photo">next</button>
    </div>
    <div class="photo-viewer-footer">
      <span id="photo-viewer-count"></span>
      <span id="photo-viewer-meta"></span>
    </div>
  </section>

  <script>
    const pageTitleEl = document.getElementById("page-title");
    const siteAddressEl = document.getElementById("site-address");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const devicesEl = document.getElementById("devices");
    const deviceSearchEl = document.getElementById("device-search");
    const devicesToggleEl = document.getElementById("devices-toggle");
    const operationPanelEl = document.getElementById("operation-panel");
    const photoViewerEl = document.getElementById("photo-viewer");
    const photoViewerTitleEl = document.getElementById("photo-viewer-title");
    const photoViewerImageEl = document.getElementById("photo-viewer-image");
    const photoViewerCountEl = document.getElementById("photo-viewer-count");
    const photoViewerMetaEl = document.getElementById("photo-viewer-meta");
    const photoViewerPrevEl = document.getElementById("photo-viewer-prev");
    const photoViewerNextEl = document.getElementById("photo-viewer-next");
    const photoViewerCloseEl = document.getElementById("photo-viewer-close");
    const photoViewerStageEl = document.getElementById("photo-viewer-stage");
    const uptimeButtonEl = document.getElementById("uptime-button");
    const endpointsButtonEl = document.getElementById("endpoints-button");
    const endpointFeedLinkEl = document.getElementById("endpoint-feed-link");
    const routesLinkEl = document.getElementById("routes-link");
    const photosButtonEl = document.getElementById("photos-button");
    const siteId = new URLSearchParams(window.location.search).get("site");
    const inventoryFile = "/api/inventory";
    const inventorySourceName = "inventory.db";
    const operationsDataFile = "/polaris/data/site_operations.json";
    const endpointsFile = "/api/enterprise_endpoints";
    const endpointsSourceName = "enterprise_endpoints.db";
    const photosFile = "/api/site_photos";
    let operationsData = null;
    let endpointsData = null;
    let currentUptimeRows = [];
    let currentUptimeColumns = [];
    let currentUptimeFile = "";
    let currentUptimeUpdated = "";
    let currentEndpointRows = [];
    let currentEndpointVisibleRows = [];
    let currentEndpointColumns = [];
    let currentEndpointUpdated = "";
    let currentPhotoList = [];
    let currentPhotoIndex = 0;
    let photoTouchStartX = 0;
    let siteDevices = [];
    let devicesExpanded = true;
    const uptimeColumnAliases = {
      site: "site",
      device: "device",
      fqdn: "device",
      tech: "techRoom",
      techroom: "techRoom",
      tech_room: "techRoom",
      room: "techRoom",
      ip: "ipAddress",
      ipaddress: "ipAddress",
      ip_address: "ipAddress",
      member: "member",
      serial: "serialNumber",
      serialnumber: "serialNumber",
      serial_number: "serialNumber",
      uptime: "uptime",
      code: "codeVersion",
      codeversion: "codeVersion",
      code_version: "codeVersion",
      version: "codeVersion"
    };
    const endpointColumnAliases = {
      device: "device",
      fqdn: "device",
      host: "hostname",
      hostname: "hostname",
      name: "hostname",
      ip: "entryIp",
      entryip: "entryIp",
      entry_ip: "entryIp",
      endpointip: "entryIp",
      endpoint_ip: "entryIp",
      mac: "entryMac",
      entrymac: "entryMac",
      entry_mac: "entryMac",
      endpointmac: "entryMac",
      endpoint_mac: "entryMac",
      vlan: "vlan",
      port: "devicePort",
      interface: "devicePort",
      deviceport: "devicePort",
      device_port: "devicePort",
      status: "status",
      active: "status",
      state: "status",
      lastseen: "lastSeen",
      last_seen: "lastSeen"
    };

    function normalizeDevices(rows) {
      return (rows || []).map((row) => ({
        fqdn: row.fqdn || "-",
        ipAddress: row.ip_address || "-",
        serialNumber: row.serial_number || "-",
        deviceType: row.device_type || "-",
        deviceRole: row.device_role || "-",
        physicalAddress: normalizePhysicalAddress(row)
      }));
    }

    function normalizePhysicalAddress(row) {
      let address = String(row.physical_address || "").trim();
      const continuation = String(row.comment_01 || "").trim();

      if (address.startsWith('"') && continuation && !address.endsWith('"')) {
        address = `${address} ${continuation}`;
      }

      return address.replace(/^"+|"+$/g, "").trim();
    }

    function isUsablePhysicalAddress(value) {
      const normalized = String(value || "").trim().toLowerCase();
      return normalized && !["-", "na", "n/a", "none", "null", "tbd"].includes(normalized);
    }

    function firstPhysicalAddress(devices) {
      for (const device of devices || []) {
        const address = String(device.physicalAddress || "").trim();
        if (isUsablePhysicalAddress(address)) {
          return address;
        }
      }

      return "";
    }

    function googleMapsUrl(address) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }

    function renderSiteAddress(devices) {
      const address = firstPhysicalAddress(devices);
      siteAddressEl.hidden = !address;
      siteAddressEl.innerHTML = address
        ? `<a href="${googleMapsUrl(address)}" target="_blank" rel="noopener noreferrer">${escapeHtml(address)}</a>`
        : "";
    }

    function renderSummary(devices) {
      const deviceTypes = new Set(devices.map((device) => device.deviceType).filter((type) => type !== "-"));
      const gatewayCount = devices.filter((device) => device.deviceRole.toLowerCase().includes("gateway")).length;

      summaryEl.innerHTML = `
        <article class="metric">
          <span>Total Devices</span>
          <strong>${devices.length}</strong>
        </article>
        <article class="metric">
          <span>Device Types</span>
          <strong>${deviceTypes.size}</strong>
        </article>
        <article class="metric">
          <span>L3 Gateways</span>
          <strong>${gatewayCount}</strong>
        </article>
      `;
    }

    function deviceMatchesQuery(device, query) {
      if (!query) {
        return true;
      }

      return [
        device.fqdn,
        device.ipAddress,
        device.serialNumber,
        device.deviceType,
        device.deviceRole
      ].some((value) => String(value).toLowerCase().includes(query));
    }

    function renderDevices() {
      const query = deviceSearchEl.value.trim().toLowerCase();
      const devices = siteDevices.filter((device) => deviceMatchesQuery(device, query));

      if (devices.length === 0) {
        devicesEl.innerHTML = query
          ? '<div class="empty">No devices match the current filter.</div>'
          : '<div class="empty">No devices found for this site.</div>';
        statusEl.textContent = query
          ? `0 of ${siteDevices.length} devices at site ${siteId}`
          : `0 devices at site ${siteId}`;
        return;
      }

      const rows = devices.map((device, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(device.fqdn)}</td>
          <td>${escapeHtml(device.ipAddress)}</td>
          <td>${escapeHtml(device.serialNumber)}</td>
          <td>${escapeHtml(device.deviceType)}</td>
          <td>${escapeHtml(device.deviceRole)}</td>
        </tr>
      `).join("");

      devicesEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>FQDN</th>
                <th>IP Address</th>
                <th>Serial Number</th>
                <th>Device Type</th>
                <th>Device Role</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      statusEl.textContent = query
        ? `${devices.length} of ${siteDevices.length} devices at site ${siteId}`
        : `${devices.length} devices at site ${siteId}`;
    }

    function setDevicesExpanded(expanded) {
      devicesExpanded = expanded;
      devicesEl.hidden = !expanded;
      devicesToggleEl.textContent = expanded ? "collapse devices" : "expand devices";
      devicesToggleEl.setAttribute("aria-expanded", String(expanded));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (character === '"' && inQuotes && nextCharacter === '"') {
          field += '"';
          index += 1;
        } else if (character === '"') {
          inQuotes = !inQuotes;
        } else if (character === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((character === "\n" || character === "\r") && !inQuotes) {
          if (character === "\r" && nextCharacter === "\n") {
            index += 1;
          }
          row.push(field);
          if (row.some((value) => value.trim() !== "")) {
            rows.push(row);
          }
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field);
      if (row.some((value) => value.trim() !== "")) {
        rows.push(row);
      }

      const headers = rows.shift() || [];
      return rows.map((columns) => Object.fromEntries(headers.map((header, index) => [
        header,
        columns[index]?.trim() || ""
      ])));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function formatFileName(path) {
      return path.split("/").pop() || path;
    }

    async function getOperationsData() {
      if (operationsData) {
        return operationsData;
      }

      const response = await fetch(operationsDataFile, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${operationsDataFile} (${response.status})`);
      }

      operationsData = await response.json();
      return operationsData;
    }

    function normalizeUptimeRows(rows) {
      return rows
        .filter((row) => String(getFirstValue(row, ["Site", "site"])) === siteId)
        .map((row) => ({
          site: getFirstValue(row, ["Site", "site"]),
          device: getFirstValue(row, ["FQDN", "fqdn", "Device", "device"]),
          techRoom: getFirstValue(row, ["Tech_Room", "tech_room", "Tech Room", "techRoom"]),
          ipAddress: getFirstValue(row, ["IP_Address", "ip_address"]),
          member: getFirstValue(row, ["Member", "member"]),
          serialNumber: getFirstValue(row, ["Serial_Number", "Member_Serial", "serial_number"]),
          uptime: getFirstValue(row, ["Uptime", "Member_Uptime", "uptime"]),
          codeVersion: getFirstValue(row, ["Code_Version", "code_version", "Code Version", "codeVersion"])
        }));
    }

    function normalizeEndpointRows(rows) {
      return rows
        .filter((row) => getFirstValue(row, ["site", "Site"]) === siteId)
        .map((row) => ({
          device: getFirstValue(row, ["device_fqdn", "Device_FQDN"]),
          hostname: getFirstValue(row, ["Hostname", "hostname"]),
          entryIp: getFirstValue(row, ["entry_ip", "Entry_IP"]),
          entryMac: getFirstValue(row, ["entry_mac", "Entry_MAC"]),
          vlan: getFirstValue(row, ["entry_vlan", "Entry_VLAN"]),
          devicePort: getFirstValue(row, ["device_port", "Device_Port", "Entry_Port"]),
          status: getFirstValue(row, ["active", "Active", "status", "Status"]),
          lastSeen: getFirstValue(row, ["last_seen", "Last_Seen", "lastSeen"])
        }));
    }

    function vlanSortValue(value) {
      const match = String(value).match(/\d+/);
      return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
    }

    function statusSortValue(value) {
      const normalized = String(value).toLowerCase();
      if (["yes", "true", "active", "reachable"].includes(normalized)) {
        return 0;
      }
      if (["no", "false", "inactive", "unreachable"].includes(normalized)) {
        return 1;
      }
      if (normalized.includes("reachable")) {
        return normalized.includes("unreachable") ? 1 : 0;
      }
      return 2;
    }

    function sortEndpointRows(rows) {
      return [...rows].sort((a, b) => (
        vlanSortValue(a.vlan) - vlanSortValue(b.vlan) ||
        statusSortValue(a.status) - statusSortValue(b.status) ||
        a.device.localeCompare(b.device) ||
        a.hostname.localeCompare(b.hostname)
      ));
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key, columns, aliases) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function rowMatchesToken(row, token, columns, aliases) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key, columns, aliases);

        if (columnKey && value) {
          return valueMatches(row[columnKey], value);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesQuery(row, query, columns, aliases) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token, columns, aliases));
    }

    function renderUptimeResults() {
      const searchEl = document.getElementById("uptime-search");
      const query = searchEl ? searchEl.value.trim() : "";
      const visibleRows = currentUptimeRows.filter((row) => rowMatchesQuery(row, query, currentUptimeColumns, uptimeColumnAliases));
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${currentUptimeRows.length} uptime records`
        : `Showing ${currentUptimeRows.length} uptime records`;
      const resultEl = document.getElementById("uptime-results");
      const countEl = document.getElementById("uptime-count");

      if (countEl) {
        countEl.textContent = `${countLabel} for site ${siteId} from ${formatFileName(currentUptimeFile)}${currentUptimeUpdated}`;
      }

      if (resultEl) {
        resultEl.innerHTML = renderTable(visibleRows, currentUptimeColumns);
      }
    }

    function renderEndpointResults() {
      const searchEl = document.getElementById("endpoint-search");
      const query = searchEl ? searchEl.value.trim() : "";
      const visibleRows = currentEndpointRows.filter((row) => rowMatchesQuery(row, query, currentEndpointColumns, endpointColumnAliases));
      currentEndpointVisibleRows = visibleRows;
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${currentEndpointRows.length} endpoints`
        : `Showing ${currentEndpointRows.length} endpoints`;
      const resultEl = document.getElementById("endpoint-results");
      const countEl = document.getElementById("endpoint-count");
      const summaryEl = document.getElementById("endpoint-summary");

      if (countEl) {
        countEl.textContent = `${countLabel} for site ${siteId} from ${endpointsSourceName}${currentEndpointUpdated}`;
      }

      if (summaryEl) {
        summaryEl.innerHTML = renderEndpointSummary(visibleRows);
      }

      if (resultEl) {
        resultEl.innerHTML = renderTable(visibleRows, currentEndpointColumns);
      }
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportEndpointCsv() {
      const rows = currentEndpointVisibleRows.length ? currentEndpointVisibleRows : currentEndpointRows;
      if (rows.length === 0) {
        return;
      }

      const header = currentEndpointColumns.map((column) => csvEscape(column.label)).join(",");
      const body = rows.map((row) => (
        currentEndpointColumns.map((column) => csvEscape(row[column.key])).join(",")
      )).join("\n");
      const csv = `${header}\n${body}\n`;
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `polaris_site_${siteId}_endpoints.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function renderEndpointSummary(rows) {
      const vlans = new Set();
      const macs = new Set();

      for (const row of rows) {
        const vlan = String(row.vlan || "").trim();
        const mac = String(row.entryMac || "").trim().toLowerCase();

        if (vlan && vlan !== "-") {
          vlans.add(vlan);
        }

        if (mac && mac !== "-") {
          macs.add(mac);
        }
      }

      return `
        <div class="summary" aria-label="Endpoint summary for site ${escapeHtml(siteId)}">
          <article class="metric">
            <span>Site</span>
            <strong>${escapeHtml(siteId)}</strong>
          </article>
          <article class="metric">
            <span>VLANs</span>
            <strong><a class="metric-link" href="/vlans?site=${encodeURIComponent(siteId)}">${vlans.size}</a></strong>
          </article>
          <article class="metric">
            <span>Total Endpoints</span>
            <strong>${rows.length}</strong>
          </article>
          <article class="metric">
            <span>Total MAC Addresses</span>
            <strong>${macs.size}</strong>
          </article>
        </div>
      `;
    }

    function renderTable(rows, columns) {
      if (rows.length === 0) {
        return '<div class="empty">No records found in this file for the selected site.</div>';
      }

      const headers = columns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join("");
      const body = rows.map((row) => `
        <tr>
          ${columns.map((column) => `<td>${escapeHtml(row[column.key])}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function setActiveOperation(kind) {
      const showingUptime = kind === "uptime";
      const showingEndpoints = kind === "endpoints";
      const showingPhotos = kind === "photos";

      uptimeButtonEl.classList.toggle("active", showingUptime);
      endpointsButtonEl.classList.toggle("active", showingEndpoints);
      photosButtonEl.classList.toggle("active", showingPhotos);
      uptimeButtonEl.setAttribute("aria-pressed", String(showingUptime));
      endpointsButtonEl.setAttribute("aria-pressed", String(showingEndpoints));
      photosButtonEl.setAttribute("aria-pressed", String(showingPhotos));
    }

    function submenuHeader(title) {
      return `
        <div class="panel-actions">
          <h2 class="section-title">${escapeHtml(title)}</h2>
          <button class="secondary-button" type="button" data-back-site>back to site</button>
        </div>
      `;
    }

    function backToSite() {
      setActiveOperation(null);
      operationPanelEl.innerHTML = "";
      operationPanelEl.removeAttribute("tabindex");
      pageTitleEl.focus?.();
    }

    async function getEndpointsData() {
      if (endpointsData) {
        return endpointsData;
      }

      const response = await fetch(endpointsFile, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${endpointsFile} (${response.status})`);
      }

      endpointsData = await response.json();
      return endpointsData;
    }

    async function loadUptime() {
      setActiveOperation("uptime");
      operationPanelEl.innerHTML = '<div class="empty">Loading Device Status data...</div>';

      try {
        const data = await getOperationsData();
        currentUptimeFile = operationsDataFile;
        currentUptimeUpdated = data.last_updated ? `, updated ${data.last_updated}` : "";
        currentUptimeRows = normalizeUptimeRows(data.records || []);
        currentUptimeColumns = [
          { key: "device", label: "Device" },
          { key: "techRoom", label: "Tech Room" },
          { key: "serialNumber", label: "Serial Number" },
          { key: "uptime", label: "uptime" },
          { key: "codeVersion", label: "code_version" }
        ];

        operationPanelEl.innerHTML = `
          ${submenuHeader("Device Status")}
          <div class="search-bar">
            <input class="search-input" type="search" id="uptime-search" placeholder="Search all columns or use filters like device:core serial:VN56 uptime:weeks code:17" autocomplete="off">
          </div>
          <p class="status" id="uptime-count"></p>
          <div id="uptime-results"></div>
        `;
        document.getElementById("uptime-search").addEventListener("input", renderUptimeResults);
        renderUptimeResults();
      } catch (error) {
        operationPanelEl.innerHTML = '<div class="error">Unable to load Device Status data for this site.</div>';
        console.error(error);
      }
    }

    async function loadEndpoints() {
      setActiveOperation("endpoints");
      operationPanelEl.innerHTML = '<div class="empty">Loading Endpoints data...</div>';

      try {
        const data = await getEndpointsData();
        currentEndpointRows = sortEndpointRows(normalizeEndpointRows(data.endpoints || []));
        currentEndpointColumns = [
          { key: "device", label: "Device" },
          { key: "hostname", label: "Hostname" },
          { key: "entryIp", label: "Endpoint IP" },
          { key: "entryMac", label: "Endpoint MAC" },
          { key: "vlan", label: "VLAN" },
          { key: "devicePort", label: "device_port" },
          { key: "status", label: "STATUS" },
          { key: "lastSeen", label: "last_seen" }
        ];
        currentEndpointUpdated = data.last_updated ? `, updated ${data.last_updated}` : "";

        operationPanelEl.innerHTML = `
          ${submenuHeader("Endpoints")}
          <div class="panel-actions">
            <div class="search-bar" style="flex: 1; margin-bottom: 0;">
              <input class="search-input" type="search" id="endpoint-search" placeholder="Search all columns or use filters like hostname:AP114 vlan:45 status:true last_seen:2026" autocomplete="off">
            </div>
            <button class="secondary-button" type="button" id="endpoint-export">export csv</button>
          </div>
          <p class="status" id="endpoint-count"></p>
          <div id="endpoint-summary"></div>
          <div id="endpoint-results"></div>
        `;
        document.getElementById("endpoint-search").addEventListener("input", renderEndpointResults);
        document.getElementById("endpoint-export").addEventListener("click", exportEndpointCsv);
        renderEndpointResults();
      } catch (error) {
        operationPanelEl.innerHTML = '<div class="error">Unable to load Endpoints data for this site.</div>';
        console.error(error);
      }
    }

    function renderPhotos(photos) {
      const resultEl = document.getElementById("photo-results");
      const countEl = document.getElementById("photo-count");
      currentPhotoList = photos;

      if (countEl) {
        countEl.textContent = `showing ${photos.length} photo${photos.length === 1 ? "" : "s"} for site ${siteId} from data/site_photos`;
      }

      if (!resultEl) {
        return;
      }

      if (photos.length === 0) {
        resultEl.innerHTML = '<div class="empty">No photos uploaded for this site.</div>';
        return;
      }

      resultEl.innerHTML = `
        <div class="photo-grid">
          ${photos.map((photo, index) => `
            <article class="photo-card">
              <button class="photo-button" type="button" data-photo-index="${index}">
                <img src="${escapeHtml(photo.url)}" alt="site ${escapeHtml(siteId)} photo ${escapeHtml(photo.filename)}">
              </button>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderPhotoViewer() {
      const photo = currentPhotoList[currentPhotoIndex];
      if (!photo) {
        closePhotoViewer();
        return;
      }

      photoViewerTitleEl.textContent = photo.filename || `site ${siteId} photo`;
      photoViewerImageEl.src = photo.url;
      photoViewerImageEl.alt = `site ${siteId} photo ${photo.filename || currentPhotoIndex + 1}`;
      photoViewerCountEl.textContent = `${currentPhotoIndex + 1} of ${currentPhotoList.length}`;
      photoViewerMetaEl.textContent = "";
      photoViewerPrevEl.disabled = currentPhotoList.length <= 1;
      photoViewerNextEl.disabled = currentPhotoList.length <= 1;
    }

    function openPhotoViewer(index) {
      if (!currentPhotoList.length) {
        return;
      }

      currentPhotoIndex = Math.max(0, Math.min(index, currentPhotoList.length - 1));
      renderPhotoViewer();
      photoViewerEl.hidden = false;
      document.body.style.overflow = "hidden";
      photoViewerCloseEl.focus();
    }

    function closePhotoViewer() {
      photoViewerEl.hidden = true;
      photoViewerImageEl.removeAttribute("src");
      document.body.style.overflow = "";
    }

    function movePhotoViewer(direction) {
      if (!currentPhotoList.length) {
        return;
      }

      currentPhotoIndex = (currentPhotoIndex + direction + currentPhotoList.length) % currentPhotoList.length;
      renderPhotoViewer();
    }

    async function fetchPhotos() {
      const response = await fetch(`${photosFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${photosFile} (${response.status})`);
      }

      return response.json();
    }

    async function loadPhotos() {
      setActiveOperation("photos");
      operationPanelEl.innerHTML = '<div class="empty">Loading photos...</div>';

      try {
        const data = await fetchPhotos();
        operationPanelEl.innerHTML = `
          ${submenuHeader("photos")}
          <form class="upload-form" id="photo-upload-form">
            <input class="file-input" type="file" id="photo-input" name="photos" accept="image/*" multiple>
            <button class="secondary-button" type="submit" id="photo-upload-button">upload photos</button>
          </form>
          <p class="status" id="photo-upload-status"></p>
          <p class="status" id="photo-count"></p>
          <div id="photo-results"></div>
        `;
        document.getElementById("photo-upload-form").addEventListener("submit", uploadPhotos);
        document.getElementById("photo-input").addEventListener("change", updatePhotoUploadStatus);
        renderPhotos(data.photos || []);
      } catch (error) {
        operationPanelEl.innerHTML = '<div class="error">Unable to load photos for this site.</div>';
        console.error(error);
      }
    }

    function updatePhotoUploadStatus() {
      const input = document.getElementById("photo-input");
      const statusEl = document.getElementById("photo-upload-status");

      if (!input || !statusEl) {
        return;
      }

      statusEl.textContent = input.files.length
        ? `${input.files.length} photo${input.files.length === 1 ? "" : "s"} selected`
        : "";
    }

    async function responseErrorMessage(response) {
      try {
        const data = await response.json();
        return data.message || data.error || `upload failed (${response.status})`;
      } catch (_error) {
        return `upload failed (${response.status})`;
      }
    }

    async function uploadPhotos(event) {
      event.preventDefault();
      const input = document.getElementById("photo-input");
      const uploadButton = document.getElementById("photo-upload-button");
      const uploadStatusEl = document.getElementById("photo-upload-status");
      if (!input.files.length) {
        if (uploadStatusEl) {
          uploadStatusEl.textContent = "select one or more photos first";
        }
        return;
      }

      const formData = new FormData();
      formData.append("site", siteId);
      for (const file of input.files) {
        formData.append("photos", file);
      }

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 120000);

      try {
        if (uploadButton) {
          uploadButton.disabled = true;
          uploadButton.textContent = "uploading...";
        }
        if (uploadStatusEl) {
          uploadStatusEl.textContent = `uploading ${input.files.length} photo${input.files.length === 1 ? "" : "s"}...`;
        }

        const response = await fetch(photosFile, {
          method: "POST",
          body: formData,
          signal: controller.signal
        });
        if (!response.ok) {
          throw new Error(await responseErrorMessage(response));
        }

        const data = await response.json();
        input.value = "";
        if (uploadStatusEl) {
          const skipped = data.skipped?.length ? `, skipped ${data.skipped.length} unsupported file${data.skipped.length === 1 ? "" : "s"}` : "";
          uploadStatusEl.textContent = `uploaded ${data.uploaded?.length || 0} photo${(data.uploaded?.length || 0) === 1 ? "" : "s"}${skipped}`;
        }
        renderPhotos(data.photos || []);
      } catch (error) {
        const resultEl = document.getElementById("photo-results");
        const message = error.name === "AbortError"
          ? "upload timed out after 120 seconds"
          : error.message;
        if (uploadStatusEl) {
          uploadStatusEl.textContent = message;
        }
        if (resultEl) {
          resultEl.innerHTML = `<div class="error">${escapeHtml(message)}. Use jpg, png, gif, or webp files.</div>`;
        }
        console.error(error);
      } finally {
        window.clearTimeout(timeoutId);
        if (uploadButton) {
          uploadButton.disabled = false;
          uploadButton.textContent = "upload photos";
        }
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    async function loadSite() {
      if (!siteId) {
        pageTitleEl.textContent = "Site not selected";
        statusEl.textContent = "Open this page from a site button on the main page.";
        devicesEl.innerHTML = '<div class="error">Missing site ID.</div>';
        return;
      }

      pageTitleEl.textContent = `Site ${siteId}`;
      routesLinkEl.href = `/polaris-web/routes.html?site=${encodeURIComponent(siteId)}`;
      endpointFeedLinkEl.href = `/endpoint_feed?site=${encodeURIComponent(siteId)}`;

      try {
        const response = await fetch(`${inventoryFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${inventoryFile} (${response.status})`);
        }

        siteDevices = normalizeDevices((await response.json()).devices || []);
        renderSiteAddress(siteDevices);
        renderSummary(siteDevices);
        renderDevices();
      } catch (error) {
        statusEl.textContent = "Unable to load this site.";
        devicesEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read inventory.db.</div>';
        console.error(error);
      }
    }

    uptimeButtonEl.addEventListener("click", loadUptime);
    endpointsButtonEl.addEventListener("click", loadEndpoints);
    photosButtonEl.addEventListener("click", loadPhotos);
    deviceSearchEl.addEventListener("input", renderDevices);
    devicesToggleEl.addEventListener("click", () => setDevicesExpanded(!devicesExpanded));
    operationPanelEl.addEventListener("click", (event) => {
      if (event.target.closest("[data-back-site]")) {
        backToSite();
        return;
      }

      const photoButton = event.target.closest("[data-photo-index]");
      if (photoButton) {
        openPhotoViewer(Number(photoButton.dataset.photoIndex));
      }
    });
    photoViewerCloseEl.addEventListener("click", closePhotoViewer);
    photoViewerPrevEl.addEventListener("click", () => movePhotoViewer(-1));
    photoViewerNextEl.addEventListener("click", () => movePhotoViewer(1));
    photoViewerEl.addEventListener("click", (event) => {
      if (event.target === photoViewerEl) {
        closePhotoViewer();
      }
    });
    photoViewerStageEl.addEventListener("touchstart", (event) => {
      photoTouchStartX = event.changedTouches[0]?.clientX || 0;
    }, { passive: true });
    photoViewerStageEl.addEventListener("touchend", (event) => {
      const endX = event.changedTouches[0]?.clientX || 0;
      const distance = endX - photoTouchStartX;

      if (Math.abs(distance) > 48) {
        movePhotoViewer(distance > 0 ? -1 : 1);
      }
    }, { passive: true });
    document.addEventListener("keydown", (event) => {
      if (photoViewerEl.hidden) {
        return;
      }

      if (event.key === "Escape") {
        closePhotoViewer();
      } else if (event.key === "ArrowLeft") {
        movePhotoViewer(-1);
      } else if (event.key === "ArrowRight") {
        movePhotoViewer(1);
      }
    });
    loadSite();
  </script>
</body>
</html>
