<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris endpoint_feed</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin: 0 0 18px;
    }

    .metric,
    .feed-section {
      min-width: 0;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
    }

    .metric {
      padding: 16px;
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(16px, 2vw, 26px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(160px, 240px) minmax(220px, 1fr);
      gap: 12px;
      margin: 0 0 14px;
    }

    .search-input,
    .site-select {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus,
    .site-select:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .feed {
      display: grid;
      gap: 12px;
    }

    .feed-section {
      overflow: hidden;
    }

    .toggle-button {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border: 0;
      background: #ffffff;
      color: #172033;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      text-align: left;
    }

    .toggle-button:hover,
    .toggle-button:focus-visible {
      background: #eef4ff;
      outline: none;
    }

    .toggle-counts {
      color: #667080;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .week-body,
    .site-body {
      display: grid;
      gap: 12px;
      padding: 12px;
      border-top: 1px solid #e4e9f1;
    }

    .site-section {
      border: 1px solid #e4e9f1;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }

    .endpoint-groups {
      display: grid;
      gap: 12px;
    }

    .endpoint-group {
      border: 1px solid #e4e9f1;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }

    .group-body {
      padding: 12px;
      border-top: 1px solid #e4e9f1;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 960px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    .info-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 0;
    }

    .info-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    @media (max-width: 720px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .toggle-button {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Endpoint Database</p>
      <h1 id="page-title">endpoint_feed</h1>
    </section>

    <section class="summary-grid" id="feed-summary"></section>
    <section class="controls" aria-label="Endpoint feed controls">
      <select class="site-select" id="site-filter" aria-label="Filter by site">
        <option value="">All sites</option>
      </select>
      <input class="search-input" type="search" id="feed-search" placeholder="Search visible endpoints by site, network device, endpoint IP, MAC, VLAN, hostname, or status" autocomplete="off">
    </section>
    <p class="status" id="feed-message">Loading endpoint_feed from enterprise_endpoints.db...</p>
    <section class="feed" id="feed-results"></section>
    <section class="info-actions" id="feed-snapshot-info" aria-label="Snapshot information"></section>
  </main>

  <script>
    const feedSummaryEl = document.getElementById("feed-summary");
    const siteFilterEl = document.getElementById("site-filter");
    const feedSearchEl = document.getElementById("feed-search");
    const feedMessageEl = document.getElementById("feed-message");
    const feedResultsEl = document.getElementById("feed-results");
    const feedSnapshotInfoEl = document.getElementById("feed-snapshot-info");
    const initialSite = new URLSearchParams(window.location.search).get("site") || "";
    let feedData = null;
    let selectedSite = initialSite;
    let openWeeks = new Set();
    let openSites = new Set();
    let openGroups = new Set();

    function escapeHtml(value) {
      return String(value ?? "-").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function rowMatchesQuery(row, query) {
      if (!query) {
        return true;
      }

      return [
        row.site,
        row.device_fqdn,
        row.hostname,
        row.entry_ip,
        row.entry_mac,
        row.entry_vlan,
        row.device_port,
        row.active,
        row.first_seen,
        row.last_seen
      ].some((value) => String(value || "").toLowerCase().includes(query));
    }

    function filteredRows(rows) {
      const query = feedSearchEl.value.trim().toLowerCase();
      return (rows || []).filter((row) => rowMatchesQuery(row, query));
    }

    function visibleSites(week) {
      return (week.sites || []).filter((site) => !selectedSite || site.site === selectedSite);
    }

    function visibleWeeks() {
      return (feedData?.weeks || []).filter((week) => visibleSites(week).length > 0);
    }

    function renderSiteOptions() {
      const sites = new Set();
      for (const week of feedData?.weeks || []) {
        for (const site of week.sites || []) {
          sites.add(site.site);
        }
      }

      const options = [...sites].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      siteFilterEl.innerHTML = '<option value="">All sites</option>';
      for (const site of options) {
        const option = document.createElement("option");
        option.value = site;
        option.textContent = site;
        siteFilterEl.append(option);
      }
      siteFilterEl.value = selectedSite;
    }

    function renderSummary() {
      const weeks = visibleWeeks();
      const totals = weeks.reduce((summary, week) => {
        for (const site of visibleSites(week)) {
          summary.appeared += site.summary?.appeared || 0;
          summary.disappeared += site.summary?.disappeared || 0;
          summary.available += site.summary?.available || 0;
        }
        return summary;
      }, { appeared: 0, disappeared: 0, available: 0 });

      feedSummaryEl.innerHTML = `
        <article class="metric">
          <span>Weeks</span>
          <strong>${weeks.length}</strong>
        </article>
        <article class="metric">
          <span>Appeared</span>
          <strong>${totals.appeared}</strong>
        </article>
        <article class="metric">
          <span>Disappeared</span>
          <strong>${totals.disappeared}</strong>
        </article>
        <article class="metric">
          <span>Available</span>
          <strong>${totals.available}</strong>
        </article>
      `;
    }

    function endpointTable(rows) {
      const visibleRows = filteredRows(rows);
      if (visibleRows.length === 0) {
        return '<div class="empty">No endpoints match the current search.</div>';
      }

      const body = visibleRows.map((row) => `
        <tr>
          <td>${escapeHtml(row.device_fqdn)}</td>
          <td>${escapeHtml(row.hostname)}</td>
          <td>${escapeHtml(row.entry_ip)}</td>
          <td>${escapeHtml(row.entry_mac)}</td>
          <td>${escapeHtml(row.entry_vlan)}</td>
          <td>${escapeHtml(row.device_port)}</td>
          <td>${escapeHtml(row.active)}</td>
          <td>${escapeHtml(row.first_seen)}</td>
          <td>${escapeHtml(row.last_seen)}</td>
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Network Device</th>
                <th>Hostname</th>
                <th>Endpoint IP</th>
                <th>Endpoint MAC</th>
                <th>VLAN</th>
                <th>device_port</th>
                <th>STATUS</th>
                <th>first_seen</th>
                <th>last_seen</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function endpointGroup(title, rows, groupKey) {
      const groupOpen = openGroups.has(groupKey);
      return `
        <section class="endpoint-group">
          <button class="toggle-button" type="button" data-group-toggle="${escapeHtml(groupKey)}" aria-expanded="${groupOpen}">
            <span>${escapeHtml(title)}</span>
            <span class="toggle-counts">${rows.length} endpoints</span>
          </button>
          ${groupOpen ? `<div class="group-body">${endpointTable(rows)}</div>` : ""}
        </section>
      `;
    }

    function renderFeed() {
      renderSummary();
      const weeks = visibleWeeks();
      if (weeks.length === 0) {
        feedMessageEl.textContent = "No endpoint_feed weeks match the current site filter.";
        feedResultsEl.innerHTML = '<div class="empty">No endpoint feed data found.</div>';
        return;
      }

      const weekHtml = weeks.map((week) => {
        const weekOpen = openWeeks.has(week.key);
        const sites = visibleSites(week);
        const siteHtml = weekOpen ? sites.map((site) => {
          const siteKey = `${week.key}|${site.site}`;
          const siteOpen = openSites.has(siteKey);
          return `
            <section class="site-section">
              <button class="toggle-button" type="button" data-site-toggle="${escapeHtml(siteKey)}" aria-expanded="${siteOpen}">
                <span>site ${escapeHtml(site.site)}</span>
                <span class="toggle-counts">appeared ${site.summary.appeared} / disappeared ${site.summary.disappeared} / available ${site.summary.available}</span>
              </button>
              ${siteOpen ? `
                <div class="site-body">
                  <div class="endpoint-groups">
                    ${endpointGroup("appeared", site.appeared || [], `${siteKey}|appeared`)}
                    ${endpointGroup("disappeared", site.disappeared || [], `${siteKey}|disappeared`)}
                    ${endpointGroup("available", site.available || [], `${siteKey}|available`)}
                  </div>
                </div>
              ` : ""}
            </section>
          `;
        }).join("") : "";

        const appeared = sites.reduce((total, site) => total + (site.summary?.appeared || 0), 0);
        const disappeared = sites.reduce((total, site) => total + (site.summary?.disappeared || 0), 0);
        const available = sites.reduce((total, site) => total + (site.summary?.available || 0), 0);

        return `
          <section class="feed-section">
            <button class="toggle-button" type="button" data-week-toggle="${escapeHtml(week.key)}" aria-expanded="${weekOpen}">
              <span>${escapeHtml(week.label)}</span>
              <span class="toggle-counts">sites ${sites.length} / appeared ${appeared} / disappeared ${disappeared} / available ${available}</span>
            </button>
            ${weekOpen ? `<div class="week-body">${siteHtml}</div>` : ""}
          </section>
        `;
      }).join("");

      feedMessageEl.textContent = `Showing ${weeks.length} endpoint_feed week${weeks.length === 1 ? "" : "s"}${selectedSite ? ` for site ${selectedSite}` : ""}`;
      feedResultsEl.innerHTML = weekHtml;
    }

    function renderSnapshotInfo() {
      feedSnapshotInfoEl.innerHTML = `
        <span class="info-button">current snapshot: ${escapeHtml(feedData?.current_snapshot || "-")}</span>
        <span class="info-button">source: enterprise_endpoints.db</span>
      `;
    }

    async function loadFeed() {
      try {
        const response = await fetch("/api/endpoint_feed", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load endpoint_feed (${response.status})`);
        }

        feedData = await response.json();
        if (feedData.weeks?.[0]) {
          openWeeks.add(feedData.weeks[0].key);
        }
        renderSiteOptions();
        renderFeed();
        renderSnapshotInfo();
      } catch (error) {
        feedSummaryEl.innerHTML = "";
        feedSnapshotInfoEl.innerHTML = "";
        feedMessageEl.textContent = "Unable to load endpoint_feed.";
        feedResultsEl.innerHTML = '<div class="error">Start the Polaris Flask server with python3 serve_polaris.py so the page can read enterprise_endpoints.db.</div>';
        console.error(error);
      }
    }

    feedResultsEl.addEventListener("click", (event) => {
      const weekButton = event.target.closest("[data-week-toggle]");
      const siteButton = event.target.closest("[data-site-toggle]");
      const groupButton = event.target.closest("[data-group-toggle]");

      if (weekButton) {
        const key = weekButton.dataset.weekToggle;
        if (openWeeks.has(key)) {
          openWeeks.delete(key);
        } else {
          openWeeks.add(key);
        }
        renderFeed();
      }

      if (siteButton) {
        const key = siteButton.dataset.siteToggle;
        if (openSites.has(key)) {
          openSites.delete(key);
        } else {
          openSites.add(key);
        }
        renderFeed();
      }

      if (groupButton) {
        const key = groupButton.dataset.groupToggle;
        if (openGroups.has(key)) {
          openGroups.delete(key);
        } else {
          openGroups.add(key);
        }
        renderFeed();
      }
    });
    siteFilterEl.addEventListener("change", () => {
      selectedSite = siteFilterEl.value;
      renderFeed();
    });
    feedSearchEl.addEventListener("input", renderFeed);
    loadFeed();
  </script>
</body>
</html>
