<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Routes</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .route-heading {
      min-width: 0;
      flex: 1 1 auto;
      text-align: center;
    }

    .route-heading h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .back-button {
      border-color: #8a94a6;
      background: #ffffff;
      color: #344054;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .back-button:hover,
    .back-button:focus-visible {
      border-color: #2468f2;
      background: #ffffff;
      color: #2468f2;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .routes-summary {
      margin: 22px 0 30px;
      padding-bottom: 26px;
      border-bottom: 1px solid #d8dee8;
    }

    .routes-summary-title {
      margin: 0 0 12px;
      color: #172033;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }

    .search-bar {
      margin: 28px 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .route-heading {
        text-align: left;
      }

      .nav-actions {
        margin-left: -12px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <div class="route-heading" aria-labelledby="page-title">
        <h1 id="page-title">routes</h1>
      </div>
      <nav class="nav-actions" aria-label="Page actions">
        <a class="home-button back-button" href="/polaris-web/index.html" id="back-link">back</a>
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <div class="search-bar">
      <input class="search-input" type="search" id="routes-search" placeholder="Search all columns or use filters like site:310 fqdn:core vlan:45 subnet:10.0" autocomplete="off">
    </div>
    <p class="status" id="routes-count">Loading routes data...</p>
    <section class="routes-summary" id="routes-summary" aria-live="polite"></section>
    <section id="routes-results"></section>
  </main>

  <script>
    const routesSearchEl = document.getElementById("routes-search");
    const routesCountEl = document.getElementById("routes-count");
    const routesResultsEl = document.getElementById("routes-results");
    const routesSummaryEl = document.getElementById("routes-summary");
    const pageTitleEl = document.getElementById("page-title");
    const backLinkEl = document.getElementById("back-link");
    const selectedSite = new URLSearchParams(window.location.search).get("site");
    const routesFile = "/api/enterprise_routing";
    const routesSourceName = "enterprise_routing.db";
    const siteSorter = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
    const columns = [
      { key: "site", label: "site" },
      { key: "fqdn", label: "fqdn" },
      { key: "vlanId", label: "vlan_id" },
      { key: "subnet", label: "subnet" }
    ];
    const aliases = {
      site: "site",
      device: "fqdn",
      fqdn: "fqdn",
      host: "fqdn",
      hostname: "fqdn",
      vlan: "vlanId",
      vlanid: "vlanId",
      vlan_id: "vlanId",
      subnet: "subnet",
      network: "subnet",
      route: "subnet"
    };
    let routeRows = [];
    let routesUpdated = "";

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function getRoutesRecords(data) {
      if (Array.isArray(data)) {
        return data;
      }

      return data?.records || data?.routes || data?.routing || [];
    }

    function normalizeRows(rows) {
      return rows.map((row) => ({
        site: getFirstValue(row, ["site", "Site"]),
        fqdn: getFirstValue(row, ["fqdn", "FQDN", "device", "Device"]),
        vlanId: getFirstValue(row, ["vlan_id", "VLAN_ID", "vlanId", "VLAN"]),
        subnet: getFirstValue(row, ["subnet", "Subnet", "network", "Network"]),
        routable: getFirstValue(row, ["routable", "Routable"])
      }));
    }

    function vlanSortValue(value) {
      const match = String(value).match(/\d+/);
      return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
    }

    function sortRows(rows) {
      return [...rows].sort((a, b) => (
        siteSorter.compare(a.site, b.site) ||
        a.fqdn.localeCompare(b.fqdn) ||
        vlanSortValue(a.vlanId) - vlanSortValue(b.vlanId) ||
        a.subnet.localeCompare(b.subnet)
      ));
    }

    function subnetSortValue(value) {
      const match = String(value).match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)(?:\/(\d+))?/);
      if (!match) {
        return null;
      }

      return {
        address: match.slice(1, 5).reduce((total, part) => (total * 256) + Number(part), 0),
        cidr: match[5] === undefined ? Number.MAX_SAFE_INTEGER : Number(match[5])
      };
    }

    function sortSubnets(subnets) {
      return [...subnets].sort((a, b) => {
        const subnetA = subnetSortValue(a);
        const subnetB = subnetSortValue(b);

        if (subnetA && subnetB) {
          return subnetA.address - subnetB.address || subnetA.cidr - subnetB.cidr;
        }

        if (subnetA) {
          return -1;
        }

        if (subnetB) {
          return 1;
        }

        return a.localeCompare(b);
      });
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function columnValueMatches(value, expected, columnKey) {
      const actual = String(value ?? "").trim().toLowerCase();
      const wanted = String(expected ?? "").trim().toLowerCase();

      if (columnKey === "vlanId") {
        const actualNumber = Number(actual);
        const wantedNumber = Number(wanted);
        if (Number.isFinite(actualNumber) && Number.isFinite(wantedNumber)) {
          return actualNumber === wantedNumber;
        }

        return actual === wanted;
      }

      return valueMatches(value, expected);
    }

    function rowMatchesToken(row, token) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key);

        if (columnKey && value) {
          return columnValueMatches(row[columnKey], value, columnKey);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesSearch(row, query) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token));
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        return '<div class="empty">No records match the current search.</div>';
      }

      const headers = columns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join("");
      const body = rows.map((row) => `
        <tr>
          ${columns.map((column) => `<td>${escapeHtml(row[column.key] ?? "-")}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function isRoutableRoute(row) {
      return String(row.routable || "").trim().toLowerCase() === "yes";
    }

    function routeSubnetSummaries(rows) {
      const subnetMap = new Map();
      rows.forEach((row) => {
        if (!isRoutableRoute(row)) {
          return;
        }

        const subnet = String(row.subnet || "").trim();
        if (subnet && subnet !== "-") {
          if (!subnetMap.has(subnet)) {
            subnetMap.set(subnet, new Set());
          }

          const device = String(row.fqdn || "").trim();
          if (device && device !== "-") {
            subnetMap.get(subnet).add(device);
          }
        }
      });

      return sortSubnets([...subnetMap.keys()]).map((subnet) => ({
        subnet,
        devices: [...subnetMap.get(subnet)].sort((a, b) => siteSorter.compare(a, b))
      }));
    }

    function renderRoutesSummary(rows) {
      const subnetSummaries = routeSubnetSummaries(rows);
      if (subnetSummaries.length === 0) {
        routesSummaryEl.innerHTML = `
          <p class="routes-summary-title">unique subnets(0)</p>
          <div class="empty">No unique subnets found.</div>
        `;
        return;
      }

      const subnetRows = subnetSummaries.map((summary, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(summary.subnet)}</td>
          <td>${escapeHtml(summary.devices.join(", ") || "-")}</td>
        </tr>
      `).join("");

      routesSummaryEl.innerHTML = `
        <p class="routes-summary-title">unique routable subnets(${subnetSummaries.length}) from routable routes(${rows.filter(isRoutableRoute).length})</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Subnet</th>
                <th>Devices</th>
              </tr>
            </thead>
            <tbody>${subnetRows}</tbody>
          </table>
        </div>
      `;
    }

    function renderResults() {
      const query = routesSearchEl.value.trim();
      const visibleRows = routeRows.filter((row) => rowMatchesSearch(row, query));
      const countLabel = query
        ? `Showing ${visibleRows.length} of ${routeRows.length} routes`
        : `Showing ${routeRows.length} routes`;

      routesCountEl.textContent = `${countLabel} from ${routesSourceName}${routesUpdated}`;
      renderRoutesSummary(visibleRows);
      routesResultsEl.innerHTML = renderTable(visibleRows);
    }

    async function loadRoutes() {
      try {
        const routesUrl = selectedSite ? `${routesFile}?site=${encodeURIComponent(selectedSite)}` : routesFile;
        const response = await fetch(routesUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${routesUrl} (${response.status})`);
        }

        const data = await response.json();
        routesUpdated = data.last_updated ? `, updated ${data.last_updated}` : "";
        const rows = normalizeRows(getRoutesRecords(data));
        routeRows = sortRows(selectedSite ? rows.filter((row) => String(row.site) === selectedSite) : rows);
        renderResults();
      } catch (error) {
        routesCountEl.textContent = "Unable to load routes data.";
        routesResultsEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read enterprise_routing.db.</div>';
        console.error(error);
      }
    }

    routesSearchEl.addEventListener("input", renderResults);
    if (selectedSite) {
      pageTitleEl.textContent = `routes site ${selectedSite}`;
      backLinkEl.href = `/polaris-web/site.html?site=${encodeURIComponent(selectedSite)}`;
      routesSearchEl.placeholder = `Search routes for site ${selectedSite} or use filters like fqdn:core vlan:45 subnet:10.0`;
    }
    loadRoutes();
  </script>
</body>
</html>
