<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Access Points</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .home-button,
    .secondary-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-button,
    .secondary-button {
      border-color: #8a94a6;
      background: #ffffff;
      color: #344054;
    }

    .home-button:hover,
    .home-button:focus-visible,
    .secondary-button:hover,
    .secondary-button:focus-visible {
      border-color: #2468f2;
      background: #1d58cf;
      color: #ffffff;
      outline: none;
    }

    .back-button:hover,
    .back-button:focus-visible {
      background: #ffffff;
      color: #2468f2;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .status-list {
      display: inline-block;
      margin: 8px auto 0;
      padding-left: 20px;
      text-align: left;
    }

    .upload-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }

    .file-input {
      min-height: 40px;
      flex: 1 1 260px;
      padding: 8px 10px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .photo-card {
      overflow: hidden;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .photo-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .photo-button:focus-visible {
      outline: 3px solid rgba(36, 104, 242, 0.28);
      outline-offset: -3px;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      object-fit: cover;
      background: #eef3f8;
    }

    .photo-name {
      margin: 0;
      padding: 10px 12px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .photo-actions {
      display: grid;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .photo-actions[hidden] {
      display: none;
    }

    .photo-edit-toggle {
      margin: 0 12px 12px;
    }

    .rename-input {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 13px;
    }

    .photo-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .danger-button {
      border-color: #d92d20;
      color: #b42318;
    }

    .danger-button:hover,
    .danger-button:focus-visible {
      border-color: #d92d20;
      background: #d92d20;
      color: #ffffff;
    }

    .photo-viewer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 18px;
      background: rgba(15, 23, 42, 0.88);
    }

    .photo-viewer[hidden] {
      display: none;
    }

    .photo-viewer-header,
    .photo-viewer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #ffffff;
    }

    .photo-viewer-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .photo-viewer-stage {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 58px;
    }

    .photo-viewer-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      background: #0f172a;
      object-fit: contain;
    }

    .viewer-button {
      min-height: 40px;
      min-width: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    .viewer-button:hover,
    .viewer-button:focus-visible {
      background: rgba(255, 255, 255, 0.22);
      outline: none;
    }

    .viewer-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #photo-viewer-prev,
    #photo-viewer-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    #photo-viewer-prev {
      left: 0;
    }

    #photo-viewer-next {
      right: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .photo-viewer-stage {
        padding: 0;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <nav class="nav-actions" aria-label="Page navigation">
        <a class="home-button back-button" href="#" id="back-link">back</a>
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Wireless</p>
      <h1 id="page-title">Access Points</h1>
    </section>

    <form class="upload-form" id="access-point-photo-form" action="/api/access_point_photos" method="post" enctype="multipart/form-data">
      <input type="hidden" name="site" id="site-input">
      <input class="file-input" type="file" id="access-point-photo-input" name="photos" accept="image/*" multiple>
      <button class="secondary-button" type="submit" id="access-point-photo-upload">upload access_point_photos</button>
    </form>
    <p class="status" id="access-point-photo-status" hidden></p>
    <p class="status" id="access-point-photo-count" hidden></p>
    <section id="access-point-photo-results" aria-live="polite"></section>
  </main>

  <section class="photo-viewer" id="photo-viewer" aria-modal="true" role="dialog" aria-labelledby="photo-viewer-title" hidden>
    <div class="photo-viewer-header">
      <p class="photo-viewer-title" id="photo-viewer-title"></p>
      <button class="viewer-button" type="button" id="photo-viewer-close">close</button>
    </div>
    <div class="photo-viewer-stage" id="photo-viewer-stage">
      <button class="viewer-button" type="button" id="photo-viewer-prev" aria-label="previous photo">prev</button>
      <img class="photo-viewer-image" id="photo-viewer-image" alt="">
      <button class="viewer-button" type="button" id="photo-viewer-next" aria-label="next photo">next</button>
    </div>
    <div class="photo-viewer-footer">
      <span id="photo-viewer-count"></span>
      <span id="photo-viewer-meta"></span>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const siteId = params.get("site") || "";
    const backLinkEl = document.getElementById("back-link");
    const siteInputEl = document.getElementById("site-input");
    const pageTitleEl = document.getElementById("page-title");
    const formEl = document.getElementById("access-point-photo-form");
    const inputEl = document.getElementById("access-point-photo-input");
    const uploadButtonEl = document.getElementById("access-point-photo-upload");
    const statusEl = document.getElementById("access-point-photo-status");
    const countEl = document.getElementById("access-point-photo-count");
    const resultsEl = document.getElementById("access-point-photo-results");
    const photoViewerEl = document.getElementById("photo-viewer");
    const photoViewerTitleEl = document.getElementById("photo-viewer-title");
    const photoViewerImageEl = document.getElementById("photo-viewer-image");
    const photoViewerCountEl = document.getElementById("photo-viewer-count");
    const photoViewerMetaEl = document.getElementById("photo-viewer-meta");
    const photoViewerPrevEl = document.getElementById("photo-viewer-prev");
    const photoViewerNextEl = document.getElementById("photo-viewer-next");
    const photoViewerCloseEl = document.getElementById("photo-viewer-close");
    const photoViewerStageEl = document.getElementById("photo-viewer-stage");
    const accessPointPhotosFile = "/api/access_point_photos";
    let currentPhotoList = [];
    let currentPhotoIndex = 0;
    let photoTouchStartX = 0;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function setStatus(message) {
      statusEl.textContent = message;
      statusEl.hidden = !message;
    }

    function setStatusHtml(message) {
      statusEl.innerHTML = message;
      statusEl.hidden = !message;
    }

    function setCount(message) {
      countEl.textContent = message;
      countEl.hidden = !message;
    }

    function renderPhotos(photos) {
      currentPhotoList = photos;
      setCount(`showing ${photos.length} access point photo${photos.length === 1 ? "" : "s"} for site ${siteId}`);

      if (photos.length === 0) {
        resultsEl.innerHTML = '<div class="empty">No access point photos uploaded for this site.</div>';
        return;
      }

      resultsEl.innerHTML = `
        <div class="photo-grid">
          ${photos.map((photo, index) => `
            <article class="photo-card">
              <button class="photo-button" type="button" data-photo-index="${index}">
                <img src="${escapeHtml(photo.url)}" alt="site ${escapeHtml(siteId)} access point photo">
              </button>
              <p class="photo-name">${escapeHtml(photo.filename || `access point photo ${index + 1}`)}</p>
              <button class="secondary-button photo-edit-toggle" type="button" data-edit-index="${index}" aria-expanded="false">edit</button>
              <div class="photo-actions" id="photo-actions-${index}" hidden>
                <input class="rename-input" type="text" value="${escapeHtml(photo.filename || "")}" aria-label="new filename for ${escapeHtml(photo.filename || `access point photo ${index + 1}`)}" data-rename-input="${index}">
                <div class="photo-action-buttons">
                  <button class="secondary-button" type="button" data-rename-index="${index}">rename</button>
                  <button class="secondary-button danger-button" type="button" data-delete-index="${index}">delete</button>
                </div>
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function updatePhotoViewer() {
      const photo = currentPhotoList[currentPhotoIndex];
      if (!photo) {
        closePhotoViewer();
        return;
      }

      photoViewerTitleEl.textContent = photo.filename || `access point photo ${currentPhotoIndex + 1}`;
      photoViewerImageEl.src = photo.url;
      photoViewerImageEl.alt = `site ${siteId} access point photo ${photo.filename || currentPhotoIndex + 1}`;
      photoViewerCountEl.textContent = `${currentPhotoIndex + 1} of ${currentPhotoList.length}`;
      photoViewerMetaEl.textContent = "";
      photoViewerPrevEl.disabled = currentPhotoList.length <= 1;
      photoViewerNextEl.disabled = currentPhotoList.length <= 1;
    }

    function openPhotoViewer(index) {
      if (!currentPhotoList[index]) {
        return;
      }

      currentPhotoIndex = index;
      updatePhotoViewer();
      photoViewerEl.hidden = false;
      document.body.style.overflow = "hidden";
      photoViewerCloseEl.focus();
    }

    function closePhotoViewer() {
      photoViewerEl.hidden = true;
      photoViewerImageEl.removeAttribute("src");
      document.body.style.overflow = "";
    }

    function movePhotoViewer(offset) {
      if (currentPhotoList.length <= 1) {
        return;
      }

      currentPhotoIndex = (currentPhotoIndex + offset + currentPhotoList.length) % currentPhotoList.length;
      updatePhotoViewer();
    }

    async function fetchPhotos() {
      const response = await fetch(`${accessPointPhotosFile}?site=${encodeURIComponent(siteId)}`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load access_point_photos (${response.status})`);
      }

      return response.json();
    }

    async function loadPhotos() {
      if (!siteId) {
        setCount("Missing site ID.");
        resultsEl.innerHTML = '<div class="error">Open this page from a site wireless menu.</div>';
        return;
      }

      try {
        const data = await fetchPhotos();
        renderPhotos(data.photos || []);
      } catch (error) {
        setCount("Unable to load access_point_photos.");
        resultsEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read site photos.</div>';
        console.error(error);
      }
    }

    async function uploadPhotos(event) {
      event.preventDefault();

      if (!inputEl.files.length) {
        setStatus("select one or more access_point_photos first");
        return;
      }

      const formData = new FormData();
      formData.append("site", siteId);
      for (const file of inputEl.files) {
        formData.append("photos", file);
      }

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 120000);

      try {
        uploadButtonEl.disabled = true;
        uploadButtonEl.textContent = "uploading...";
        setStatus(`uploading ${inputEl.files.length} access_point_photo${inputEl.files.length === 1 ? "" : "s"}...`);

        const response = await fetch(accessPointPhotosFile, {
          method: "POST",
          body: formData,
          signal: controller.signal
        });
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.message || `upload failed (${response.status})`);
        }

        const data = await response.json();
        inputEl.value = "";
        const skipped = data.skipped?.length ? `, skipped ${data.skipped.length} unsupported file${data.skipped.length === 1 ? "" : "s"}` : "";
        const uploaded = data.uploaded || [];
        const savedNames = uploaded.map((photo) => `
          <li>${escapeHtml(photo.original_filename === photo.filename ? photo.filename : `${photo.original_filename || "uploaded file"} saved as ${photo.filename}`)}</li>
        `).join("");
        setStatusHtml(`
          uploaded ${uploaded.length} access point photo${uploaded.length === 1 ? "" : "s"}${skipped}
          ${savedNames ? `<ul class="status-list">${savedNames}</ul>` : ""}
        `);
        renderPhotos(data.photos || []);
      } catch (error) {
        setStatus(error.name === "AbortError" ? "upload timed out after 120 seconds" : error.message);
        console.error(error);
      } finally {
        window.clearTimeout(timeoutId);
        uploadButtonEl.disabled = false;
        uploadButtonEl.textContent = "upload access_point_photos";
      }
    }

    function togglePhotoEdit(index) {
      const actions = document.getElementById(`photo-actions-${index}`);
      const button = resultsEl.querySelector(`[data-edit-index="${index}"]`);
      if (!actions || !button) {
        return;
      }

      const shouldShow = actions.hidden;
      actions.hidden = !shouldShow;
      button.textContent = shouldShow ? "hide edit" : "edit";
      button.setAttribute("aria-expanded", String(shouldShow));
      if (shouldShow) {
        resultsEl.querySelector(`[data-rename-input="${index}"]`)?.focus();
      }
    }

    async function renamePhoto(index) {
      const photo = currentPhotoList[index];
      const input = resultsEl.querySelector(`[data-rename-input="${index}"]`);
      const newName = input?.value.trim() || "";
      if (!photo || !newName) {
        setStatus("enter a filename before renaming");
        return;
      }

      try {
        setStatus(`renaming ${photo.filename}...`);
        const response = await fetch(`${accessPointPhotosFile}/${encodeURIComponent(photo.filename)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            site: siteId,
            filename: newName
          })
        });
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.message || `rename failed (${response.status})`);
        }

        const data = await response.json();
        setStatus(`renamed ${photo.filename} to ${data.renamed?.filename || newName}`);
        renderPhotos(data.photos || []);
      } catch (error) {
        setStatus(error.message);
        console.error(error);
      }
    }

    async function deletePhoto(index) {
      const photo = currentPhotoList[index];
      if (!photo) {
        return;
      }

      if (!window.confirm(`delete ${photo.filename}?`)) {
        return;
      }

      try {
        setStatus(`deleting ${photo.filename}...`);
        const response = await fetch(`${accessPointPhotosFile}/${encodeURIComponent(photo.filename)}?site=${encodeURIComponent(siteId)}`, {
          method: "DELETE"
        });
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.message || `delete failed (${response.status})`);
        }

        const data = await response.json();
        closePhotoViewer();
        setStatus(`deleted ${photo.filename}`);
        renderPhotos(data.photos || []);
      } catch (error) {
        setStatus(error.message);
        console.error(error);
      }
    }

    siteInputEl.value = siteId;
    backLinkEl.href = siteId
      ? `/polaris-web/site.html?site=${encodeURIComponent(siteId)}`
      : "/polaris-web/index.html";
    pageTitleEl.textContent = siteId ? `${siteId} Access Points` : "Access Points";
    inputEl.addEventListener("change", () => {
      setStatus(inputEl.files.length ? `${inputEl.files.length} access_point_photo${inputEl.files.length === 1 ? "" : "s"} selected` : "");
    });
    formEl.addEventListener("submit", uploadPhotos);
    resultsEl.addEventListener("click", (event) => {
      const editButton = event.target.closest("[data-edit-index]");
      if (editButton) {
        togglePhotoEdit(Number(editButton.dataset.editIndex));
        return;
      }

      const renameButton = event.target.closest("[data-rename-index]");
      if (renameButton) {
        renamePhoto(Number(renameButton.dataset.renameIndex));
        return;
      }

      const deleteButton = event.target.closest("[data-delete-index]");
      if (deleteButton) {
        deletePhoto(Number(deleteButton.dataset.deleteIndex));
        return;
      }

      const photoButton = event.target.closest("[data-photo-index]");
      if (photoButton) {
        openPhotoViewer(Number(photoButton.dataset.photoIndex));
      }
    });
    photoViewerCloseEl.addEventListener("click", closePhotoViewer);
    photoViewerPrevEl.addEventListener("click", () => movePhotoViewer(-1));
    photoViewerNextEl.addEventListener("click", () => movePhotoViewer(1));
    photoViewerEl.addEventListener("click", (event) => {
      if (event.target === photoViewerEl) {
        closePhotoViewer();
      }
    });
    photoViewerStageEl.addEventListener("touchstart", (event) => {
      photoTouchStartX = event.changedTouches[0]?.clientX || 0;
    }, { passive: true });
    photoViewerStageEl.addEventListener("touchend", (event) => {
      const endX = event.changedTouches[0]?.clientX || 0;
      const distance = endX - photoTouchStartX;
      if (Math.abs(distance) >= 40) {
        movePhotoViewer(distance > 0 ? -1 : 1);
      }
    }, { passive: true });
    document.addEventListener("keydown", (event) => {
      if (photoViewerEl.hidden) {
        return;
      }
      if (event.key === "Escape") {
        closePhotoViewer();
      } else if (event.key === "ArrowLeft") {
        movePhotoViewer(-1);
      } else if (event.key === "ArrowRight") {
        movePhotoViewer(1);
      }
    });
    loadPhotos();
  </script>
</body>
</html>
