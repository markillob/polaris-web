<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Endpoints</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 0 0 18px;
    }

    .metric {
      padding: 16px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
      line-height: 1;
    }

    .metric-link,
    .table-link {
      color: #2468f2;
      font-weight: 800;
      text-decoration: none;
    }

    .metric-link:hover,
    .metric-link:focus-visible,
    .table-link:hover,
    .table-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .summary-section {
      margin: 0 0 22px;
    }

    .summary-section h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .search-bar {
      margin: 0 0 14px;
    }

    .endpoint-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .vlan-filter-panel {
      margin: 0 0 18px;
      padding: 14px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
    }

    .vlan-filter-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .vlan-filter-title {
      margin: 0;
      color: #39445a;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .vlan-filter-actions,
    .vlan-filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vlan-filter-options {
      max-height: 150px;
      overflow: auto;
    }

    .secondary-button,
    .vlan-option {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #8a94a6;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .secondary-button:hover,
    .secondary-button:focus-visible,
    .vlan-option:hover,
    .vlan-option:focus-within {
      border-color: #2468f2;
      color: #2468f2;
      outline: none;
    }

    .vlan-option input {
      margin: 0 6px 0 0;
    }

    .vlan-option:has(input:checked) {
      border-color: #2468f2;
      background: #2468f2;
      color: #ffffff;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .hero {
        margin: 36px auto 24px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Operations</p>
      <h1 id="page-title">Endpoints</h1>
    </section>

    <div class="search-bar">
      <input class="search-input" type="search" id="endpoints-search" placeholder="Search all columns or use filters like site:310 hostname:AP114 vlan:45 status:true last_seen:2026" autocomplete="off">
    </div>
    <div class="endpoint-actions">
      <button class="secondary-button" type="button" id="endpoint-export">export csv</button>
    </div>
    <section class="vlan-filter-panel" id="vlan-filter-panel" aria-label="VLAN filter" hidden>
      <div class="vlan-filter-header">
        <p class="vlan-filter-title">vlans</p>
        <div class="vlan-filter-actions">
          <button class="secondary-button" type="button" id="vlan-select-all">select all</button>
          <button class="secondary-button" type="button" id="vlan-clear-all">clear all</button>
        </div>
      </div>
      <div class="vlan-filter-options" id="vlan-filter-options"></div>
    </section>
    <p class="status" id="endpoints-count">Loading endpoints data...</p>
    <section id="endpoints-summary"></section>
    <section id="endpoints-results"></section>
  </main>

  <script>
    const endpointsSearchEl = document.getElementById("endpoints-search");
    const endpointsCountEl = document.getElementById("endpoints-count");
    const endpointsSummaryEl = document.getElementById("endpoints-summary");
    const endpointsResultsEl = document.getElementById("endpoints-results");
    const vlanFilterPanelEl = document.getElementById("vlan-filter-panel");
    const vlanFilterOptionsEl = document.getElementById("vlan-filter-options");
    const vlanSelectAllEl = document.getElementById("vlan-select-all");
    const vlanClearAllEl = document.getElementById("vlan-clear-all");
    const endpointExportEl = document.getElementById("endpoint-export");
    const endpointsFile = "/api/enterprise_endpoints";
    const endpointsSourceName = "enterprise_endpoints.db";
    const siteSorter = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
    const columns = [
      { key: "site", label: "Site" },
      { key: "device", label: "Device" },
      { key: "hostname", label: "Hostname" },
      { key: "entryIp", label: "Endpoint IP" },
      { key: "entryMac", label: "Endpoint MAC" },
      { key: "vlan", label: "VLAN" },
      { key: "devicePort", label: "device_port" },
      { key: "status", label: "STATUS" },
      { key: "lastSeen", label: "last_seen" }
    ];
    const aliases = {
      site: "site",
      device: "device",
      fqdn: "device",
      host: "hostname",
      hostname: "hostname",
      name: "hostname",
      ip: "entryIp",
      entryip: "entryIp",
      entry_ip: "entryIp",
      endpointip: "entryIp",
      endpoint_ip: "entryIp",
      mac: "entryMac",
      entrymac: "entryMac",
      entry_mac: "entryMac",
      endpointmac: "entryMac",
      endpoint_mac: "entryMac",
      vlan: "vlan",
      port: "devicePort",
      interface: "devicePort",
      deviceport: "devicePort",
      device_port: "devicePort",
      status: "status",
      active: "status",
      state: "status",
      lastseen: "lastSeen",
      last_seen: "lastSeen"
    };
    let endpointRows = [];
    let visibleEndpointRows = [];
    let endpointsUpdated = "";
    let availableVlans = [];
    let selectedVlans = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function normalizeRows(rows) {
      return rows.map((row) => ({
        site: getFirstValue(row, ["site", "Site"]),
        device: getFirstValue(row, ["device_fqdn", "Device_FQDN"]),
        hostname: getFirstValue(row, ["Hostname", "hostname"]),
        entryIp: getFirstValue(row, ["entry_ip", "Entry_IP"]),
        entryMac: getFirstValue(row, ["entry_mac", "Entry_MAC"]),
        vlan: getFirstValue(row, ["entry_vlan", "Entry_VLAN"]),
        devicePort: getFirstValue(row, ["device_port", "Device_Port", "Entry_Port"]),
        status: getFirstValue(row, ["active", "Active", "status", "Status"]),
        lastSeen: getFirstValue(row, ["last_seen", "Last_Seen", "lastSeen"])
      }));
    }

    function vlanSortValue(value) {
      const match = String(value).match(/\d+/);
      return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
    }

    function statusSortValue(value) {
      const normalized = String(value).toLowerCase();
      if (["yes", "true", "active", "reachable"].includes(normalized)) {
        return 0;
      }
      if (["no", "false", "inactive", "unreachable"].includes(normalized)) {
        return 1;
      }
      if (normalized.includes("reachable")) {
        return normalized.includes("unreachable") ? 1 : 0;
      }
      return 2;
    }

    function sortEndpointRows(rows) {
      return [...rows].sort((a, b) => (
        vlanSortValue(a.vlan) - vlanSortValue(b.vlan) ||
        statusSortValue(a.status) - statusSortValue(b.status) ||
        siteSorter.compare(a.site, b.site) ||
        a.device.localeCompare(b.device) ||
        a.hostname.localeCompare(b.hostname)
      ));
    }

    function vlanKey(value) {
      const normalized = String(value || "").trim();
      return normalized && normalized !== "-" ? normalized : "-";
    }

    function buildAvailableVlans(rows) {
      return [...new Set(rows.map((row) => vlanKey(row.vlan)))]
        .sort((a, b) => vlanSortValue(a) - vlanSortValue(b) || siteSorter.compare(a, b));
    }

    function rowMatchesVlanSelection(row) {
      if (selectedVlans.size === 0) {
        return false;
      }

      return selectedVlans.has(vlanKey(row.vlan));
    }

    function renderVlanFilters() {
      availableVlans = buildAvailableVlans(endpointRows);
      selectedVlans = new Set(availableVlans);
      vlanFilterPanelEl.hidden = availableVlans.length === 0;
      vlanFilterOptionsEl.innerHTML = availableVlans.map((vlan) => `
        <label class="vlan-option">
          <input type="checkbox" value="${escapeHtml(vlan)}" checked>
          vlan ${escapeHtml(vlan)}
        </label>
      `).join("");
    }

    function normalizeSearchKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getColumnKey(key) {
      const normalizedKey = normalizeSearchKey(key);
      const aliasKey = aliases[normalizedKey];

      if (aliasKey) {
        return aliasKey;
      }

      const column = columns.find((entry) => (
        normalizeSearchKey(entry.key) === normalizedKey ||
        normalizeSearchKey(entry.label) === normalizedKey
      ));

      return column?.key || null;
    }

    function tokenizeSearchQuery(query) {
      return query.match(/(?:[^\s"]+|"[^"]*")+/g)?.map((token) => token.replace(/^"|"$/g, "")) || [];
    }

    function valueMatches(value, expected) {
      return String(value).toLowerCase().includes(expected.toLowerCase());
    }

    function rowMatchesToken(row, token) {
      const separatorIndex = token.indexOf(":");

      if (separatorIndex > 0) {
        const key = token.slice(0, separatorIndex);
        const value = token.slice(separatorIndex + 1);
        const columnKey = getColumnKey(key);

        if (columnKey && value) {
          return valueMatches(row[columnKey], value);
        }
      }

      return Object.values(row).some((value) => valueMatches(value, token));
    }

    function rowMatchesSearch(row, query) {
      const tokens = tokenizeSearchQuery(query);

      if (tokens.length === 0) {
        return true;
      }

      return tokens.every((token) => rowMatchesToken(row, token));
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        return '<div class="empty">No records match the current search.</div>';
      }

      const headers = columns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join("");
      const body = rows.map((row) => `
        <tr>
          ${columns.map((column) => `<td>${escapeHtml(row[column.key] ?? "-")}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function summarizeEndpointRows(rows) {
      const sites = new Map();
      const allVlans = new Set();
      const allMacs = new Set();

      for (const row of rows) {
        const site = String(row.site || "-");
        const vlan = String(row.vlan || "").trim();
        const mac = String(row.entryMac || "").trim().toLowerCase();

        if (!sites.has(site)) {
          sites.set(site, {
            site,
            endpoints: 0,
            vlans: new Set(),
            macs: new Set()
          });
        }

        const summary = sites.get(site);
        summary.endpoints += 1;

        if (vlan && vlan !== "-") {
          summary.vlans.add(vlan);
          allVlans.add(vlan);
        }

        if (mac && mac !== "-") {
          summary.macs.add(mac);
          allMacs.add(mac);
        }
      }

      return {
        totalEndpoints: rows.length,
        totalVlans: allVlans.size,
        totalMacs: allMacs.size,
        sites: [...sites.values()]
          .map((summary) => ({
            site: summary.site,
            vlans: summary.vlans.size,
            endpoints: summary.endpoints,
            mac_addresses: summary.macs.size
          }))
          .sort((a, b) => siteSorter.compare(a.site, b.site))
      };
    }

    function renderSummary(rows) {
      const summary = summarizeEndpointRows(rows);

      endpointsSummaryEl.innerHTML = `
        <section class="summary-section" aria-label="Endpoint summary">
          <div class="summary-grid">
            <article class="metric">
              <span>Total Sites</span>
              <strong>${summary.sites.length}</strong>
            </article>
            <article class="metric">
              <span>Total VLANs</span>
              <strong><a class="metric-link" href="/vlans">${summary.totalVlans}</a></strong>
            </article>
            <article class="metric">
              <span>Total Endpoints</span>
              <strong>${summary.totalEndpoints}</strong>
            </article>
            <article class="metric">
              <span>Total MAC Addresses</span>
              <strong>${summary.totalMacs}</strong>
            </article>
          </div>
          <h2>Endpoint Summary by Site</h2>
          ${renderSummaryTable(summary.sites)}
        </section>
      `;
    }

    function renderSummaryTable(rows) {
      if (rows.length === 0) {
        return '<div class="empty">No endpoint summary records match the current search.</div>';
      }

      const body = rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.site)}</td>
          <td><a class="table-link" href="/vlans?site=${encodeURIComponent(row.site)}">${escapeHtml(row.vlans)}</a></td>
          <td>${escapeHtml(row.endpoints)}</td>
          <td>${escapeHtml(row.mac_addresses)}</td>
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Site</th>
                <th>VLANs</th>
                <th>Total Endpoints</th>
                <th>Total MAC Addresses</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderResults() {
      const query = endpointsSearchEl.value.trim();
      const searchRows = endpointRows.filter((row) => rowMatchesSearch(row, query));
      const visibleRows = searchRows.filter(rowMatchesVlanSelection);
      visibleEndpointRows = visibleRows;
      const filterActive = endpointFiltersActive();
      const countLabel = query || filterActive
        ? `Showing ${visibleRows.length} of ${endpointRows.length} endpoints`
        : `Showing ${endpointRows.length} endpoints`;

      endpointsCountEl.textContent = `${countLabel} from ${endpointsSourceName}${endpointsUpdated}`;
      renderSummary(visibleRows);
      endpointsResultsEl.innerHTML = renderTable(visibleRows);
    }

    function endpointFiltersActive() {
      return endpointsSearchEl.value.trim() !== "" || selectedVlans.size !== availableVlans.length;
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportEndpointCsv(rows, scope) {
      if (!rows.length) {
        endpointsCountEl.textContent = `No ${scope} endpoints to export.`;
        return;
      }

      const header = columns.map((column) => csvEscape(column.label)).join(",");
      const body = rows.map((row) => (
        columns.map((column) => csvEscape(row[column.key])).join(",")
      )).join("\n");
      const csv = `${header}\n${body}\n`;
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      link.href = url;
      link.download = `endpoints_${scope}_${timestamp}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function exportCurrentEndpointCsv() {
      const filtered = endpointFiltersActive();
      exportEndpointCsv(filtered ? visibleEndpointRows : endpointRows, filtered ? "filtered" : "all");
    }

    async function loadEndpoints() {
      try {
        const response = await fetch(endpointsFile, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${endpointsFile} (${response.status})`);
        }

        const data = await response.json();
        endpointsUpdated = data.last_updated ? `, updated ${data.last_updated}` : "";
        endpointRows = sortEndpointRows(normalizeRows(data.endpoints || []));
        renderVlanFilters();
        renderResults();
      } catch (error) {
        endpointsCountEl.textContent = "Unable to load endpoints data.";
        endpointsSummaryEl.innerHTML = "";
        endpointsResultsEl.innerHTML = '<div class="error">Unable to load endpoints data from /polaris/data.</div>';
        console.error(error);
      }
    }

    endpointsSearchEl.addEventListener("input", renderResults);
    endpointExportEl.addEventListener("click", exportCurrentEndpointCsv);
    vlanFilterOptionsEl.addEventListener("change", (event) => {
      if (!event.target.matches('input[type="checkbox"]')) {
        return;
      }

      selectedVlans = new Set(
        [...vlanFilterOptionsEl.querySelectorAll('input[type="checkbox"]:checked')]
          .map((input) => input.value)
      );
      renderResults();
    });
    vlanSelectAllEl.addEventListener("click", () => {
      selectedVlans = new Set(availableVlans);
      vlanFilterOptionsEl.querySelectorAll('input[type="checkbox"]').forEach((input) => {
        input.checked = true;
      });
      renderResults();
    });
    vlanClearAllEl.addEventListener("click", () => {
      selectedVlans.clear();
      vlanFilterOptionsEl.querySelectorAll('input[type="checkbox"]').forEach((input) => {
        input.checked = false;
      });
      renderResults();
    });
    loadEndpoints();
  </script>
</body>
</html>
