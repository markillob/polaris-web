<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris VLANs</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(160px, 220px) minmax(220px, 1fr);
      gap: 12px;
      margin: 0 0 14px;
    }

    .search-input,
    .site-select {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus,
    .site-select:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin: 0 0 18px;
    }

    .metric {
      min-width: 0;
      padding: 16px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(16px, 2vw, 26px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 720px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Endpoint Database</p>
      <h1 id="page-title">vlans</h1>
    </section>

    <section class="controls" aria-label="VLAN controls">
      <select class="site-select" id="site-filter" aria-label="Filter by site">
        <option value="">All sites</option>
      </select>
      <input class="search-input" type="search" id="vlan-search" placeholder="Search site, VLAN, or network device" autocomplete="off">
    </section>
    <p class="status" id="vlan-count">Loading VLANs from enterprise_endpoints.db...</p>
    <section class="summary-grid" id="vlan-summary"></section>
    <section id="vlan-results"></section>
  </main>

  <script>
    const pageTitleEl = document.getElementById("page-title");
    const siteFilterEl = document.getElementById("site-filter");
    const vlanSearchEl = document.getElementById("vlan-search");
    const vlanCountEl = document.getElementById("vlan-count");
    const vlanSummaryEl = document.getElementById("vlan-summary");
    const vlanResultsEl = document.getElementById("vlan-results");
    const initialSite = new URLSearchParams(window.location.search).get("site") || "";
    let selectedSite = initialSite;
    let allRows = [];

    function escapeHtml(value) {
      return String(value ?? "-").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function vlanSortValue(value) {
      const number = Number.parseInt(value, 10);
      return Number.isFinite(number) ? number : Number.MAX_SAFE_INTEGER;
    }

    function rowMatches(row, query) {
      if (!query) {
        return true;
      }

      return [
        row.site,
        row.vlan,
        ...(row.network_devices || [])
      ].some((value) => String(value || "").toLowerCase().includes(query));
    }

    function visibleRows() {
      const query = vlanSearchEl.value.trim().toLowerCase();
      return allRows
        .filter((row) => !selectedSite || row.site === selectedSite)
        .filter((row) => rowMatches(row, query))
        .sort((a, b) => (
          a.site.localeCompare(b.site, undefined, { numeric: true }) ||
          vlanSortValue(a.vlan) - vlanSortValue(b.vlan) ||
          String(a.vlan).localeCompare(String(b.vlan))
        ));
    }

    function renderSiteOptions() {
      const sites = [...new Set(allRows.map((row) => row.site).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      siteFilterEl.innerHTML = '<option value="">All sites</option>';
      for (const site of sites) {
        const option = document.createElement("option");
        option.value = site;
        option.textContent = site;
        siteFilterEl.append(option);
      }
      siteFilterEl.value = selectedSite;
    }

    function renderSummary(rows) {
      const sites = new Set(rows.map((row) => row.site));
      const endpointCount = rows.reduce((total, row) => total + Number(row.endpoint_count || 0), 0);
      const macCount = rows.reduce((total, row) => total + Number(row.mac_count || 0), 0);

      vlanSummaryEl.innerHTML = `
        <article class="metric">
          <span>VLANs</span>
          <strong>${rows.length}</strong>
        </article>
        <article class="metric">
          <span>Sites</span>
          <strong>${sites.size}</strong>
        </article>
        <article class="metric">
          <span>Endpoints</span>
          <strong>${endpointCount}</strong>
        </article>
        <article class="metric">
          <span>MAC Addresses</span>
          <strong>${macCount}</strong>
        </article>
      `;
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        vlanResultsEl.innerHTML = '<div class="empty">No VLANs match the current filter.</div>';
        return;
      }

      const body = rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.site)}</td>
          <td>${escapeHtml(row.vlan)}</td>
          <td>${escapeHtml(row.endpoint_count)}</td>
          <td>${escapeHtml(row.mac_count)}</td>
          <td>${escapeHtml(row.network_device_count)}</td>
          <td>${escapeHtml((row.network_devices || []).join(", "))}</td>
        </tr>
      `).join("");

      vlanResultsEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Site</th>
                <th>VLAN</th>
                <th>Endpoints</th>
                <th>MAC Addresses</th>
                <th>network_devices</th>
                <th>Network Device List</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function render() {
      const rows = visibleRows();
      const siteLabel = selectedSite ? ` for site ${selectedSite}` : "";
      pageTitleEl.textContent = selectedSite ? `vlans site ${selectedSite}` : "vlans";
      vlanCountEl.textContent = `showing ${rows.length} VLAN${rows.length === 1 ? "" : "s"}${siteLabel} from enterprise_endpoints.db`;
      renderSummary(rows);
      renderTable(rows);
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (selectedSite) {
        params.set("site", selectedSite);
      }
      window.history.replaceState(null, "", params.toString() ? `/vlans?${params.toString()}` : "/vlans");
    }

    async function loadVlans() {
      try {
        const response = await fetch("/api/endpoint_vlans", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load VLANs (${response.status})`);
        }

        const data = await response.json();
        allRows = data.vlans || [];
        renderSiteOptions();
        render();
      } catch (error) {
        vlanCountEl.textContent = "Unable to load VLANs.";
        vlanSummaryEl.innerHTML = "";
        vlanResultsEl.innerHTML = '<div class="error">Start the Polaris Flask server with python3 serve_polaris.py so the page can read enterprise_endpoints.db.</div>';
        console.error(error);
      }
    }

    siteFilterEl.addEventListener("change", () => {
      selectedSite = siteFilterEl.value;
      updateUrl();
      render();
    });
    vlanSearchEl.addEventListener("input", render);
    loadVlans();
  </script>
</body>
</html>
