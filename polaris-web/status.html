<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Status</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .search-bar {
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .status-summary {
      display: block;
      margin-bottom: 14px;
    }

    .summary-section {
      margin-bottom: 16px;
    }

    .summary-section h2 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.2;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .metric {
      min-width: 0;
      padding: 14px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(16px, 2vw, 24px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .status-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filter-button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .filter-button:hover,
    .filter-button:focus-visible,
    .filter-button.active {
      border-color: #2468f2;
      background: #eef4ff;
      outline: none;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr.status-row-down td {
      background: #fff0d6;
    }

    tr.status-row-down td:first-child {
      box-shadow: inset 4px 0 0 #f59e0b;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .hero {
        margin: 36px auto 24px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <a class="home-button" href="/polaris-web/index.html">home</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Endpoint Database</p>
      <h1 id="page-title">Status</h1>
    </section>

    <div class="search-bar">
      <input class="search-input" type="search" id="status-search" placeholder="Search network_devices, endpoints, MACs, VLANs, sites, ports, or status" autocomplete="off">
    </div>
    <p class="status" id="status-message">Loading endpoint status from enterprise_endpoints.db...</p>
    <section class="status-summary" id="status-summary"></section>
    <section class="status-filters" id="status-filters" aria-label="Status filters">
      <button class="filter-button active" type="button" data-filter="all">all</button>
      <button class="filter-button" type="button" data-filter="active">active</button>
      <button class="filter-button" type="button" data-filter="inactive">inactive</button>
      <button class="filter-button" type="button" data-filter="unknown">unknown</button>
    </section>
    <section id="status-results"></section>
  </main>

  <script>
    const statusMessageEl = document.getElementById("status-message");
    const statusSummaryEl = document.getElementById("status-summary");
    const statusFiltersEl = document.getElementById("status-filters");
    const statusResultsEl = document.getElementById("status-results");
    const statusSearchEl = document.getElementById("status-search");
    const endpointsFile = "/api/enterprise_endpoints";
    const endpointsSourceName = "enterprise_endpoints.db";
    const inventoryFile = "/api/inventory";
    const inventorySourceName = "inventory.db";
    let statusRows = [];
    let statusFilter = "all";
    let networkDeviceStats = {
      loaded: false,
      total: 0,
      siteCount: 0,
      averagePerSite: 0
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function getFirstValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "-";
    }

    function rowMatchesQuery(row, query) {
      if (!query) {
        return true;
      }

      return Object.values(row).some((value) => String(value).toLowerCase().includes(query));
    }

    function filterStatusRows(rows) {
      const query = statusSearchEl.value.trim().toLowerCase();
      let filteredRows = rows;

      if (statusFilter === "active") {
        filteredRows = rows.filter((row) => row.statusGroup === "active");
      } else if (statusFilter === "inactive") {
        filteredRows = rows.filter((row) => row.statusGroup === "inactive");
      } else if (statusFilter === "unknown") {
        filteredRows = rows.filter((row) => row.statusGroup === "unknown");
      }

      return filteredRows.filter((row) => rowMatchesQuery(row, query));
    }

    function normalizeStatus(row) {
      const active = String(getFirstValue(row, ["active", "Active"])).trim().toLowerCase();
      const status = String(getFirstValue(row, ["status", "Status"])).trim().toLowerCase();

      if (["yes", "true", "active", "reachable"].includes(active) || status === "reachable") {
        return { label: active && active !== "-" ? active : "reachable", group: "active" };
      }

      if (["no", "false", "inactive", "unreachable"].includes(active) || status === "unreachable") {
        return { label: active && active !== "-" ? active : "unreachable", group: "inactive" };
      }

      return { label: "-", group: "unknown" };
    }

    function normalizeEndpointRows(rows) {
      return rows.map((row) => {
        const normalizedStatus = normalizeStatus(row);

        return {
          device: getFirstValue(row, ["device_fqdn", "Device_FQDN"]),
          site: getFirstValue(row, ["site", "Site"]),
          hostname: getFirstValue(row, ["hostname", "Hostname"]),
          entryIp: getFirstValue(row, ["entry_ip", "Entry_IP"]),
          entryMac: getFirstValue(row, ["entry_mac", "Entry_MAC"]),
          vlan: getFirstValue(row, ["entry_vlan", "Entry_VLAN"]),
          devicePort: getFirstValue(row, ["device_port", "Device_Port", "entry_port", "Entry_Port"]),
          status: normalizedStatus.label,
          statusGroup: normalizedStatus.group,
          lastSeen: getFirstValue(row, ["last_seen", "Last_Seen", "lastSeen"])
        };
      });
    }

    function parseInventoryStats(devices) {
      const sites = new Set();

      for (const row of devices || []) {
        const site = String(row.site || "").trim();

        if (site) {
          sites.add(site);
        }
      }

      return {
        loaded: true,
        total: devices.length,
        siteCount: sites.size,
        averagePerSite: sites.size ? devices.length / sites.size : 0
      };
    }

    function formatAverage(value, label) {
      if (!Number.isFinite(value) || value <= 0) {
        return "-";
      }

      const formatted = Number.isInteger(value) ? String(value) : value.toFixed(1);
      return `${formatted} ${label} per site`;
    }

    function renderStatus(rows) {
      const active = rows.filter((row) => row.statusGroup === "active").length;
      const inactive = rows.filter((row) => row.statusGroup === "inactive").length;
      const unknown = rows.filter((row) => row.statusGroup === "unknown").length;
      const sites = new Set(rows.map((row) => row.site).filter((site) => site && site !== "-"));
      const averagePerSite = sites.size ? rows.length / sites.size : 0;
      const networkDeviceTotal = networkDeviceStats.loaded ? networkDeviceStats.total : "-";
      const networkDeviceAverage = networkDeviceStats.loaded ? formatAverage(networkDeviceStats.averagePerSite, "network_devices") : "-";
      const inventorySites = networkDeviceStats.loaded ? networkDeviceStats.siteCount : "-";
      const endpointAverage = formatAverage(averagePerSite, "endpoints");
      const lastUpdated = rows.reduce((latest, row) => row.lastSeen > latest ? row.lastSeen : latest, "");
      const filteredRows = filterStatusRows(rows);

      statusSummaryEl.innerHTML = `
        <section class="summary-section" aria-label="Status counts">
          <h2>Counts</h2>
          <div class="metric-grid">
            <article class="metric">
              <span>Endpoints (MAC Entries)</span>
              <strong>${rows.length}</strong>
            </article>
            <article class="metric">
              <span>network_devices</span>
              <strong>${escapeHtml(networkDeviceTotal)}</strong>
            </article>
            <article class="metric">
              <span>Active Endpoints</span>
              <strong>${active}</strong>
            </article>
            <article class="metric">
              <span>Inactive Endpoints</span>
              <strong>${inactive}</strong>
            </article>
            <article class="metric">
              <span>Unknown Endpoints</span>
              <strong>${unknown}</strong>
            </article>
            <article class="metric">
              <span>Endpoint Sites</span>
              <strong>${sites.size}</strong>
            </article>
            <article class="metric">
              <span>Inventory Sites</span>
              <strong>${escapeHtml(inventorySites)}</strong>
            </article>
          </div>
        </section>
        <section class="summary-section" aria-label="Status averages">
          <h2>Average</h2>
          <div class="metric-grid">
            <article class="metric">
              <span>Endpoints Per Site</span>
              <strong>${escapeHtml(endpointAverage)}</strong>
            </article>
            <article class="metric">
              <span>network_devices Per Site</span>
              <strong>${escapeHtml(networkDeviceAverage)}</strong>
            </article>
          </div>
        </section>
        <section class="summary-section" aria-label="Status metadata">
          <h2>Metadata</h2>
          <div class="metric-grid">
            <article class="metric">
              <span>Endpoint Source</span>
              <strong>${endpointsSourceName}</strong>
            </article>
            <article class="metric">
              <span>Inventory Source</span>
              <strong>${inventorySourceName}</strong>
            </article>
            <article class="metric">
              <span>Last Seen</span>
              <strong>${escapeHtml(lastUpdated || "-")}</strong>
            </article>
          </div>
        </section>
      `;

      if (filteredRows.length === 0) {
        statusMessageEl.textContent = `Showing 0 of ${rows.length} endpoints from ${endpointsSourceName}`;
        statusResultsEl.innerHTML = '<div class="empty">No endpoints match the current filter.</div>';
        return;
      }

      const tableRows = filteredRows.map((row) => {
        const rowClass = row.statusGroup === "inactive" ? ' class="status-row-down"' : "";

        return `
          <tr${rowClass}>
            <td>${escapeHtml(row.device)}</td>
            <td>${escapeHtml(row.site)}</td>
            <td>${escapeHtml(row.hostname)}</td>
            <td>${escapeHtml(row.entryIp)}</td>
            <td>${escapeHtml(row.entryMac)}</td>
            <td>${escapeHtml(row.vlan)}</td>
            <td>${escapeHtml(row.devicePort)}</td>
            <td>${escapeHtml(row.status)}</td>
            <td>${escapeHtml(row.lastSeen)}</td>
          </tr>
        `;
      }).join("");

      statusMessageEl.textContent = `Showing ${filteredRows.length} of ${rows.length} endpoints from ${endpointsSourceName}`;
      statusResultsEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Network Device</th>
                <th>Site</th>
                <th>Hostname</th>
                <th>Endpoint IP</th>
                <th>Endpoint MAC</th>
                <th>VLAN</th>
                <th>device_port</th>
                <th>STATUS</th>
                <th>last_seen</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      `;
    }

    async function loadStatus() {
      try {
        const [endpointsResponse, inventoryResponse] = await Promise.all([
          fetch(endpointsFile, { cache: "no-store" }),
          fetch(inventoryFile, { cache: "no-store" })
        ]);

        if (!endpointsResponse.ok) {
          throw new Error(`Could not load ${endpointsFile} (${endpointsResponse.status})`);
        }

        if (!inventoryResponse.ok) {
          throw new Error(`Could not load ${inventoryFile} (${inventoryResponse.status})`);
        }

        const data = await endpointsResponse.json();
        const inventoryData = await inventoryResponse.json();
        networkDeviceStats = parseInventoryStats(inventoryData.devices || []);
        statusRows = normalizeEndpointRows(data.endpoints || []);
        renderStatus(statusRows);
      } catch (error) {
        statusMessageEl.textContent = "Unable to load endpoint status.";
        statusResultsEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read enterprise_endpoints.db.</div>';
        console.error(error);
      }
    }

    statusFiltersEl.addEventListener("click", (event) => {
      const button = event.target.closest(".filter-button");
      if (!button) {
        return;
      }

      statusFilter = button.dataset.filter;
      statusFiltersEl.querySelectorAll(".filter-button").forEach((filterButton) => {
        filterButton.classList.toggle("active", filterButton === button);
      });
      renderStatus(statusRows);
    });
    statusSearchEl.addEventListener("input", () => renderStatus(statusRows));
    loadStatus();
  </script>
</body>
</html>
