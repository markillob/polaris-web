<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Locations</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .back-button {
      border-color: #8a94a6;
      background: #ffffff;
      color: #344054;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .back-button:hover,
    .back-button:focus-visible {
      border-color: #2468f2;
      background: #ffffff;
      color: #2468f2;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 0 0 18px;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .search-bar {
      margin: 0 0 14px;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ccd5e3;
      border-radius: 8px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 15px;
    }

    .search-input:focus {
      border-color: #2468f2;
      outline: 3px solid rgba(36, 104, 242, 0.14);
    }

    .address-map iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .address-map {
      width: 100%;
      height: 220px;
      overflow: hidden;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .addresses {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .address-card {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
    }

    .address-site {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
    }

    .address-text {
      color: #344054;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .address-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .secondary-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #ffffff;
      color: #2468f2;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .secondary-button:hover,
    .secondary-button:focus-visible {
      background: #2468f2;
      color: #ffffff;
      outline: none;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <nav class="nav-actions" aria-label="Page navigation">
        <a class="home-button back-button" href="/polaris-web/index.html">back</a>
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Inventory Database</p>
      <h1 id="page-title">locations</h1>
    </section>

    <div class="search-bar">
      <input class="search-input" type="search" id="address-search" placeholder="Search site IDs or locations" autocomplete="off">
    </div>
    <p class="status" id="address-status">Loading locations from inventory.db...</p>
    <section class="addresses" id="addresses" aria-live="polite"></section>
  </main>

  <script>
    const addressSearchEl = document.getElementById("address-search");
    const addressStatusEl = document.getElementById("address-status");
    const addressesEl = document.getElementById("addresses");
    const inventoryFile = "/api/inventory";
    const inventorySourceName = "inventory.db";
    let addressRows = [];

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function isUsablePhysicalAddress(value) {
      const normalized = String(value || "").trim().toLowerCase();
      return normalized && !["-", "na", "n/a", "none", "null", "tbd"].includes(normalized);
    }

    function normalizePhysicalAddress(row) {
      let address = String(row.physical_address || "").trim();
      const continuation = String(row.comment_01 || "").trim();

      if (address.startsWith('"') && continuation && !address.endsWith('"')) {
        address = `${address} ${continuation}`;
      }

      return address.replace(/^"+|"+$/g, "").trim();
    }

    function googleMapsUrl(address) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }

    function googleMapsEmbedUrl(address) {
      return `https://maps.google.com/maps?q=${encodeURIComponent(address)}&output=embed`;
    }

    function normalizeAddresses(devices) {
      const addresses = new Map();

      for (const row of devices || []) {
        const site = String(row.site || "").trim();
        const address = normalizePhysicalAddress(row);
        if (!site || !isUsablePhysicalAddress(address)) {
          continue;
        }

        const key = `${site}|${address.toLowerCase()}`;
        if (!addresses.has(key)) {
          addresses.set(key, {
            key,
            site,
            address,
            deviceCount: 0
          });
        }

        addresses.get(key).deviceCount += 1;
      }

      return [...addresses.values()].sort((a, b) => (
        a.site.localeCompare(b.site, undefined, { numeric: true, sensitivity: "base" }) ||
        a.address.localeCompare(b.address)
      ));
    }

    function rowMatchesSearch(row, query) {
      if (!query) {
        return true;
      }

      return [row.site, row.address].some((value) => String(value).toLowerCase().includes(query));
    }

    function renderAddresses() {
      const query = addressSearchEl.value.trim().toLowerCase();
      const rows = addressRows.filter((row) => rowMatchesSearch(row, query));

      if (rows.length === 0) {
        addressStatusEl.textContent = query
          ? `Showing 0 of ${addressRows.length} locations from ${inventorySourceName}`
          : `0 locations from ${inventorySourceName}`;
        addressesEl.innerHTML = '<div class="empty">No locations found.</div>';
        return;
      }

      addressStatusEl.textContent = query
        ? `Showing ${rows.length} of ${addressRows.length} locations from ${inventorySourceName}`
        : `Showing ${rows.length} locations from ${inventorySourceName}`;
      addressesEl.innerHTML = rows.map((row) => `
        <article class="address-card">
          <a class="address-site" href="/polaris-web/site.html?site=${encodeURIComponent(row.site)}">site ${escapeHtml(row.site)}</a>
          <div class="address-text">${escapeHtml(row.address)}</div>
          <div class="address-text">${row.deviceCount} device${row.deviceCount === 1 ? "" : "s"}</div>
          <div class="address-map">
            <iframe title="Google Maps preview for site ${escapeHtml(row.site)}" src="${googleMapsEmbedUrl(row.address)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="address-actions">
            <a class="secondary-button" href="${googleMapsUrl(row.address)}" target="_blank" rel="noopener noreferrer">open maps</a>
          </div>
        </article>
      `).join("");
    }

    async function loadAddresses() {
      try {
        const response = await fetch(inventoryFile, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${inventoryFile} (${response.status})`);
        }

        const data = await response.json();
        addressRows = normalizeAddresses(data.devices || []);
        renderAddresses();
      } catch (error) {
        addressStatusEl.textContent = "Unable to load locations.";
        addressesEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read inventory.db.</div>';
        console.error(error);
      }
    }

    addressSearchEl.addEventListener("input", renderAddresses);
    loadAddresses();
  </script>
</body>
</html>
