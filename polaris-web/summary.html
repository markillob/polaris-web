<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Polaris Summary</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(45, 118, 255, 0.10), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 42%, #eef3f8 100%);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid rgba(204, 213, 227, 0.75);
      gap: 16px;
    }

    .brand,
    .home-button {
      color: #101828;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .home-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #2468f2;
      border-radius: 8px;
      background: #2468f2;
      color: #ffffff;
      font-size: 14px;
    }

    .back-button {
      border-color: #8a94a6;
      background: #ffffff;
      color: #344054;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #1d58cf;
      outline: none;
    }

    .back-button:hover,
    .back-button:focus-visible {
      border-color: #2468f2;
      background: #ffffff;
      color: #2468f2;
      outline: none;
    }

    .hero {
      max-width: 820px;
      margin: 48px auto 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2468f2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .status {
      margin: 18px 0;
      color: #556070;
      font-size: 14px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .summary-section {
      margin: 28px 0;
    }

    .summary-section h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .metric {
      padding: 16px;
      border: 1px solid rgba(204, 213, 227, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    .metric span {
      display: block;
      color: #667080;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
      line-height: 1.2;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(20, 35, 66, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f0f3f8;
      color: #39445a;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty,
    .error {
      padding: 16px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
    }

    .error {
      border-color: #efb4b4;
      color: #8a1f1f;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 14px;
      }

      .hero {
        margin: 36px auto 24px;
      }
    }
  </style>
  <link rel="stylesheet" href="/polaris-web/theme.css">
  <script defer src="/polaris-web/theme.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/polaris-web/index.html">Polaris</a>
      <nav class="nav-actions" aria-label="Page actions">
        <a class="home-button back-button" href="/polaris-web/index.html">back</a>
        <a class="home-button" href="/polaris-web/index.html">home</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Network Visibility Tool</p>
      <h1 id="page-title">Summary</h1>
    </section>

    <section id="summary-results" aria-live="polite">
      <div class="empty">Loading summary...</div>
    </section>
  </main>

  <script>
    const summaryResultsEl = document.getElementById("summary-results");
    const inventoryFile = "/api/inventory";
    const inventorySourceName = "inventory.db";
    const routesFile = "/polaris/data/enterprise_routing.json";
    const operationsFile = "/polaris/data/site_operations.json";

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function formatLabel(value) {
      return String(value)
        .replace(/_/g, " ")
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function renderValue(value) {
      if (value && typeof value === "object") {
        return Object.entries(value)
          .map(([key, entryValue]) => `${formatLabel(key)}: ${entryValue}`)
          .join(", ");
      }

      return value ?? "-";
    }

    function renderObjectMetrics(object) {
      return Object.entries(object || {}).map(([key, value]) => `
        <article class="metric">
          <span>${escapeHtml(formatLabel(key))}</span>
          <strong>${escapeHtml(renderValue(value))}</strong>
        </article>
      `).join("");
    }

    function renderJsonTable(rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        return '<div class="empty">No records found.</div>';
      }

      const headers = [...rows.reduce((set, row) => {
        Object.keys(row || {}).forEach((key) => set.add(key));
        return set;
      }, new Set())];

      const tableHeaders = headers.map((header) => `<th>${escapeHtml(formatLabel(header))}</th>`).join("");
      const tableRows = rows.map((row) => `
        <tr>
          ${headers.map((header) => `<td>${escapeHtml(renderValue(row?.[header]))}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${tableHeaders}</tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      `;
    }

    function getRouteRecords(data) {
      if (Array.isArray(data)) {
        return data;
      }

      return data?.records || data?.routes || data?.routing || [];
    }

    function getOperationRecords(data) {
      if (Array.isArray(data)) {
        return data;
      }

      return data?.records || data?.operations || [];
    }

    function countRoutesBySite(records) {
      return records.reduce((counts, record) => {
        const site = String(record?.site ?? record?.Site ?? "").trim();
        if (site) {
          counts.set(site, (counts.get(site) || 0) + 1);
        }
        return counts;
      }, new Map());
    }

    function addRouteCountsToSites(sites, routeCounts) {
      return (sites || []).map((site) => ({
        ...site,
        routes: routeCounts.get(String(site?.site ?? site?.Site ?? "").trim()) || 0
      }));
    }

    function physicalDeviceCount(device) {
      const serials = String(device?.serial_number || "")
        .split(",")
        .map((serial) => serial.trim())
        .filter(Boolean);

      return Math.max(1, serials.length);
    }

    function addCount(map, key, device) {
      const label = String(key || "Unknown").trim() || "Unknown";
      const current = map.get(label) || { network_devices: 0, physical_devices: 0 };
      current.network_devices += 1;
      current.physical_devices += physicalDeviceCount(device);
      map.set(label, current);
    }

    function buildInventorySummary(inventoryData) {
      const devices = inventoryData.devices || [];
      const sites = new Map();
      const deviceTypes = new Map();
      const fleetOverview = new Map();

      for (const device of devices) {
        const site = String(device.site || "").trim();
        if (site) {
          if (!sites.has(site)) {
            sites.set(site, {
              site,
              network_devices: 0,
              physical_devices: 0,
              device_types: {}
            });
          }

          const siteEntry = sites.get(site);
          const type = String(device.device_type || "Unknown").trim() || "Unknown";
          siteEntry.network_devices += 1;
          siteEntry.physical_devices += physicalDeviceCount(device);
          siteEntry.device_types[type] = (siteEntry.device_types[type] || 0) + 1;
        }

        addCount(deviceTypes, device.device_type, device);
        addCount(fleetOverview, device.device_role, device);
      }

      const sortByCount = (a, b) => b.network_devices - a.network_devices || String(a.type || a.role).localeCompare(String(b.type || b.role));

      return {
        metadata: {
          data_file: "data/inventory.db",
          source: inventorySourceName,
          imported_at: inventoryData.imported_at || "-",
          total_rows: inventoryData.total ?? devices.length
        },
        totals: {
          network_devices: devices.length,
          physical_devices: devices.reduce((total, device) => total + physicalDeviceCount(device), 0),
          sites: sites.size
        },
        fleet_overview: [...fleetOverview.entries()]
          .map(([role, counts]) => ({ role, ...counts }))
          .sort(sortByCount),
        device_types: [...deviceTypes.entries()]
          .map(([type, counts]) => ({ type, ...counts }))
          .sort(sortByCount),
        sites: [...sites.values()].sort((a, b) => String(a.site).localeCompare(String(b.site), undefined, { numeric: true, sensitivity: "base" }))
      };
    }

    function countCodeVersions(records) {
      const counts = records.reduce((totals, record) => {
        const codeVersion = String(record?.code_version ?? record?.Code_Version ?? record?.codeVersion ?? "").trim() || "Unknown";
        totals.set(codeVersion, (totals.get(codeVersion) || 0) + 1);
        return totals;
      }, new Map());

      return [...counts.entries()]
        .map(([code_version, devices]) => ({ code_version, devices }))
        .sort((a, b) => b.devices - a.devices || a.code_version.localeCompare(b.code_version));
    }

    function renderSummary(summary, routeCounts = new Map(), totalRoutes = 0, codeVersionRows = []) {
      const metadata = summary.metadata || {};
      const siteCount = summary.sites?.length || summary.totals?.sites || 0;
      const sitesWithRoutes = addRouteCountsToSites(summary.sites || [], routeCounts);
      const totals = {
        ...(summary.totals || {}),
        routes: totalRoutes
      };

      summaryResultsEl.innerHTML = `
        <div class="summary-grid">
          ${renderObjectMetrics(totals)}
        </div>
        <section class="summary-section">
          <h3>Fleet Overview</h3>
          ${renderJsonTable(summary.fleet_overview || [])}
        </section>
        <section class="summary-section">
          <h3>Device Types</h3>
          ${renderJsonTable(summary.device_types || [])}
        </section>
        <section class="summary-section">
          <h3>Code Versions</h3>
          ${renderJsonTable(codeVersionRows)}
        </section>
        <section class="summary-section">
          <h3>Sites</h3>
          ${renderJsonTable(sitesWithRoutes)}
        </section>
        <p class="status">${siteCount} site IDs</p>
        <section class="summary-section">
          <h3>Metadata</h3>
          <div class="summary-grid">
            ${renderObjectMetrics(metadata)}
          </div>
        </section>
      `;
    }

    async function loadSummary() {
      try {
        const inventoryResponse = await fetch(inventoryFile, { cache: "no-store" });
        if (!inventoryResponse.ok) {
          throw new Error(`Could not load ${inventoryFile} (${inventoryResponse.status})`);
        }

        const summary = buildInventorySummary(await inventoryResponse.json());
        let routeCounts = new Map();
        let totalRoutes = 0;
        let codeVersionRows = [];

        try {
          const routesResponse = await fetch(routesFile, { cache: "no-store" });
          if (routesResponse.ok) {
            const routesData = await routesResponse.json();
            const routeRecords = getRouteRecords(routesData);
            routeCounts = countRoutesBySite(routeRecords);
            totalRoutes = Number(routesData?.total) || routeRecords.length;
          }
        } catch (routesError) {
          console.warn("Unable to load route counts for summary.", routesError);
        }

        try {
          const operationsResponse = await fetch(operationsFile, { cache: "no-store" });
          if (operationsResponse.ok) {
            codeVersionRows = countCodeVersions(getOperationRecords(await operationsResponse.json()));
          }
        } catch (operationsError) {
          console.warn("Unable to load code version counts for summary.", operationsError);
        }

        renderSummary(summary, routeCounts, totalRoutes, codeVersionRows);
      } catch (error) {
        summaryResultsEl.innerHTML = '<div class="error">Start the Polaris server with python3 serve_polaris.py so the page can read inventory.db.</div>';
        console.error(error);
      }
    }

    loadSummary();
  </script>
</body>
</html>
